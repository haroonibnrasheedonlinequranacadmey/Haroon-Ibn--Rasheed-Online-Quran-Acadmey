<script>


/* =====================================================
   SUPABASE
===================================================== */

const db =
  supabase.createClient(
    window.SUPABASE_CONFIG.url,
    window.SUPABASE_CONFIG.anonKey
  );


/* =====================================================
   CONSTANTS
===================================================== */

const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday",
  "Sunday"
];


const BASE_TIMEZONE =
  "Asia/Karachi";


const CLASSROOM_BASE_URL =
  "https://haroonibnrasheedonlinequranacadmey.github.io/haroon-quran-classroom/";


/* =====================================================
   SAFE HTML
===================================================== */

function safeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   NORMALIZE DAY
===================================================== */

function normalizeDay(day){

  const value =
    String(day || "")
      .trim()
      .toLowerCase();

  const map = {

    mon:"Monday",
    monday:"Monday",

    tue:"Tuesday",
    tues:"Tuesday",
    tuesday:"Tuesday",

    wed:"Wednesday",
    wednesday:"Wednesday",

    thu:"Thursday",
    thur:"Thursday",
    thurs:"Thursday",
    thursday:"Thursday",

    fri:"Friday",
    friday:"Friday",

    sat:"Saturday",
    saturday:"Saturday",

    sun:"Sunday",
    sunday:"Sunday"

  };

  return map[value] || "";

}


/* =====================================================
   PARSE CLASS DAYS
===================================================== */

function parseClassDays(value){

  if(Array.isArray(value)){

    return value
      .map(normalizeDay)
      .filter(Boolean);

  }


  if(value === null || value === undefined){

    return [];

  }


  const text =
    String(value).trim();


  if(!text){

    return [];

  }


  /* PostgreSQL / JSON array */

  if(
    text.startsWith("[") &&
    text.endsWith("]")
  ){

    try{

      const parsed =
        JSON.parse(text);

      if(Array.isArray(parsed)){

        return parsed
          .map(normalizeDay)
          .filter(Boolean);

      }

    }catch(error){

      console.warn(
        "Could not parse class_days JSON:",
        error
      );

    }

  }


  /* PostgreSQL array format:
     {Monday,Wednesday,Friday}
  */

  let cleaned =
    text
      .replace(/^\{/,"")
      .replace(/\}$/,"");


  return cleaned
    .split(",")
    .map(item =>
      item
        .replace(/^"|"$/g,"")
        .trim()
    )
    .map(normalizeDay)
    .filter(Boolean);

}


/* =====================================================
   FORMAT DURATION
===================================================== */

function formatDuration(minutes){

  const m =
    parseInt(minutes,10);


  if(!m){

    return "";

  }


  if(m < 60){

    return m + " minutes";

  }


  const h =
    Math.floor(m / 60);


  const r =
    m % 60;


  if(r === 0){

    return h +
      (h === 1 ? " hour" : " hours");

  }


  return h + "h " + r + "m";

}


/* =====================================================
   TIMEZONE VALIDATION
===================================================== */

function isValidTimezone(timeZone){

  if(!timeZone){

    return false;

  }


  try{

    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:timeZone
      }
    ).format(new Date());


    return true;

  }catch(error){

    return false;

  }

}


/* =====================================================
   SAFE TIMEZONE
===================================================== */

function safeTimezone(timeZone){

  return isValidTimezone(timeZone)
    ? timeZone
    : BASE_TIMEZONE;

}


/* =====================================================
   GET TIMEZONE OFFSET
===================================================== */

function getTimezoneOffsetMinutes(
  date,
  timeZone
){

  const zone =
    safeTimezone(timeZone);


  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:zone,
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hourCycle:"h23"
      }
    ).formatToParts(date);


  const values = {};


  parts.forEach(part => {

    if(part.type !== "literal"){

      values[part.type] =
        part.value;

    }

  });


  let hour =
    Number(values.hour);


  if(hour === 24){

    hour = 0;

  }


  const asUTC =
    Date.UTC(
      Number(values.year),
      Number(values.month) - 1,
      Number(values.day),
      hour,
      Number(values.minute),
      Number(values.second)
    );


  return Math.round(
    (asUTC - date.getTime()) /
    60000
  );

}


/* =====================================================
   WALL CLOCK → UTC
   DST SAFE / IANA TIMEZONE
===================================================== */

function wallTimeToUTC(
  dateISO,
  timeString,
  timeZone
){

  const zone =
    safeTimezone(timeZone);


  const timeParts =
    String(
      timeString || "00:00:00"
    )
    .split(":");


  const hour =
    parseInt(
      timeParts[0],
      10
    ) || 0;


  const minute =
    parseInt(
      timeParts[1],
      10
    ) || 0;


  const second =
    parseInt(
      timeParts[2],
      10
    ) || 0;


  const dateParts =
    String(dateISO)
      .split("-")
      .map(Number);


  const year =
    dateParts[0];


  const month =
    dateParts[1];


  const day =
    dateParts[2];


  /*
    Treat the wall-clock components as UTC
    temporarily. Then solve the timezone
    offset iteratively.
  */

  const wallMs =
    Date.UTC(
      year,
      month - 1,
      day,
      hour,
      minute,
      second
    );


  let guess =
    new Date(wallMs);


  for(let i = 0; i < 6; i++){

    const offsetMinutes =
      getTimezoneOffsetMinutes(
        guess,
        zone
      );


    const nextMs =
      wallMs -
      (
        offsetMinutes * 60000
      );


    if(
      Math.abs(
        nextMs -
        guess.getTime()
      ) < 1000
    ){

      guess =
        new Date(nextMs);

      break;

    }


    guess =
      new Date(nextMs);

  }


  return guess;

}


/* =====================================================
   FORMAT LOCAL DATE PARTS
===================================================== */

function getLocalDateParts(
  utcDate,
  timeZone
){

  const zone =
    safeTimezone(timeZone);


  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:zone,
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        weekday:"long"
      }
    ).formatToParts(
      utcDate
    );


  const values = {};


  parts.forEach(part => {

    if(part.type !== "literal"){

      values[part.type] =
        part.value;

    }

  });


  return {

    year:values.year,
    month:values.month,
    day:values.day,
    weekday:values.weekday

  };

}


/* =====================================================
   DATE KEY
===================================================== */

function getDateKeyInTimezone(
  utcDate,
  timeZone
){

  const parts =
    getLocalDateParts(
      utcDate,
      timeZone
    );


  return (
    parts.year +
    "-" +
    parts.month +
    "-" +
    parts.day
  );

}


/* =====================================================
   FORMAT LOCAL TIME
===================================================== */

function getLocalTime(
  utcDate,
  timeZone
){

  return new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone:safeTimezone(timeZone),
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }
  ).format(utcDate);

}


/* =====================================================
   FORMAT FULL DATE
===================================================== */

function getReadableDate(
  utcDate,
  timeZone
){

  return new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone:safeTimezone(timeZone),
      weekday:"short",
      month:"short",
      day:"numeric",
      year:"numeric"
    }
  ).format(utcDate);

}


/* =====================================================
   GET TODAY IN TIMEZONE
===================================================== */

function getTodayInTimezone(
  timeZone
){

  return getDateKeyInTimezone(
    new Date(),
    timeZone
  );

}


/* =====================================================
   ADD DAYS TO ISO DATE
===================================================== */

function getDateAfter(
  dateISO,
  days
){

  const parts =
    String(dateISO)
      .split("-")
      .map(Number);


  const d =
    new Date(
      Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2],
        12,
        0,
        0
      )
    );


  d.setUTCDate(
    d.getUTCDate() + days
  );


  return (
    d.getUTCFullYear() +
    "-" +
    String(
      d.getUTCMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getUTCDate()
    ).padStart(2,"0")
  );

}


/* =====================================================
   BASE DATE LIST
===================================================== */

function getBaseDates(
  sourceTimezone
){

  const result = [];


  const sourceZone =
    safeTimezone(
      sourceTimezone
    );


  const today =
    getTodayInTimezone(
      sourceZone
    );


  /*
    We generate a wider range than 7 days.

    This is important because a class can move
    to the previous/next local day after timezone
    conversion.
  */

  for(let i = -3; i <= 16; i++){

    result.push(
      getDateAfter(
        today,
        i
      )
    );

  }


  return [
    ...new Set(result)
  ];

}


/* =====================================================
   BASE DAY NAME
===================================================== */

function baseDayName(
  dateISO,
  sourceTimezone
){

  const parts =
    String(dateISO)
      .split("-")
      .map(Number);


  const d =
    new Date(
      Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2],
        12,
        0,
        0
      )
    );


  return new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone:safeTimezone(
        sourceTimezone
      ),
      weekday:"long"
    }
  ).format(d);

}


/* =====================================================
   CONVERT OCCURRENCE
===================================================== */

function convertOccurrence(
  dateISO,
  timeString,
  scheduleTimezone,
  studentTimezone,
  duration
){

  const sourceTimezone =
    safeTimezone(
      scheduleTimezone
    );


  const targetTimezone =
    safeTimezone(
      studentTimezone
    );


  const utcDate =
    wallTimeToUTC(
      dateISO,
      timeString,
      sourceTimezone
    );


  const localParts =
    getLocalDateParts(
      utcDate,
      targetTimezone
    );


  const localDateISO =
    localParts.year +
    "-" +
    localParts.month +
    "-" +
    localParts.day;


  const localTime =
    getLocalTime(
      utcDate,
      targetTimezone
    );


  const endUTC =
    new Date(
      utcDate.getTime() +
      (
        parseInt(
          duration,
          10
        ) || 30
      ) * 60000
    );


  const endTime =
    getLocalTime(
      endUTC,
      targetTimezone
    );


  return {

    utcDate:utcDate,

    date:localDateISO,

    day:localParts.weekday,

    time:localTime,

    endTime:endTime,

    sourceTime:
      getLocalTime(
        utcDate,
        sourceTimezone
      ),

    sourceDate:
      getReadableDate(
        utcDate,
        sourceTimezone
      ),

    studentDate:
      getReadableDate(
        utcDate,
        targetTimezone
      )

  };

}


/* =====================================================
   BUILD OCCURRENCES
===================================================== */

function getOccurrences(
  schedules,
  studentTimezone
){

  const occurrences = [];


  schedules.forEach(
    schedule => {


      const sourceTimezone =
        safeTimezone(
          schedule.schedule_timezone ||
          BASE_TIMEZONE
        );


      const days =
        parseClassDays(
          schedule.class_days
        );


      if(!days.length){

        return;

      }


      const baseDates =
        getBaseDates(
          sourceTimezone
        );


      baseDates.forEach(
        baseDate => {


          const baseDay =
            baseDayName(
              baseDate,
              sourceTimezone
            );


          if(
            !days.includes(
              baseDay
            )
          ){

            return;

          }


          const converted =
            convertOccurrence(
              baseDate,
              schedule.class_time,
              sourceTimezone,
              studentTimezone,
              schedule.duration_minutes
            );


          occurrences.push({

            schedule:schedule,

            baseDate:baseDate,

            converted:converted

          });

        }
      );

    }
  );


  return occurrences.sort(
    (a,b) =>
      a.converted.utcDate -
      b.converted.utcDate
  );

}


/* =====================================================
   GET TEACHER TIME
===================================================== */

function getTeacherTime(
  utcDate,
  teacherTimezone
){

  return getLocalTime(
    utcDate,
    safeTimezone(
      teacherTimezone
    )
  );

}


/* =====================================================
   LOAD STUDENT SCHEDULE
===================================================== */

async function loadStudentSchedule(){

  const container =
    document.getElementById(
      "scheduleContainer"
    );


  const message =
    document.getElementById(
      "messageArea"
    );


  const timezoneInfo =
    document.getElementById(
      "timezoneInfo"
    );


  if(
    !container ||
    !message
  ){

    return;

  }


  container.innerHTML = `

    <div class="loading">
      Loading your schedule...
    </div>

  `;


  message.innerHTML = "";


  try{


    /* ===============================================
       AUTH USER
    =============================================== */

    const authResult =
      await db.auth.getUser();


    const user =
      authResult?.data?.user;


    const authError =
      authResult?.error;


    if(authError){

      throw authError;

    }


    if(!user){

      throw new Error(
        "Student login session not found. Please login again."
      );

    }


    const authUserId =
      user.id;


    /* ===============================================
       STUDENT
    =============================================== */

    const studentResult =
      await db
        .from("students")
        .select(`
          id,
          user_id,
          account_id,
          full_name,
          teacher_id,
          status,
          timezone
        `)
        .eq(
          "user_id",
          authUserId
        )
        .maybeSingle();


    const student =
      studentResult.data;


    const studentError =
      studentResult.error;


    if(studentError){

      throw studentError;

    }


    if(!student){

      throw new Error(
        "Your student account is not linked with this login."
      );

    }


    /* ===============================================
       STATUS
    =============================================== */

    if(
      student.status &&
      String(student.status)
        .toLowerCase() !== "active"
    ){

      throw new Error(
        "Your student account is currently inactive. Please contact the academy admin."
      );

    }


    /* ===============================================
       STUDENT TIMEZONE
    =============================================== */

    let studentTimezone =
      String(
        student.timezone ||
        ""
      ).trim();


    if(
      !isValidTimezone(
        studentTimezone
      )
    ){

      studentTimezone =
        BASE_TIMEZONE;

    }


    if(timezoneInfo){

      timezoneInfo.innerHTML =

        "Your schedule is shown in: " +

        "<strong>" +

        safeHtml(
          studentTimezone
        ) +

        "</strong>" +

        " · Local date/time";

    }


    /* ===============================================
       SCHEDULES
    =============================================== */

    const scheduleResult =
      await db
        .from("class_schedules")
        .select(`
          id,
          student_id,
          teacher_id,
          course,
          class_days,
          class_time,
          duration_minutes,
          google_meet_url,
          classroom_code,
          active,
          schedule_timezone
        `)
        .eq(
          "student_id",
          student.id
        )
        .eq(
          "active",
          true
        );


    const schedules =
      scheduleResult.data;


    const scheduleError =
      scheduleResult.error;


    if(scheduleError){

      throw scheduleError;

    }


    /* ===============================================
       NO SCHEDULE
    =============================================== */

    if(
      !schedules ||
      !schedules.length
    ){

      container.innerHTML = `

        <div class="empty">

          <strong>
            No schedule available
          </strong>

          <br><br>

          No active weekly classes have been
          assigned to your student account yet.

        </div>

      `;

      return;

    }


    /* ===============================================
       TEACHERS
    =============================================== */

    const teacherIds =
      [
        ...new Set(
          schedules
            .map(
              schedule =>
                schedule.teacher_id
            )
            .filter(Boolean)
        )
      ];


    const teacherMap = {};


    if(teacherIds.length){

      const teacherResult =
        await db
          .from("teachers")
          .select(`
            id,
            name,
            timezone
          `)
          .in(
            "id",
            teacherIds
          );


      if(teacherResult.error){

        console.warn(
          "Teacher lookup error:",
          teacherResult.error
        );

      }


      (
        teacherResult.data ||
        []
      ).forEach(
        teacher => {

          teacherMap[
            teacher.id
          ] = {

            name:
              teacher.name ||
              "Assigned Teacher",

            timezone:
              safeTimezone(
                teacher.timezone ||
                BASE_TIMEZONE
              )

          };

        }
      );

    }


    /* ===============================================
       OCCURRENCES
    =============================================== */

    const occurrences =
      getOccurrences(
        schedules,
        studentTimezone
      );


    const now =
      new Date();


    const today =
      getTodayInTimezone(
        studentTimezone
      );


    const lastDate =
      getDateAfter(
        today,
        6
      );


    /* ===============================================
       GROUP BY LOCAL DAY
    =============================================== */

    const dayGroups = {};


    DAYS.forEach(
      day => {

        dayGroups[day] = [];

      }
    );


    occurrences.forEach(
      item => {

        const localDate =
          item.converted.date;


        if(
          localDate < today ||
          localDate > lastDate
        ){

          return;

        }


        const localDay =
          item.converted.day;


        if(
          DAYS.includes(
            localDay
          )
        ){

          dayGroups[
            localDay
          ].push(
            item
          );

        }

      }
    );


    /* ===============================================
       BUILD HTML
    =============================================== */

    let html = "";


    DAYS.forEach(
      day => {


        const classes =
          dayGroups[day];


        if(
          !classes ||
          !classes.length
        ){

          return;

        }


        classes.sort(
          (a,b) =>
            a.converted.utcDate -
            b.converted.utcDate
        );


        const hasToday =
          classes.some(
            item =>
              item.converted.date ===
              today
          );


        html += `

          <div class="day-section">

            <div class="day-title">

              ${safeHtml(day)}

              ${
                hasToday
                ?

                `
                  <span
                    class="today-badge">

                    TODAY

                  </span>
                `

                :

                ""
              }

            </div>

        `;


        classes.forEach(
          item => {


            const schedule =
              item.schedule;


            const teacher =
              teacherMap[
                schedule.teacher_id
              ] || {

                name:
                  "Assigned Teacher",

                timezone:
                  BASE_TIMEZONE

              };


            const sourceTimezone =
              safeTimezone(
                schedule.schedule_timezone ||
                BASE_TIMEZONE
              );


            const teacherTimezone =
              safeTimezone(
                teacher.timezone ||
                sourceTimezone
              );


            const isToday =
              item.converted.date ===
              today;


            const isStarted =
              item.converted.utcDate <=
              now;


            const durationMinutes =
              parseInt(
                schedule.duration_minutes,
                10
              ) || 30;


            const endUTC =
              new Date(
                item.converted.utcDate.getTime() +
                durationMinutes * 60000
              );


            const isLive =
              isStarted &&
              now < endUTC;


            let statusBadge = "";


            if(isLive){

              statusBadge = `

                <span
                  class="today-badge">

                  LIVE

                </span>

              `;

            }


            /* =========================================
               GOOGLE MEET
            ========================================= */

            let actions = "";


            if(
              schedule.google_meet_url
            ){

              actions += `

                <a
                  class="join-btn"
                  href="${safeHtml(
                    schedule.google_meet_url
                  )}"
                  target="_blank"
                  rel="noopener noreferrer">

                  Join Class

                </a>

              `;

            }


            /* =========================================
               CLASSROOM
            ========================================= */

            if(
              schedule.classroom_code
            ){

              const classroomUrl =
                CLASSROOM_BASE_URL +
                "?code=" +
                encodeURIComponent(
                  schedule.classroom_code
                );


              actions += `

                <a
                  class="classroom-btn"
                  href="${safeHtml(
                    classroomUrl
                  )}"
                  target="_blank"
                  rel="noopener noreferrer">

                  Classroom

                </a>

              `;

            }


            /* =========================================
               CLASS CARD
            ========================================= */

            html += `

              <div class="class-card">


                <div class="class-main">


                  <div class="class-time">

                    ${safeHtml(
                      item.converted.time
                    )}

                    ${
                      isToday
                      ?

                      `
                        <span
                          class="today-badge">

                          TODAY

                        </span>
                      `

                      :

                      ""
                    }

                    ${statusBadge}

                  </div>


                  <div class="class-course">

                    ${safeHtml(
                      schedule.course ||
                      "Quran Class"
                    )}

                  </div>


                  <div class="class-teacher">

                    Teacher:

                    ${safeHtml(
                      teacher.name
                    )}

                  </div>


                  ${
                    schedule.duration_minutes

                    ?

                    `
                      <div
                        class="class-duration">

                        Duration:

                        ${safeHtml(
                          formatDuration(
                            schedule.duration_minutes
                          )
                        )}

                      </div>
                    `

                    :

                    ""
                  }


                  <div
                    class="class-duration">

                    Local Date:

                    <span class="local-date">

                      ${safeHtml(
                        item.converted.studentDate
                      )}

                    </span>

                  </div>


                  <div
                    class="class-duration">

                    Ends:

                    ${safeHtml(
                      item.converted.endTime
                    )}

                  </div>


                  <div
                    class="time-info">


                    <strong>
                      Your Time:
                    </strong>

                    ${safeHtml(
                      item.converted.time
                    )}

                    ·

                    ${safeHtml(
                      studentTimezone
                    )}


                    <br>


                    <strong>
                      Academy Time:
                    </strong>

                    ${safeHtml(
                      item.converted.sourceTime
                    )}

                    ·

                    ${safeHtml(
                      sourceTimezone
                    )}


                    ${
                      teacherTimezone !==
                      sourceTimezone

                      ?

                      `

                        <br>

                        <strong>
                          Teacher Time:
                        </strong>

                        ${safeHtml(
                          getTeacherTime(
                            item.converted.utcDate,
                            teacherTimezone
                          )
                        )}

                        ·

                        ${safeHtml(
                          teacherTimezone
                        )}

                      `

                      :

                      ""

                    }


                  </div>


                </div>


                ${
                  actions

                  ?

                  `
                    <div
                      class="class-actions">

                      ${actions}

                    </div>
                  `

                  :

                  ""
                }


              </div>

            `;


          }
        );


        html += `

          </div>

        `;


      }
    );


    /* ===============================================
       NO UPCOMING CLASSES
    =============================================== */

    if(!html){

      html = `

        <div class="empty">

          <strong>
            No active classes found.
          </strong>

          <br><br>

          There are no classes scheduled
          for the next 7 days in your
          local timezone.

        </div>

      `;

    }


    container.innerHTML =
      html;


  }catch(error){


    console.error(
      "Student schedule error:",
      error
    );


    container.innerHTML = "";


    message.innerHTML = `

      <div class="error-box">

        <strong>
          Could not load your schedule.
        </strong>

        <br><br>

        ${safeHtml(
          error?.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadStudentSchedule();

  }
);

</script>
