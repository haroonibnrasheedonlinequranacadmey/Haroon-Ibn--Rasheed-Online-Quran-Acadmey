<script>

const db = supabase.createClient(
  window.SUPABASE_CONFIG.url,
  window.SUPABASE_CONFIG.anonKey
);

const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday",
  "Sunday"
];

const BASE_TIMEZONE = "Asia/Karachi";


function normalizeDay(day){

  const value = String(day || "").trim().toLowerCase();

  const map = {
    mon:"Monday",
    monday:"Monday",
    tue:"Tuesday",
    tues:"Tuesday",
    tuesday:"Tuesday",
    wed:"Wednesday",
    wednesday:"Wednesday",
    thu:"Thursday",
    thur:"Thursday",
    thurs:"Thursday",
    thursday:"Thursday",
    fri:"Friday",
    friday:"Friday",
    sat:"Saturday",
    saturday:"Saturday",
    sun:"Sunday",
    sunday:"Sunday"
  };

  return map[value] || day;
}


function safeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatTime(time){

  if(!time) return "";

  const parts = String(time).split(":");

  let hour = parseInt(parts[0],10);
  const minute = String(parts[1] || "00").padStart(2,"0");

  if(isNaN(hour)) return String(time);

  const ampm = hour >= 12 ? "PM" : "AM";

  hour = hour % 12 || 12;

  return hour + ":" + minute + " " + ampm;
}


function formatDuration(minutes){

  const m = parseInt(minutes,10);

  if(!m) return "";

  if(m < 60){
    return m + " minutes";
  }

  const h = Math.floor(m / 60);
  const r = m % 60;

  if(r === 0){
    return h + (h === 1 ? " hour" : " hours");
  }

  return h + "h " + r + "m";
}


/* =====================================================
   TIMEZONE HELPERS
===================================================== */

function getStudentTimezone(){

  try{

    return Intl.DateTimeFormat().resolvedOptions().timeZone
      || "Asia/Karachi";

  }catch(e){

    return "Asia/Karachi";

  }

}


/*
  Get timezone offset in minutes for a UTC date.
*/
function getTimezoneOffsetMinutes(date, timeZone){

  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hourCycle:"h23"
  }).formatToParts(date);

  const values = {};

  parts.forEach(part => {

    if(part.type !== "literal"){
      values[part.type] = part.value;
    }

  });

  const asUTC = Date.UTC(
    Number(values.year),
    Number(values.month) - 1,
    Number(values.day),
    Number(values.hour),
    Number(values.minute),
    Number(values.second)
  );

  return Math.round(
    (asUTC - date.getTime()) / 60000
  );

}


/*
  Convert a wall-clock time in one timezone
  into the real UTC instant.
*/
function wallTimeToUTC(
  dateISO,
  timeString,
  timeZone
){

  const parts = String(timeString || "00:00:00")
    .split(":");

  const hour = parseInt(parts[0],10) || 0;
  const minute = parseInt(parts[1],10) || 0;
  const second = parseInt(parts[2],10) || 0;

  const [year,month,day] =
    dateISO.split("-").map(Number);

  let guess = new Date(
    Date.UTC(
      year,
      month - 1,
      day,
      hour,
      minute,
      second
    )
  );

  for(let i=0;i<3;i++){

    const offset =
      getTimezoneOffsetMinutes(
        guess,
        timeZone
      );

    guess = new Date(
      Date.UTC(
        year,
        month - 1,
        day,
        hour,
        minute,
        second
      ) -
      offset * 60000
    );

  }

  return guess;

}


/*
  Convert a scheduled class occurrence
  from the admin/base timezone into
  the student's timezone.
*/
function convertOccurrence(
  dateISO,
  timeString,
  scheduleTimezone,
  studentTimezone,
  duration
){

  const utcDate =
    wallTimeToUTC(
      dateISO,
      timeString,
      scheduleTimezone || BASE_TIMEZONE
    );

  const dateParts =
    new Intl.DateTimeFormat("en-US",{
      timeZone:studentTimezone,
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      weekday:"long"
    }).formatToParts(utcDate);

  const values = {};

  dateParts.forEach(part => {

    if(part.type !== "literal"){
      values[part.type] = part.value;
    }

  });

  const localDateISO =
    values.year + "-" +
    values.month + "-" +
    values.day;

  const timeText =
    new Intl.DateTimeFormat("en-US",{
      timeZone:studentTimezone,
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }).format(utcDate);

  const day =
    values.weekday;

  const endUTC =
    new Date(
      utcDate.getTime() +
      (parseInt(duration,10) || 30) * 60000
    );

  const endTime =
    new Intl.DateTimeFormat("en-US",{
      timeZone:studentTimezone,
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }).format(endUTC);

  return {
    utcDate,
    date:localDateISO,
    day,
    time:timeText,
    endTime
  };

}


function getTodayInTimezone(timeZone){

  const parts =
    new Intl.DateTimeFormat("en-CA",{
      timeZone,
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }).formatToParts(new Date());

  const values = {};

  parts.forEach(part => {

    if(part.type !== "literal"){
      values[part.type] = part.value;
    }

  });

  return (
    values.year + "-" +
    values.month + "-" +
    values.day
  );

}


/* =====================================================
   BUILD UPCOMING BASE DATES
===================================================== */

function getBaseDates(days){

  const result = [];

  const start = new Date();

  start.setHours(12,0,0,0);

  for(let i=-2;i<days+3;i++){

    const d = new Date(start);

    d.setDate(
      start.getDate() + i
    );

    const year =
      new Intl.DateTimeFormat("en-US",{
        timeZone:BASE_TIMEZONE,
        year:"numeric"
      }).format(d);

    const month =
      new Intl.DateTimeFormat("en-US",{
        timeZone:BASE_TIMEZONE,
        month:"2-digit"
      }).format(d);

    const day =
      new Intl.DateTimeFormat("en-US",{
        timeZone:BASE_TIMEZONE,
        day:"2-digit"
      }).format(d);

    result.push(
      year + "-" + month + "-" + day
    );

  }

  return [...new Set(result)];

}


function baseDayName(dateISO){

  const d =
    new Date(
      dateISO + "T12:00:00Z"
    );

  return new Intl.DateTimeFormat("en-US",{
    timeZone:BASE_TIMEZONE,
    weekday:"long"
  }).format(d);

}


function getOccurrences(
  schedules,
  studentTimezone
){

  const occurrences = [];

  const baseDates =
    getBaseDates(14);

  baseDates.forEach(dateISO => {

    const baseDay =
      baseDayName(dateISO);

    schedules.forEach(schedule => {

      let days =
        schedule.class_days;

      if(!Array.isArray(days)){
        days = [days];
      }

      const matches =
        days.some(
          x =>
            normalizeDay(x) === baseDay
        );

      if(!matches){
        return;
      }

      const converted =
        convertOccurrence(
          dateISO,
          schedule.class_time,
          schedule.schedule_timezone ||
            BASE_TIMEZONE,
          studentTimezone,
          schedule.duration_minutes
        );

      occurrences.push({
        schedule,
        baseDate:dateISO,
        converted
      });

    });

  });

  return occurrences.sort(
    (a,b) =>
      a.converted.utcDate -
      b.converted.utcDate
  );

}


/* =====================================================
   LOAD STUDENT SCHEDULE
===================================================== */

async function loadStudentSchedule(){

  const container =
    document.getElementById("scheduleContainer");

  const message =
    document.getElementById("messageArea");

  container.innerHTML = `
    <div class="loading">
      Loading your schedule...
    </div>
  `;

  message.innerHTML = "";

  try{

    const {
      data:{user},
      error:authError
    } =
      await db.auth.getUser();

    if(authError){
      throw authError;
    }

    if(!user){

      throw new Error(
        "Student login session not found. Please login again."
      );

    }

    const authUserId =
      user.id;


    /* STUDENT */

    const {
      data:student,
      error:studentError
    } =
      await db
        .from("students")
        .select(`
          id,
          user_id,
          account_id,
          full_name,
          teacher_id,
          status,
          timezone
        `)
        .eq("user_id",authUserId)
        .maybeSingle();

    if(studentError){
      throw studentError;
    }

    if(!student){

      throw new Error(
        "Your student account is not linked with this login."
      );

    }

    if(
      student.status &&
      String(student.status).toLowerCase() !== "active"
    ){

      throw new Error(
        "Your student account is currently inactive. Please contact the academy admin."
      );

    }


    /* STUDENT TIMEZONE */

    const studentTimezone =
      student.timezone ||
      getStudentTimezone() ||
      "Asia/Karachi";


    /* SCHEDULES */

    const {
      data:schedules,
      error:scheduleError
    } =
      await db
        .from("class_schedules")
        .select(`
          id,
          student_id,
          teacher_id,
          course,
          class_days,
          class_time,
          duration_minutes,
          google_meet_url,
          classroom_code,
          active,
          schedule_timezone
        `)
        .eq("student_id",student.id)
        .eq("active",true);

    if(scheduleError){
      throw scheduleError;
    }


    if(
      !schedules ||
      !schedules.length
    ){

      container.innerHTML = `
        <div class="empty">

          <strong>No schedule available</strong>

          <br><br>

          No active weekly classes have been
          assigned to your student account yet.

        </div>
      `;

      return;

    }


    /* TEACHERS */

    const teacherIds =
      [
        ...new Set(
          schedules
            .map(x => x.teacher_id)
            .filter(Boolean)
        )
      ];

    const teacherMap = {};

    if(teacherIds.length){

      const {
        data:teachers
      } =
        await db
          .from("teachers")
          .select("id,name")
          .in("id",teacherIds);

      (teachers || []).forEach(
        teacher => {

          teacherMap[teacher.id] =
            teacher.name;

        }
      );

    }


    /* OCCURRENCES */

    const occurrences =
      getOccurrences(
        schedules,
        studentTimezone
      );


    const today =
      getTodayInTimezone(
        studentTimezone
      );


    /* GROUP BY STUDENT LOCAL DAY */

    const dayGroups = {};

    DAYS.forEach(day => {
      dayGroups[day] = [];
    });

    occurrences.forEach(item => {

      if(
        item.converted.date < today
      ){
        return;
      }

      if(
        item.converted.date >
        getDateAfter(today,7)
      ){
        return;
      }

      if(
        DAYS.includes(item.converted.day)
      ){

        dayGroups[item.converted.day]
          .push(item);

      }

    });


    let html = "";


    DAYS.forEach(day => {

      const classes =
        dayGroups[day];

      if(!classes.length){
        return;
      }


      classes.sort(
        (a,b) =>
          a.converted.utcDate -
          b.converted.utcDate
      );


      html += `

        <div class="day-section">

          <div class="day-title">

            ${safeHtml(day)}

            ${
              classes.some(
                x =>
                  x.converted.date === today
              )

              ?

              `
                <span class="today-badge">
                  TODAY
                </span>
              `

              :

              ""
            }

          </div>
      `;


      classes.forEach(item => {

        const schedule =
          item.schedule;

        const teacherName =
          teacherMap[
            schedule.teacher_id
          ] ||
          "Assigned Teacher";


        let actions = "";


        if(schedule.google_meet_url){

          actions += `

            <a
              class="join-btn"
              href="${safeHtml(
                schedule.google_meet_url
              )}"
              target="_blank"
              rel="noopener noreferrer">

              Join Class

            </a>

          `;

        }


        if(schedule.classroom_code){

          const classroomUrl =
            "https://haroonibnrasheedonlinequranacadmey.github.io/haroon-quran-classroom/?code="
            +
            encodeURIComponent(
              schedule.classroom_code
            );

          actions += `

            <a
              class="classroom-btn"
              href="${classroomUrl}"
              target="_blank"
              rel="noopener noreferrer">

              Classroom

            </a>

          `;

        }


        html += `

          <div class="class-card">

            <div class="class-main">

              <div class="class-time">

                ${safeHtml(
                  item.converted.time
                )}

              </div>

              <div class="class-course">

                ${safeHtml(
                  schedule.course ||
                  "Quran Class"
                )}

              </div>

              <div class="class-teacher">

                Teacher:

                ${safeHtml(
                  teacherName
                )}

              </div>

              ${
                schedule.duration_minutes

                ?

                `
                  <div class="class-duration">

                    Duration:

                    ${safeHtml(
                      formatDuration(
                        schedule.duration_minutes
                      )
                    )}

                  </div>
                `

                :

                ""
              }

              <div class="class-duration">

                ${safeHtml(
                  item.converted.date
                )}

              </div>

            </div>

            ${
              actions

              ?

              `
                <div class="class-actions">

                  ${actions}

                </div>
              `

              :

              ""
            }

          </div>

        `;

      });


      html += `</div>`;

    });


    container.innerHTML =
      html ||

      `
        <div class="empty">
          No active classes found.
        </div>
      `;


  }catch(error){

    console.error(
      "Student schedule error:",
      error
    );

    container.innerHTML = "";

    message.innerHTML = `

      <div class="error-box">

        <strong>
          Could not load your schedule.
        </strong>

        <br><br>

        ${safeHtml(
          error?.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}


function getDateAfter(dateISO,days){

  const d =
    new Date(
      dateISO + "T12:00:00Z"
    );

  d.setUTCDate(
    d.getUTCDate() + days
  );

  return (
    d.getUTCFullYear() +
    "-" +
    String(
      d.getUTCMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getUTCDate()
    ).padStart(2,"0")
  );

}


document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadStudentSchedule();

  }
);

</script>
