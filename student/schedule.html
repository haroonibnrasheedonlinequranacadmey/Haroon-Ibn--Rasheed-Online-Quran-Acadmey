<script>


/* =====================================================
   SUPABASE
===================================================== */

const db =
  supabase.createClient(
    window.SUPABASE_CONFIG.url,
    window.SUPABASE_CONFIG.anonKey
  );


/* =====================================================
   DAYS
===================================================== */

const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday",
  "Sunday"
];


const BASE_TIMEZONE =
  "Asia/Karachi";


/* =====================================================
   SAFE HTML
===================================================== */

function safeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   NORMALIZE DAY
===================================================== */

function normalizeDay(day){

  const value =
    String(day || "")
      .trim()
      .toLowerCase();

  const map = {

    mon:"Monday",
    monday:"Monday",

    tue:"Tuesday",
    tues:"Tuesday",
    tuesday:"Tuesday",

    wed:"Wednesday",
    wednesday:"Wednesday",

    thu:"Thursday",
    thur:"Thursday",
    thurs:"Thursday",
    thursday:"Thursday",

    fri:"Friday",
    friday:"Friday",

    sat:"Saturday",
    saturday:"Saturday",

    sun:"Sunday",
    sunday:"Sunday"

  };

  return map[value] || day;

}


/* =====================================================
   FORMAT DURATION
===================================================== */

function formatDuration(minutes){

  const m =
    parseInt(minutes,10);

  if(!m){
    return "";
  }

  if(m < 60){
    return m + " minutes";
  }

  const h =
    Math.floor(m / 60);

  const r =
    m % 60;

  if(r === 0){

    return h +
      (h === 1 ? " hour" : " hours");

  }

  return h + "h " + r + "m";

}


/* =====================================================
   TIMEZONE VALIDATION
===================================================== */

function isValidTimezone(timeZone){

  if(!timeZone){
    return false;
  }

  try{

    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:timeZone
      }
    ).format(new Date());

    return true;

  }catch(error){

    return false;

  }

}


/* =====================================================
   GET TIMEZONE OFFSET
===================================================== */

function getTimezoneOffsetMinutes(
  date,
  timeZone
){

  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:timeZone,
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hourCycle:"h23"
      }
    ).formatToParts(date);

  const values = {};

  parts.forEach(part => {

    if(part.type !== "literal"){
      values[part.type] =
        part.value;
    }

  });


  const asUTC =
    Date.UTC(
      Number(values.year),
      Number(values.month) - 1,
      Number(values.day),
      Number(values.hour),
      Number(values.minute),
      Number(values.second)
    );


  return Math.round(
    (asUTC - date.getTime()) /
    60000
  );

}


/* =====================================================
   WALL CLOCK → UTC
===================================================== */

function wallTimeToUTC(
  dateISO,
  timeString,
  timeZone
){

  const parts =
    String(
      timeString || "00:00:00"
    ).split(":");


  const hour =
    parseInt(parts[0],10) || 0;

  const minute =
    parseInt(parts[1],10) || 0;

  const second =
    parseInt(parts[2],10) || 0;


  const dateParts =
    dateISO.split("-")
      .map(Number);


  const year =
    dateParts[0];

  const month =
    dateParts[1];

  const day =
    dateParts[2];


  let guess =
    new Date(
      Date.UTC(
        year,
        month - 1,
        day,
        hour,
        minute,
        second
      )
    );


  for(let i=0;i<5;i++){

    const offset =
      getTimezoneOffsetMinutes(
        guess,
        timeZone
      );


    guess =
      new Date(
        Date.UTC(
          year,
          month - 1,
          day,
          hour,
          minute,
          second
        )
        -
        offset * 60000
      );

  }


  return guess;

}


/* =====================================================
   FORMAT LOCAL DATE
===================================================== */

function getLocalDateParts(
  utcDate,
  timeZone
){

  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:timeZone,
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        weekday:"long"
      }
    ).formatToParts(utcDate);


  const values = {};


  parts.forEach(part => {

    if(part.type !== "literal"){
      values[part.type] =
        part.value;
    }

  });


  return {

    year:values.year,
    month:values.month,
    day:values.day,
    weekday:values.weekday

  };

}


/* =====================================================
   FORMAT LOCAL TIME
===================================================== */

function getLocalTime(
  utcDate,
  timeZone
){

  return new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone:timeZone,
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }
  ).format(utcDate);

}


/* =====================================================
   CONVERT CLASS OCCURRENCE
===================================================== */

function convertOccurrence(
  dateISO,
  timeString,
  scheduleTimezone,
  studentTimezone,
  duration
){

  const sourceTimezone =
    isValidTimezone(scheduleTimezone)
      ? scheduleTimezone
      : BASE_TIMEZONE;


  const targetTimezone =
    isValidTimezone(studentTimezone)
      ? studentTimezone
      : BASE_TIMEZONE;


  const utcDate =
    wallTimeToUTC(
      dateISO,
      timeString,
      sourceTimezone
    );


  const localParts =
    getLocalDateParts(
      utcDate,
      targetTimezone
    );


  const localDateISO =
    localParts.year +
    "-" +
    localParts.month +
    "-" +
    localParts.day;


  const localTime =
    getLocalTime(
      utcDate,
      targetTimezone
    );


  const endUTC =
    new Date(
      utcDate.getTime() +
      (
        parseInt(duration,10) || 30
      ) * 60000
    );


  const endTime =
    getLocalTime(
      endUTC,
      targetTimezone
    );


  return {

    utcDate:utcDate,

    date:localDateISO,

    day:localParts.weekday,

    time:localTime,

    endTime:endTime

  };

}


/* =====================================================
   GET TODAY IN TIMEZONE
===================================================== */

function getTodayInTimezone(
  timeZone
){

  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:timeZone,
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(
      new Date()
    );


  const values = {};


  parts.forEach(part => {

    if(part.type !== "literal"){
      values[part.type] =
        part.value;
    }

  });


  return (
    values.year +
    "-" +
    values.month +
    "-" +
    values.day
  );

}


/* =====================================================
   ADD DAYS TO ISO DATE
===================================================== */

function getDateAfter(
  dateISO,
  days
){

  const parts =
    dateISO.split("-")
      .map(Number);


  const d =
    new Date(
      Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2],
        12,
        0,
        0
      )
    );


  d.setUTCDate(
    d.getUTCDate() + days
  );


  return (
    d.getUTCFullYear() +
    "-" +
    String(
      d.getUTCMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getUTCDate()
    ).padStart(2,"0")
  );

}


/* =====================================================
   GET BASE DATE LIST
===================================================== */

function getBaseDates(){

  const result = [];


  const today =
    getTodayInTimezone(
      BASE_TIMEZONE
    );


  for(let i=-2;i<=16;i++){

    const dateISO =
      getDateAfter(
        today,
        i
      );


    result.push(
      dateISO
    );

  }


  return [
    ...new Set(result)
  ];

}


/* =====================================================
   GET BASE DAY NAME
===================================================== */

function baseDayName(
  dateISO
){

  const parts =
    dateISO.split("-")
      .map(Number);


  const d =
    new Date(
      Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2],
        12,
        0,
        0
      )
    );


  return new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone:BASE_TIMEZONE,
      weekday:"long"
    }
  ).format(d);

}


/* =====================================================
   BUILD OCCURRENCES
===================================================== */

function getOccurrences(
  schedules,
  studentTimezone
){

  const occurrences = [];


  const baseDates =
    getBaseDates();


  baseDates.forEach(
    baseDate => {


      const baseDay =
        baseDayName(
          baseDate
        );


      schedules.forEach(
        schedule => {


          let days =
            schedule.class_days;


          if(!Array.isArray(days)){

            days =
              [days];

          }


          const matches =
            days.some(
              day =>
                normalizeDay(day) ===
                baseDay
            );


          if(!matches){
            return;
          }


          const converted =
            convertOccurrence(
              baseDate,
              schedule.class_time,
              schedule.schedule_timezone ||
                BASE_TIMEZONE,
              studentTimezone,
              schedule.duration_minutes
            );


          occurrences.push({

            schedule:schedule,

            baseDate:baseDate,

            converted:converted

          });


        }
      );


    }
  );


  return occurrences.sort(
    (a,b) =>
      a.converted.utcDate -
      b.converted.utcDate
  );

}


/* =====================================================
   LOAD STUDENT SCHEDULE
===================================================== */

async function loadStudentSchedule(){

  const container =
    document.getElementById(
      "scheduleContainer"
    );


  const message =
    document.getElementById(
      "messageArea"
    );


  const timezoneInfo =
    document.getElementById(
      "timezoneInfo"
    );


  if(!container || !message){
    return;
  }


  container.innerHTML = `

    <div class="loading">
      Loading your schedule...
    </div>

  `;


  message.innerHTML = "";


  try{


    /* ===============================================
       AUTH USER
    =============================================== */

    const authResult =
      await db.auth.getUser();


    const user =
      authResult?.data?.user;


    const authError =
      authResult?.error;


    if(authError){
      throw authError;
    }


    if(!user){

      throw new Error(
        "Student login session not found. Please login again."
      );

    }


    const authUserId =
      user.id;


    /* ===============================================
       STUDENT
    =============================================== */

    const studentResult =
      await db
        .from("students")
        .select(`
          id,
          user_id,
          account_id,
          full_name,
          teacher_id,
          status,
          timezone
        `)
        .eq(
          "user_id",
          authUserId
        )
        .maybeSingle();


    const student =
      studentResult.data;


    const studentError =
      studentResult.error;


    if(studentError){
      throw studentError;
    }


    if(!student){

      throw new Error(
        "Your student account is not linked with this login."
      );

    }


    /* ===============================================
       STATUS
    =============================================== */

    if(
      student.status &&
      String(student.status)
        .toLowerCase() !== "active"
    ){

      throw new Error(
        "Your student account is currently inactive. Please contact the academy admin."
      );

    }


    /* ===============================================
       STUDENT TIMEZONE
    =============================================== */

    let studentTimezone =
      String(
        student.timezone ||
        ""
      ).trim();


    if(
      !isValidTimezone(
        studentTimezone
      )
    ){

      studentTimezone =
        BASE_TIMEZONE;

    }


    if(timezoneInfo){

      timezoneInfo.innerHTML =
        "Your schedule is shown in: " +
        "<strong>" +
        safeHtml(
          studentTimezone
        ) +
        "</strong>";

    }


    /* ===============================================
       SCHEDULES
    =============================================== */

    const scheduleResult =
      await db
        .from("class_schedules")
        .select(`
          id,
          student_id,
          teacher_id,
          course,
          class_days,
          class_time,
          duration_minutes,
          google_meet_url,
          classroom_code,
          active,
          schedule_timezone
        `)
        .eq(
          "student_id",
          student.id
        )
        .eq(
          "active",
          true
        );


    const schedules =
      scheduleResult.data;


    const scheduleError =
      scheduleResult.error;


    if(scheduleError){
      throw scheduleError;
    }


    /* ===============================================
       NO SCHEDULE
    =============================================== */

    if(
      !schedules ||
      !schedules.length
    ){

      container.innerHTML = `

        <div class="empty">

          <strong>
            No schedule available
          </strong>

          <br><br>

          No active weekly classes have been
          assigned to your student account yet.

        </div>

      `;

      return;

    }


    /* ===============================================
       TEACHERS
    =============================================== */

    const teacherIds =
      [
        ...new Set(
          schedules
            .map(
              schedule =>
                schedule.teacher_id
            )
            .filter(Boolean)
        )
      ];


    const teacherMap = {};


    if(teacherIds.length){

      const teacherResult =
        await db
          .from("teachers")
          .select(`
            id,
            name
          `)
          .in(
            "id",
            teacherIds
          );


      if(teacherResult.error){

        console.warn(
          "Teacher lookup error:",
          teacherResult.error
        );

      }


      (
        teacherResult.data ||
        []
      ).forEach(
        teacher => {

          teacherMap[
            teacher.id
          ] =
            teacher.name;

        }
      );

    }


    /* ===============================================
       CONVERT OCCURRENCES
    =============================================== */

    const occurrences =
      getOccurrences(
        schedules,
        studentTimezone
      );


    const today =
      getTodayInTimezone(
        studentTimezone
      );


    const lastDate =
      getDateAfter(
        today,
        7
      );


    /* ===============================================
       GROUP BY LOCAL DAY
    =============================================== */

    const dayGroups = {};


    DAYS.forEach(
      day => {

        dayGroups[day] = [];

      }
    );


    occurrences.forEach(
      item => {

        const localDate =
          item.converted.date;


        if(
          localDate < today ||
          localDate > lastDate
        ){

          return;

        }


        const localDay =
          item.converted.day;


        if(
          DAYS.includes(
            localDay
          )
        ){

          dayGroups[
            localDay
          ].push(
            item
          );

        }

      }
    );


    /* ===============================================
       BUILD HTML
    =============================================== */

    let html = "";


    DAYS.forEach(
      day => {


        const classes =
          dayGroups[day];


        if(
          !classes ||
          !classes.length
        ){

          return;

        }


        classes.sort(
          (a,b) =>
            a.converted.utcDate -
            b.converted.utcDate
        );


        html += `

          <div class="day-section">

            <div class="day-title">

              ${safeHtml(day)}

              ${
                classes.some(
                  item =>
                    item.converted.date ===
                    today
                )

                ?

                `
                  <span
                    class="today-badge">

                    TODAY

                  </span>
                `

                :

                ""
              }

            </div>

        `;


        classes.forEach(
          item => {


            const schedule =
              item.schedule;


            const teacherName =
              teacherMap[
                schedule.teacher_id
              ] ||
              "Assigned Teacher";


            let actions = "";


            /* =========================================
               GOOGLE MEET
            ========================================= */

            if(
              schedule.google_meet_url
            ){

              actions += `

                <a
                  class="join-btn"
                  href="${safeHtml(
                    schedule.google_meet_url
                  )}"
                  target="_blank"
                  rel="noopener noreferrer">

                  Join Class

                </a>

              `;

            }


            /* =========================================
               CLASSROOM
            ========================================= */

            if(
              schedule.classroom_code
            ){

              const classroomUrl =
                "https://haroonibnrasheedonlinequranacadmey.github.io/haroon-quran-classroom/?code=" +
                encodeURIComponent(
                  schedule.classroom_code
                );


              actions += `

                <a
                  class="classroom-btn"
                  href="${classroomUrl}"
                  target="_blank"
                  rel="noopener noreferrer">

                  Classroom

                </a>

              `;

            }


            /* =========================================
               CLASS CARD
            ========================================= */

            html += `

              <div class="class-card">


                <div class="class-main">


                  <div class="class-time">

                    ${safeHtml(
                      item.converted.time
                    )}

                  </div>


                  <div class="class-course">

                    ${safeHtml(
                      schedule.course ||
                      "Quran Class"
                    )}

                  </div>


                  <div class="class-teacher">

                    Teacher:

                    ${safeHtml(
                      teacherName
                    )}

                  </div>


                  ${
                    schedule.duration_minutes

                    ?

                    `
                      <div
                        class="class-duration">

                        Duration:

                        ${safeHtml(
                          formatDuration(
                            schedule.duration_minutes
                          )
                        )}

                      </div>
                    `

                    :

                    ""
                  }


                  <div
                    class="class-duration">

                    Date:

                    ${safeHtml(
                      item.converted.date
                    )}

                  </div>


                  <div
                    class="class-duration">

                    Ends:

                    ${safeHtml(
                      item.converted.endTime
                    )}

                  </div>


                </div>


                ${
                  actions

                  ?

                  `
                    <div
                      class="class-actions">

                      ${actions}

                    </div>
                  `

                  :

                  ""
                }


              </div>

            `;


          }
        );


        html += `

          </div>

        `;


      }
    );


    container.innerHTML =
      html ||

      `

        <div class="empty">

          No active classes found
          for the next 7 days.

        </div>

      `;


  }catch(error){


    console.error(
      "Student schedule error:",
      error
    );


    container.innerHTML = "";


    message.innerHTML = `

      <div class="error-box">

        <strong>
          Could not load your schedule.
        </strong>

        <br><br>

        ${safeHtml(
          error?.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}

   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadStudentSchedule();

  }
);

</script>
