<script>

const db =
supabase.createClient(
  window.SUPABASE_CONFIG.url,
  window.SUPABASE_CONFIG.anonKey
);


/* =====================================================
   DAYS
===================================================== */

const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday",
  "Sunday"
];


/* =====================================================
   NORMALIZE DAY
===================================================== */

function normalizeDay(day){

  const value =
    String(day || "")
      .trim()
      .toLowerCase();

  const map = {

    mon:"Monday",
    monday:"Monday",

    tue:"Tuesday",
    tues:"Tuesday",
    tuesday:"Tuesday",

    wed:"Wednesday",
    wednesday:"Wednesday",

    thu:"Thursday",
    thur:"Thursday",
    thurs:"Thursday",
    thursday:"Thursday",

    fri:"Friday",
    friday:"Friday",

    sat:"Saturday",
    saturday:"Saturday",

    sun:"Sunday",
    sunday:"Sunday"

  };

  return map[value] || day;

}


/* =====================================================
   SAFE HTML
===================================================== */

function safeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(time){

  if(!time){
    return "";
  }

  const parts =
    String(time).split(":");

  let hour =
    parseInt(parts[0],10);

  const minute =
    parts[1] || "00";

  if(isNaN(hour)){
    return time;
  }

  const ampm =
    hour >= 12 ? "PM" : "AM";

  hour =
    hour % 12 || 12;

  return hour + ":" + minute + " " + ampm;

}


/* =====================================================
   FORMAT DURATION
===================================================== */

function formatDuration(minutes){

  const m =
    parseInt(minutes,10);

  if(!m){
    return "";
  }

  if(m < 60){

    return m + " minutes";

  }

  const h =
    Math.floor(m / 60);

  const r =
    m % 60;

  if(r === 0){

    return h +
      (h === 1 ? " hour" : " hours");

  }

  return h + "h " + r + "m";

}


/* =====================================================
   LOAD STUDENT SCHEDULE
===================================================== */

async function loadStudentSchedule(){

  const container =
    document.getElementById(
      "scheduleContainer"
    );

  const message =
    document.getElementById(
      "messageArea"
    );


  container.innerHTML = `

    <div class="loading">

      Loading your schedule...

    </div>

  `;


  message.innerHTML = "";


  try{


    /* =================================================
       GET CURRENT AUTH USER
    ================================================= */

    const {
      data:{
        user
      },
      error:authError
    } =
      await db.auth.getUser();


    if(authError){

      throw authError;

    }


    if(!user){

      throw new Error(
        "Student login session not found. Please login again."
      );

    }


    const authUserId =
      user.id;


    /* =================================================
       FIND STUDENT USING user_id

       IMPORTANT:
       students.id is NOT assumed to be auth UUID.
       We now use students.user_id.
    ================================================= */

    const {
      data:student,
      error:studentError
    } =
      await db
        .from("students")
        .select(`
          id,
          user_id,
          account_id,
          full_name,
          teacher_id,
          status
        `)
        .eq(
          "user_id",
          authUserId
        )
        .maybeSingle();


    if(studentError){

      throw studentError;

    }


    if(!student){

      throw new Error(
        "Your student account is not linked with this login."
      );

    }


    /* =================================================
       CHECK STUDENT STATUS
    ================================================= */

    if(
      student.status &&
      String(student.status)
        .toLowerCase()
        !== "active"
    ){

      throw new Error(
        "Your student account is currently inactive. Please contact the academy admin."
      );

    }


    /* =================================================
       LOAD ONLY THIS STUDENT'S ACTIVE SCHEDULE
    ================================================= */

    const {
      data:schedules,
      error:scheduleError
    } =
      await db
        .from("class_schedules")
        .select(`
          id,
          student_id,
          teacher_id,
          course,
          class_days,
          class_time,
          duration_minutes,
          google_meet_url,
          classroom_code,
          active
        `)
        .eq(
          "student_id",
          student.id
        )
        .eq(
          "active",
          true
        )
        .order(
          "class_time",
          {
            ascending:true
          }
        );


    if(scheduleError){

      throw scheduleError;

    }


    /* =================================================
       NO SCHEDULE
    ================================================= */

    if(
      !schedules ||
      !schedules.length
    ){

      container.innerHTML = `

        <div class="empty">

          <strong>
            No schedule available
          </strong>

          <br><br>

          No active weekly classes have been
          assigned to your student account yet.

        </div>

      `;

      return;

    }


    /* =================================================
       LOAD TEACHER NAMES
    ================================================= */

    const teacherIds =
      [
        ...new Set(
          schedules
            .map(
              x => x.teacher_id
            )
            .filter(Boolean)
        )
      ];


    const teacherMap = {};


    if(teacherIds.length){

      const {
        data:teachers,
        error:teacherError
      } =
        await db
          .from("teachers")
          .select(`
            id,
            name
          `)
          .in(
            "id",
            teacherIds
          );


      if(!teacherError){

        (teachers || [])
          .forEach(
            teacher => {

              teacherMap[
                teacher.id
              ] =
                teacher.name;

            }
          );

      }

    }


    /* =================================================
       GROUP CLASSES BY DAY
    ================================================= */

    const dayGroups = {};


    DAYS.forEach(
      day => {

        dayGroups[day] = [];

      }
    );


    schedules.forEach(
      schedule => {

        let days =
          schedule.class_days;


        if(!Array.isArray(days)){

          days = [days];

        }


        days.forEach(
          rawDay => {

            const day =
              normalizeDay(
                rawDay
              );


            if(
              DAYS.includes(day)
            ){

              dayGroups[day]
                .push(schedule);

            }

          }
        );

      }
    );


    /* =================================================
       TODAY
    ================================================= */

    const todayIndex =
      new Date().getDay();


    const todayName =
      DAYS[
        todayIndex === 0
          ? 6
          : todayIndex - 1
      ];


    /* =================================================
       BUILD SCHEDULE
    ================================================= */

    let html = "";


    DAYS.forEach(
      day => {

        const classes =
          dayGroups[day];


        if(!classes.length){

          return;

        }


        classes.sort(
          (a,b) =>

            String(
              a.class_time
            )
            .localeCompare(
              String(
                b.class_time
              )
            )

        );


        html += `

          <div class="day-section">

            <div class="day-title">

              ${safeHtml(day)}

              ${
                day === todayName

                  ?

                  `
                    <span
                      class="today-badge">

                      TODAY

                    </span>
                  `

                  :

                  ""
              }

            </div>

        `;


        classes.forEach(
          schedule => {


            const teacherName =
              teacherMap[
                schedule.teacher_id
              ] ||
              "Assigned Teacher";


            let actions = "";


            /* =========================================
               GOOGLE MEET
            ========================================= */

            if(
              schedule.google_meet_url
            ){

              actions += `

                <a
                  class="join-btn"
                  href="${safeHtml(
                    schedule.google_meet_url
                  )}"
                  target="_blank"
                  rel="noopener noreferrer">

                  Join Class

                </a>

              `;

            }


            /* =========================================
               CLASSROOM
            ========================================= */

            if(
              schedule.classroom_code
            ){

              const classroomUrl =

                "https://haroonibnrasheedonlinequranacadmey.github.io/haroon-quran-classroom/?code="

                +

                encodeURIComponent(
                  schedule.classroom_code
                );


              actions += `

                <a
                  class="classroom-btn"
                  href="${classroomUrl}"
                  target="_blank"
                  rel="noopener noreferrer">

                  Classroom

                </a>

              `;

            }


            /* =========================================
               CLASS CARD
            ========================================= */

            html += `

              <div class="class-card">


                <div class="class-main">


                  <div class="class-time">

                    ${safeHtml(
                      formatTime(
                        schedule.class_time
                      )
                    )}

                  </div>


                  <div class="class-course">

                    ${safeHtml(
                      schedule.course ||
                      "Quran Class"
                    )}

                  </div>


                  <div class="class-teacher">

                    Teacher:

                    ${safeHtml(
                      teacherName
                    )}

                  </div>


                  ${
                    schedule.duration_minutes

                      ?

                      `
                        <div
                          class="class-duration">

                          Duration:

                          ${safeHtml(
                            formatDuration(
                              schedule.duration_minutes
                            )
                          )}

                        </div>
                      `

                      :

                      ""
                  }


                </div>


                ${
                  actions

                    ?

                    `
                      <div
                        class="class-actions">

                        ${actions}

                      </div>
                    `

                    :

                    ""
                }


              </div>

            `;

          }
        );


        html += `

          </div>

        `;

      }
    );


    container.innerHTML =

      html ||

      `

        <div class="empty">

          No active classes found.

        </div>

      `;


  }catch(error){


    console.error(
      "Student schedule error:",
      error
    );


    container.innerHTML = "";


    message.innerHTML = `

      <div class="error-box">

        <strong>

          Could not load your schedule.

        </strong>

        <br><br>

        ${safeHtml(
          error?.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadStudentSchedule();

  }
);

</script>
