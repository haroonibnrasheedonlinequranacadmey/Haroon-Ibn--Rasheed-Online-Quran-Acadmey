<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My Courses | Haroon Ibn Rasheed Online Quran Academy</title>

<link rel="stylesheet" href="../css/portal.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/portal.js" defer></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7f9;
  font-family:Arial,Helvetica,sans-serif;
  color:#26343d;
}

.side-layout{
  min-height:100vh;
  display:flex;
}

.side{
  width:245px;
  background:#454d59;
  color:#fff;
  padding:25px 18px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
}

.side img{
  width:72px;
  height:72px;
  display:block;
  margin:0 auto 12px;
}

.side h3{
  text-align:center;
  margin:5px 0;
  font-size:18px;
}

.side small{
  display:block;
  text-align:center;
  color:#d9e0e4;
}

.side nav{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:16px!important;
}

.side a{
  display:block;
  color:#fff;
  text-decoration:none;
  padding:12px 14px;
  border-radius:8px;
  margin-top:4px;
  font-size:14px;
}

.side nav a:hover,
.side nav a.active{
  background:#2f9fba;
}

.logout{
  margin-top:20px!important;
  background:#f18b82;
  text-align:center;
}

.content{
  margin-left:245px;
  width:calc(100% - 245px);
  padding:30px;
}

.page-header{
  background:linear-gradient(135deg,#2f9fba,#287f96);
  color:#fff;
  padding:28px;
  border-radius:18px;
  margin-bottom:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.page-header h1{
  margin:0 0 8px;
  font-size:28px;
}

.page-header p{
  margin:0;
  opacity:.92;
  font-size:14px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.section-title{
  margin:0;
  font-size:20px;
  color:#34434d;
}

.courses-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
  margin-top:22px;
}

.course-card{
  background:#fff;
  border:1px solid #e2eaed;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 16px rgba(0,0,0,.05);
  transition:transform .2s ease,box-shadow .2s ease;
}

.course-card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 25px rgba(0,0,0,.10);
}

.course-image-wrap{
  position:relative;
  width:100%;
  height:165px;
  background:#eaf6f8;
  overflow:hidden;
}

.course-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.course-label{
  position:absolute;
  top:12px;
  right:12px;
  background:#2f9fba;
  color:#fff;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.course-content{
  padding:18px;
}

.course-content h3{
  margin:0 0 8px;
  color:#293943;
  font-size:18px;
  line-height:1.35;
}

.course-description{
  margin:0 0 15px;
  color:#6d7b83;
  font-size:13px;
  line-height:1.55;
  min-height:40px;
}

.course-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:15px;
}

.info-box{
  background:#f7fafb;
  border:1px solid #e7eef0;
  border-radius:9px;
  padding:9px;
}

.info-box span{
  display:block;
  font-size:10px;
  color:#7a8991;
  margin-bottom:4px;
}

.info-box strong{
  font-size:12px;
  color:#34434d;
}

.progress-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

.progress-header span{
  font-size:11px;
  color:#718089;
  font-weight:bold;
}

.progress-percent{
  color:#2f9fba!important;
}

.progress-box{
  height:8px;
  background:#e6edef;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:16px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#2f9fba;
  border-radius:20px;
  transition:width .4s ease;
}

.course-button{
  display:block;
  width:100%;
  text-align:center;
  background:#2f9fba;
  color:#fff;
  text-decoration:none;
  padding:11px 14px;
  border-radius:9px;
  font-weight:bold;
  font-size:13px;
}

.course-button:hover{
  background:#287f96;
}

.no-link{
  display:block;
  width:100%;
  text-align:center;
  background:#aab5bb;
  color:#fff;
  padding:11px 14px;
  border-radius:9px;
  font-size:13px;
}

.loading{
  grid-column:1/-1;
  padding:45px 20px;
  text-align:center;
  color:#718089;
}

.empty-box{
  grid-column:1/-1;
  padding:50px 20px;
  text-align:center;
  background:#f7fafb;
  border:1px dashed #d6e2e5;
  border-radius:14px;
  color:#718089;
}

.empty-box h3{
  margin:0 0 8px;
  color:#34434d;
}

.error-box{
  grid-column:1/-1;
  padding:20px;
  background:#fff3f2;
  border:1px solid #f4c5c1;
  border-radius:12px;
  color:#9a4740;
}

@media(max-width:1000px){

  .courses-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}

@media(max-width:800px){

  .side{
    width:210px;
  }

  .content{
    margin-left:210px;
    width:calc(100% - 210px);
    padding:20px;
  }

}

@media(max-width:600px){

  .side{
    position:relative;
    width:100%;
    min-height:auto;
  }

  .side-layout{
    display:block;
  }

  .content{
    margin-left:0;
    width:100%;
    padding:15px;
  }

  .page-header h1{
    font-size:23px;
  }

  .courses-grid{
    grid-template-columns:1fr;
  }

  .course-image-wrap{
    height:180px;
  }

  .card{
    padding:18px;
  }

}

</style>

</head>

<main class="content">

<h1>
My Courses
</h1>

<p>
View the courses available and assigned to your academy account.
</p>

</section>

<h2 class="section-title">
Available Courses
</h2>

<div
id="coursesGrid"
class="courses-grid">

<div class="loading">
Loading courses...
</div>

</div>

<script>

/* =========================================
   DATABASE
========================================= */

let db;


/* =========================================
   INITIALIZE
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  initCourses
);


async function initCourses(){

  try{

    if(!window.db){

      window.db =
        supabase.createClient(
          window.SUPABASE_CONFIG.url,
          window.SUPABASE_CONFIG.anonKey
        );

    }

    db = window.db;

    await loadStudentCourses();

  }catch(error){

    console.error(
      "Student courses error:",
      error
    );

    document.getElementById(
      "coursesGrid"
    ).innerHTML = `

      <div class="error-box">

        <strong>
          Courses could not be loaded.
        </strong>

        <br><br>

        ${escapeHtml(
          error.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}


/* =========================================
   LOAD STUDENT COURSES
========================================= */

async function loadStudentCourses(){

  const grid =
    document.getElementById(
      "coursesGrid"
    );


  /* =========================================
     GET CURRENT LOGIN
  ========================================= */

  const {
    data:{user},
    error:authError
  } =
    await db.auth.getUser();


  if(authError){
    throw authError;
  }


  if(!user){

    grid.innerHTML = `

      <div class="empty-box">

        <h3>
          Login Required
        </h3>

        <p>
          Please login again to view your courses.
        </p>

      </div>

    `;

    return;

  }


  /* =========================================
     FIND CURRENT STUDENT
  ========================================= */

  const {
    data:student,
    error:studentError
  } =
    await db
      .from("students")
      .select(`
        id,
        user_id,
        full_name,
        status
      `)
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(studentError){
    throw studentError;
  }


  if(!student){

    grid.innerHTML = `

      <div class="empty-box">

        <h3>
          Student Account Not Found
        </h3>

        <p>
          Your login is not linked with a student account.
        </p>

      </div>

    `;

    return;

  }


  const studentId =
    student.id;


  /* =========================================
     LOAD ADMIN-ADDED ACTIVE COURSES
  ========================================= */

  const {
    data:courses,
    error:courseError
  } =
    await db
      .from("courses")
      .select(`
        id,
        title,
        description,
        image_url,
        course_url,
        status,
        created_at
      `)
      .eq(
        "status",
        "active"
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(courseError){
    throw courseError;
  }


  const courseList =
    courses || [];


  if(courseList.length === 0){

    grid.innerHTML = `

      <div class="empty-box">

        <h3>
          No Active Courses
        </h3>

        <p>
          There are currently no active courses available.
        </p>

      </div>

    `;

    return;

  }


  /* =========================================
     LOAD STUDENT ENROLLMENTS
  ========================================= */

  const {
    data:enrollments,
    error:enrollmentError
  } =
    await db
      .from("student_enrollments")
      .select(`
        course_id,
        teacher_id,
        status,
        progress
      `)
      .eq(
        "student_id",
        studentId
      );


  /*
    Enrollment data is optional.
    Even if RLS blocks it, courses still show.
  */

  if(enrollmentError){

    console.warn(
      "Enrollment information unavailable:",
      enrollmentError
    );

  }


  const enrollmentList =
    enrollments || [];


  /* =========================================
     DISPLAY COURSES
  ========================================= */

  grid.innerHTML =
    courseList
      .map(
        course => {

          const enrollment =
            enrollmentList.find(
              item =>
                String(
                  item.course_id
                ) ===
                String(
                  course.id
                )
            );


          return createCourseCard(
            course,
            enrollment
          );

        }
      )
      .join("");

}


/* =========================================
   COURSE CARD
========================================= */

function createCourseCard(
  course,
  enrollment
){

  const title =
    escapeHtml(
      course.title ||
      "Untitled Course"
    );


  const description =
    escapeHtml(
      course.description ||
      "No description available."
    );


  const image =
    safeImage(
      course.image_url
    );


  /* STATUS */

  let statusText =
    "Active Course";


  if(enrollment){

    statusText =
      enrollment.status ||
      "Enrolled";

  }


  /* PROGRESS */

  let progress = 0;


  if(
    enrollment &&
    enrollment.progress !== null &&
    enrollment.progress !== undefined
  ){

    progress =
      Number(
        enrollment.progress
      ) || 0;

  }


  progress =
    Math.max(
      0,
      Math.min(
        100,
        progress
      )
    );


  /* COURSE LINK */

  let button = "";


  if(course.course_url){

    const url =
      safeUrl(
        course.course_url
      );


    if(url !== "#"){

      button = `

        <a
          class="course-button"
          href="${url}"
          target="_blank"
          rel="noopener noreferrer">

          Open Course

        </a>

      `;

    }else{

      button = `

        <span class="no-link">
          No Course Link
        </span>

      `;

    }

  }else{

    button = `

      <span class="no-link">
        No Course Link
      </span>

    `;

  }


  return `

    <article class="course-card">

      <div class="course-image-wrap">

        <img
          class="course-image"
          src="${image}"
          alt="${title}"
          onerror="this.src='../assets/hr-logo.svg'"
        >

        <span class="course-label">
          ${escapeHtml(statusText)}
        </span>

      </div>


      <div class="course-content">

        <h3>
          ${title}
        </h3>

        <p class="course-description">
          ${description}
        </p>


        <div class="course-info">

          <div class="info-box">

            <span>
              Status
            </span>

            <strong>
              ${escapeHtml(statusText)}
            </strong>

          </div>


          <div class="info-box">

            <span>
              Progress
            </span>

            <strong>
              ${progress}%
            </strong>

          </div>

        </div>


        <div class="progress-header">

          <span>
            Course Progress
          </span>

          <span class="progress-percent">
            ${progress}%
          </span>

        </div>


        <div class="progress-box">

          <div
            class="progress-bar"
            style="width:${progress}%">
          </div>

        </div>


        ${button}

      </div>

    </article>

  `;

}


/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function safeUrl(url){

  const value =
    String(
      url || ""
    ).trim();


  if(
    value.startsWith("https://") ||
    value.startsWith("http://")
  ){

    return escapeHtml(value);

  }


  return "#";

}


function safeImage(url){

  const value =
    String(
      url || ""
    ).trim();


  if(
    value.startsWith("https://") ||
    value.startsWith("http://") ||
    value.startsWith("../")
  ){

    return escapeHtml(value);

  }


  return "../assets/hr-logo.svg";

}

</script>
