<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7f9;
  font-family:Arial,Helvetica,sans-serif;
  color:#26343d;
}

/* ================================
   SIDEBAR
================================ */

.side-layout{
  min-height:100vh;
  display:flex;
}

.side{
  width:245px;
  background:#454d59;
  color:#fff;
  padding:25px 18px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
}

.side img{
  width:72px;
  height:72px;
  display:block;
  margin:0 auto 12px;
}

.side h3{
  text-align:center;
  margin:5px 0;
  font-size:18px;
}

.side small{
  display:block;
  text-align:center;
  color:#d9e0e4;
}

.side nav{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:16px!important;
}

.side a{
  display:block;
  color:#fff;
  text-decoration:none;
  padding:12px 14px;
  border-radius:8px;
  margin-top:4px;
  font-size:14px;
}

.side nav a:hover,
.side nav a.active{
  background:#2f9fba;
}

.logout{
  margin-top:20px!important;
  background:#f18b82;
  text-align:center;
}

/* ================================
   CONTENT
================================ */

.content{
  margin-left:245px;
  width:calc(100% - 245px);
  padding:30px;
}

/* ================================
   HEADER
================================ */

.page-header{
  background:linear-gradient(135deg,#2f9fba,#287f96);
  color:#fff;
  padding:28px;
  border-radius:18px;
  margin-bottom:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.page-header h1{
  margin:0 0 8px;
  font-size:28px;
}

.page-header p{
  margin:0;
  opacity:.92;
  font-size:14px;
}

/* ================================
   CARD
================================ */

.card{
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.section-title{
  margin:0;
  font-size:20px;
  color:#34434d;
}

/* ================================
   CLASS LIST
================================ */

.classes-list{
  display:grid;
  gap:15px;
  margin-top:20px;
}

.class-card{
  border:1px solid #e2eaed;
  border-radius:14px;
  padding:18px;
  background:#fff;
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.class-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.07);
}

.class-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:14px;
}

.course-name{
  color:#2f9fba;
  font-size:18px;
  font-weight:bold;
}

.class-date{
  color:#6d7b83;
  font-size:13px;
  margin-top:5px;
}

.status{
  padding:6px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

.status-scheduled{
  background:#fff4d6;
  color:#8a6410;
}

.status-active{
  background:#e5f6ea;
  color:#268044;
}

.status-completed{
  background:#e9eef1;
  color:#60707a;
}

.status-cancelled{
  background:#fff0ef;
  color:#a34b43;
}

.class-details{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:15px;
}

.detail{
  background:#f7fafb;
  border:1px solid #e7eef0;
  border-radius:9px;
  padding:11px;
}

.detail span{
  display:block;
  color:#7a8991;
  font-size:10px;
  margin-bottom:5px;
}

.detail strong{
  display:block;
  color:#34434d;
  font-size:13px;
  word-break:break-word;
}

.join-button{
  display:inline-block;
  background:#2f9fba;
  color:#fff;
  text-decoration:none;
  padding:10px 17px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}

.join-button:hover{
  background:#287f96;
}

.no-meet{
  display:inline-block;
  background:#aab5bb;
  color:#fff;
  padding:10px 17px;
  border-radius:8px;
  font-size:13px;
}

/* ================================
   EMPTY / LOADING
================================ */

.loading,
.empty-box{
  text-align:center;
  padding:45px 20px;
  color:#718089;
}

.empty-box{
  background:#f7fafb;
  border:1px dashed #d6e2e5;
  border-radius:14px;
}

.empty-box h3{
  margin:0 0 8px;
  color:#34434d;
}

.error-box{
  padding:20px;
  background:#fff3f2;
  border:1px solid #f4c5c1;
  border-radius:12px;
  color:#9a4740;
}

/* ================================
   MOBILE
================================ */

@media(max-width:950px){

  .class-details{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

@media(max-width:800px){

  .side{
    width:210px;
  }

  .content{
    margin-left:210px;
    width:calc(100% - 210px);
    padding:20px;
  }

}

@media(max-width:600px){

  .side{
    position:relative;
    width:100%;
    min-height:auto;
  }

  .side-layout{
    display:block;
  }

  .content{
    margin-left:0;
    width:100%;
    padding:15px;
  }

  .page-header h1{
    font-size:23px;
  }

  .card{
    padding:18px;
  }

  .class-top{
    flex-direction:column;
  }

  .class-details{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<script>

/* =========================================
   INITIALIZE
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  loadStudentClasses
);


/* =========================================
   LOAD STUDENT CLASSES
========================================= */

async function loadStudentClasses(){

  const container =
    document.getElementById(
      "classesList"
    );


  try{

    const result =
      await getCurrentStudent();


    if(!result){

      return;

    }


    const studentId =
      result.student.id;


    /*
      IMPORTANT:

      Classes come directly from
      class_schedules.

      Admin/Teacher creates the schedule
      → student sees it automatically.
    */

    const {
      data,
      error
    } = await db

      .from("class_schedules")

      .select(`
        *,
        teacher:profiles!class_schedules_teacher_id_fkey(
          id,
          full_name
        )
      `)

      .eq(
        "student_id",
        studentId
      )

      .eq(
        "active",
        true
      )

      .order(
        "class_time",
        {
          ascending:true
        }
      );


    if(error){

      console.error(
        "Classes error:",
        error
      );

      container.innerHTML = `

        <div class="error-box">

          Could not load your classes.

          <br><br>

          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}

        </div>

      `;

      return;

    }


    if(!data || data.length === 0){

      container.innerHTML = `

        <div class="empty-box">

          <h3>
          No Classes Scheduled
          </h3>

          <p>
          Your scheduled classes will appear here automatically after the academy assigns them.
          </p>

        </div>

      `;

      return;

    }


    container.innerHTML =
      data
        .map(
          schedule =>
            createClassCard(
              schedule
            )
        )
        .join("");


  }catch(error){

    console.error(
      "Student classes error:",
      error
    );

    container.innerHTML = `

      <div class="error-box">

        Something went wrong while loading your classes.

      </div>

    `;

  }

}


/* =========================================
   CREATE CLASS CARD
========================================= */

function createClassCard(
  schedule
){

  const course =
    escapeHtml(
      schedule.course ||
      "Quran Class"
    );


  const teacher =
    escapeHtml(
      schedule.teacher?.full_name ||
      "Teacher"
    );


  const days =
    escapeHtml(
      formatDays(
        schedule.class_days
      )
    );


  const time =
    escapeHtml(
      formatTime(
        schedule.class_time
      )
    );


  const duration =
    schedule.duration ||
    schedule.minutes ||
    "-";


  const status =
    getClassStatus(
      schedule
    );


  const statusClass =
    "status-" +
    status
      .toLowerCase()
      .replace(
        /\s+/g,
        "-"
      );


  let joinButton = "";


  if(schedule.google_meet_url){

    const url =
      safeUrl(
        schedule.google_meet_url
      );


    if(url !== "#"){

      joinButton = `

        <a
          class="join-button"
          href="${url}"
          target="_blank"
          rel="noopener noreferrer">

          Join Google Meet

        </a>

      `;

    }else{

      joinButton = `

        <span class="no-meet">
          Meeting Link Unavailable
        </span>

      `;

    }

  }else{

    joinButton = `

      <span class="no-meet">
        Meeting Link Not Added
      </span>

    `;

  }


  return `

    <article class="class-card">


      <div class="class-top">


        <div>

          <div class="course-name">
            ${course}
          </div>

          <div class="class-date">
            📅 ${days}
          </div>

        </div>


        <span
          class="status ${statusClass}">

          ${escapeHtml(status)}

        </span>


      </div>


      <div class="class-details">


        <div class="detail">

          <span>
            Teacher
          </span>

          <strong>
            👨‍🏫 ${teacher}
          </strong>

        </div>


        <div class="detail">

          <span>
            Class Time
          </span>

          <strong>
            🕐 ${time}
          </strong>

        </div>


        <div class="detail">

          <span>
            Duration
          </span>

          <strong>
            ⏱ ${escapeHtml(
              String(duration)
            )}
          </strong>

        </div>


        <div class="detail">

          <span>
            Days
          </span>

          <strong>
            ${days}
          </strong>

        </div>


      </div>


      ${joinButton}


    </article>

  `;

}


/* =========================================
   CLASS STATUS
========================================= */

function getClassStatus(
  schedule
){

  /*
    class_schedules does not currently
    have a dedicated class status column.

    Therefore we safely use the active
    schedule state.
  */

  if(schedule.active === false){

    return "Cancelled";

  }


  return "Scheduled";

}


/* =========================================
   FORMAT DAYS
========================================= */

function formatDays(days){

  if(!days){

    return "Not scheduled";

  }


  if(Array.isArray(days)){

    return days.join(", ");

  }


  return String(days)
    .replace(
      /[\[\]"]/g,
      ""
    );

}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(time){

  if(!time){

    return "Not scheduled";

  }


  const parts =
    String(time).split(":");


  if(parts.length < 2){

    return time;

  }


  let hour =
    parseInt(
      parts[0],
      10
    );


  const minute =
    parts[1];


  const ampm =
    hour >= 12
      ? "PM"
      : "AM";


  hour =
    hour % 12 || 12;


  return `${hour}:${minute} ${ampm}`;

}


/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function safeUrl(url){

  const value =
    String(url || "")
      .trim();


  if(
    value.startsWith(
      "https://"
    ) ||

    value.startsWith(
      "http://"
    )
  ){

    return escapeHtml(
      value
    );

  }


  return "#";

}

</script>
