<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:Arial,Helvetica,sans-serif;
  color:#26343d;
}

/* ================================
   SIDEBAR
================================ */

.side-layout{
  min-height:100vh;
  display:flex;
}

.side{

  background:#454d59;
  color:#fff;
  padding:25px 18px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
}

.side img{
  width:72px;
  height:72px;
  display:block;
  margin:0 auto 12px;
}

.side h3{
  text-align:center;
  margin:5px 0;
  font-size:18px;
}

.side small{
  display:block;
  text-align:center;
  color:#d9e0e4;
}

.side nav{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:16px!important;
}

.side a{
  display:block;
  color:#fff;
  text-decoration:none;
  padding:12px 14px;
  border-radius:8px;
  margin-top:4px;
  font-size:14px;
}

.side nav a:hover,
.side nav a.active{
  background:#2f9fba;
}

.logout{
  margin-top:20px!important;
  background:#f18b82;
  text-align:center;
}

/* ================================
   CONTENT
================================ */

.content{
  margin-left:245px;
  width:calc(100% - 245px);
  padding:30px;
}

/* ================================
   HEADER
================================ */

.page-header{
  background:linear-gradient(135deg,#2f9fba,#287f96);
  color:#fff;
  padding:28px;
  border-radius:18px;
  margin-bottom:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.page-header h1{
  margin:0 0 8px;
  font-size:28px;
}

.page-header p{
  margin:0;
  opacity:.92;
  font-size:14px;
}

/* ================================
   CARD
================================ */

.card{
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.section-title{
  margin:0;
  font-size:20px;
  color:#34434d;
}

/* ================================
   CLASS LIST
================================ */

.classes-list{
  display:grid;
  gap:15px;
  margin-top:20px;
}

.class-card{
  border:1px solid #e2eaed;
  border-radius:14px;
  padding:18px;
  background:#fff;
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.class-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.07);
}

.class-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:14px;
}

.course-name{
  color:#2f9fba;
  font-size:18px;
  font-weight:bold;
}

.class-date{
  color:#6d7b83;
  font-size:13px;
  margin-top:5px;
}

.status{
  padding:6px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

.status-scheduled{
  background:#fff4d6;
  color:#8a6410;
}

.status-active{
  background:#e5f6ea;
  color:#268044;
}

.status-completed{
  background:#e9eef1;
  color:#60707a;
}

.status-cancelled{
  background:#fff0ef;
  color:#a34b43;
}

.class-details{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:15px;
}

.detail{
  background:#f7fafb;
  border:1px solid #e7eef0;
  border-radius:9px;
  padding:11px;
}

.detail span{
  display:block;
  color:#7a8991;
  font-size:10px;
  margin-bottom:5px;
}

.detail strong{
  display:block;
  color:#34434d;
  font-size:13px;
  word-break:break-word;
}

.join-button{
  display:inline-block;
  background:#2f9fba;
  color:#fff;
  text-decoration:none;
  padding:10px 17px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}

.join-button:hover{
  background:#287f96;
}

.no-meet{
  display:inline-block;
  background:#aab5bb;
  color:#fff;
  padding:10px 17px;
  border-radius:8px;
  font-size:13px;
}

/* ================================
   EMPTY / LOADING
================================ */

.loading,
.empty-box{
  text-align:center;
  padding:45px 20px;
  color:#718089;
}

.empty-box{
  background:#f7fafb;
  border:1px dashed #d6e2e5;
  border-radius:14px;
}

.empty-box h3{
  margin:0 0 8px;
  color:#34434d;
}

.error-box{
  padding:20px;
  background:#fff3f2;
  border:1px solid #f4c5c1;
  border-radius:12px;
  color:#9a4740;
}

/* ================================
   MOBILE
================================ */

@media(max-width:950px){

  .class-details{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

@media(max-width:800px){

  .side{
    width:210px;
  }

  .content{
    margin-left:210px;
    width:calc(100% - 210px);
    padding:20px;
  }

}

@media(max-width:600px){

  .side{
    position:relative;
    width:100%;
    min-height:auto;
  }

  .side-layout{
    display:block;
  }

  .content{
    margin-left:0;
    width:100%;
    padding:15px;
  }

  .page-header h1{
    font-size:23px;
  }

  .card{
    padding:18px;
  }

  .class-top{
    flex-direction:column;
  }

  .class-details{
    grid-template-columns:1fr;
  }

}

<script>

/* =========================================
   SUPABASE CLIENT
   Uses the academy-wide client when portal.js
   has initialized it, with a safe local fallback.
========================================= */

function getAcademyDB(){

  if(window.academyDB){
    return window.academyDB;
  }

  const cfg = window.SUPABASE_CONFIG || {};

  if(
    window.supabase &&
    cfg.url &&
    cfg.anonKey
  ){
    window.academyDB =
      window.supabase.createClient(
        cfg.url,
        cfg.anonKey
      );

    return window.academyDB;
  }

  return null;
}


/* =========================================
   INITIALIZE
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  loadStudentClasses
);


/* =========================================
   CURRENT STUDENT
========================================= */

async function getCurrentStudent(){

  const db = getAcademyDB();

  if(!db){
    throw new Error(
      "Supabase client is not available. Please check js/config.js."
    );
  }

  const authResult =
    await db.auth.getUser();

  const user =
    authResult?.data?.user;

  if(!user){
    location.href = "../portal-login.html";
    return null;
  }

  let student = null;

  /* Newer portal structure */
  try{
    const r = await db
      .from("students")
      .select("*")
      .eq("account_id", user.id)
      .maybeSingle();

    if(!r.error && r.data){
      student = r.data;
    }
  }catch(e){
    console.warn("account_id lookup skipped:", e);
  }

  /* Older structure fallback */
  if(!student){
    try{
      const r = await db
        .from("students")
        .select("*")
        .eq("user_id", user.id)
        .maybeSingle();

      if(!r.error && r.data){
        student = r.data;
      }
    }catch(e){
      console.warn("user_id lookup skipped:", e);
    }
  }

  /* Email fallback for existing student records */
  if(!student && user.email){
    try{
      const r = await db
        .from("students")
        .select("*")
        .eq("email", user.email)
        .maybeSingle();

      if(!r.error && r.data){
        student = r.data;
      }
    }catch(e){
      console.warn("email lookup skipped:", e);
    }
  }

  if(!student){
    throw new Error(
      "Student account is not linked to a student record yet."
    );
  }

  return {
    user,
    student
  };
}


/* =========================================
   LOAD STUDENT CLASSES
========================================= */

async function loadStudentClasses(){

  const container =
    document.getElementById("classesList");

  if(!container) return;

  try{

    const db = getAcademyDB();

    if(!db){
      throw new Error(
        "Supabase client is not available. Please check js/config.js."
      );
    }

    const result =
      await getCurrentStudent();

    if(!result){
      return;
    }

    const studentId =
      result.student.id;

    const {
      data,
      error
    } = await db
      .from("class_schedules")
      .select(`
        *
      `)
      .eq("student_id", studentId)
      .eq("active", true)
      .order("class_time", {ascending:true});

    if(error){
      console.error("Classes error:", error);
      throw error;
    }

    /* class_schedules.teacher_id points to teachers.id, not profiles.id.
       Therefore teacher details are loaded separately instead of using
       a profiles relationship that does not exist in Supabase. */
    let teacherMap = {};

    const teacherIds = [...new Set(
      (data || []).map(x => x.teacher_id).filter(Boolean)
    )];

    if(teacherIds.length){
      try{
        const teacherResult = await db
          .from("teachers")
          .select("id,full_name,user_id,account_id")
          .in("id", teacherIds);

        if(!teacherResult.error){
          (teacherResult.data || []).forEach(t => {
            teacherMap[String(t.id)] = t;
          });
        }else{
          console.warn("Teacher lookup skipped:", teacherResult.error.message);
        }
      }catch(e){
        console.warn("Teacher lookup skipped:", e);
      }
    }

    /* If a teacher row does not contain a name, try its linked profile. */
    for(const teacherId of teacherIds){
      const teacher = teacherMap[String(teacherId)];
      if(teacher && String(teacher.full_name || "").trim()) continue;

      const profileId = teacher?.user_id || teacher?.account_id;
      if(!profileId) continue;

      try{
        const pr = await db
          .from("profiles")
          .select("id,full_name")
          .eq("id", profileId)
          .maybeSingle();

        if(!pr.error && pr.data){
          teacherMap[String(teacherId)] = {
            ...(teacher || {id:teacherId}),
            full_name: pr.data.full_name || "Teacher"
          };
        }
      }catch(e){
        console.warn("Teacher profile lookup skipped:", e);
      }
    }

    (data || []).forEach(schedule => {
      const teacher = teacherMap[String(schedule.teacher_id)];
      schedule.teacher = teacher || null;
      schedule.teacher_name = teacher?.full_name || "Teacher";
    });

    if(!data || data.length === 0){
      container.innerHTML = `
        <div class="empty-box">
          <h3>No Classes Scheduled</h3>
          <p>
            Your scheduled classes will appear here automatically after the academy assigns them.
          </p>
        </div>
      `;
      return;
    }

    /* Optional live-session lookup. If the table/RLS is not
       available, classes still load normally as Scheduled. */
    let sessions = [];

    try{
      const ids = data
        .map(x => x.id)
        .filter(Boolean);

      if(ids.length){
        const sessionResult = await db
          .from("teacher_class_sessions")
          .select("id,schedule_id,status,started_at,completed_at")
          .in("schedule_id", ids);

        if(!sessionResult.error){
          sessions = sessionResult.data || [];
        }
      }
    }catch(e){
      console.warn("Live session lookup skipped:", e);
    }

    const sessionMap = {};

    sessions.forEach(session => {
      sessionMap[session.schedule_id] = session;
    });

    container.innerHTML = data
      .map(schedule =>
        createClassCard(
          schedule,
          sessionMap[schedule.id] || null
        )
      )
      .join("");

  }catch(error){

    console.error("Student classes error:", error);

    container.innerHTML = `
      <div class="error-box">
        Something went wrong while loading your classes.
        <br><br>
        ${escapeHtml(
          error?.message || "Unknown error"
        )}
      </div>
    `;
  }
}


/* =========================================
   CREATE CLASS CARD
========================================= */

function createClassCard(schedule, session){

  const course =
    escapeHtml(
      schedule.course ||
      schedule.course_name ||
      "Quran Class"
    );

  const teacher =
    escapeHtml(
      schedule.teacher?.full_name ||
      schedule.teacher_name ||
      "Teacher"
    );

  const days =
    escapeHtml(
      formatDays(schedule.class_days)
    );

  const time =
    escapeHtml(
      formatTime(schedule.class_time)
    );

  const duration =
    schedule.duration_minutes ||
    schedule.duration ||
    schedule.minutes ||
    "-";

  const status =
    getClassStatus(schedule, session);

  const statusClass =
    "status-" +
    status.toLowerCase().replace(/\s+/g, "-");

  let joinButton = "";

  if(schedule.google_meet_url){

    const url =
      safeUrl(schedule.google_meet_url);

    if(url !== "#"){
      joinButton = `
        <a
          class="join-button"
          href="${url}"
          target="_blank"
          rel="noopener noreferrer">
          Join Google Meet
        </a>
      `;
    }
  }else{
    joinButton = `
      <span class="no-meet">
        Meeting Link Not Added
      </span>
    `;
  }

  /* Academy classroom button */
  if(schedule.classroom_code){

    const code =
      encodeURIComponent(
        String(schedule.classroom_code).trim()
      );

    joinButton += `
      <a
        class="join-button"
        href="https://haroonibnrasheedonlinequranacadmey.github.io/haroon-quran-classroom/?code=${code}"
        target="_blank"
        rel="noopener noreferrer">
        Open Classroom
      </a>
    `;
  }

  return `
    <article class="class-card">

      <div class="class-top">
        <div>
          <div class="course-name">
            ${course}
          </div>

          <div class="class-date">
            📅 ${days}
          </div>
        </div>

        <span class="status ${statusClass}">
          ${escapeHtml(status)}
        </span>
      </div>

      <div class="class-details">

        <div class="detail">
          <span>Teacher</span>
          <strong>👨‍🏫 ${teacher}</strong>
        </div>

        <div class="detail">
          <span>Class Time</span>
          <strong>🕐 ${time}</strong>
        </div>

        <div class="detail">
          <span>Duration</span>
          <strong>⏱ ${escapeHtml(String(duration))}</strong>
        </div>

        <div class="detail">
          <span>Days</span>
          <strong>${days}</strong>
        </div>

      </div>

      <div class="class-actions">
        ${joinButton || '<span class="no-meet">No online link added</span>'}
      </div>

    </article>
  `;
}


/* =========================================
   CLASS STATUS
========================================= */

function getClassStatus(schedule, session){

  if(session){

    const value =
      String(session.status || "")
        .trim()
        .toLowerCase();

    if(value === "active" || value === "started"){
      return "Active";
    }

    if(value === "completed" || value === "ended"){
      return "Completed";
    }

    if(value === "cancelled" || value === "canceled"){
      return "Cancelled";
    }
  }

  if(schedule.active === false){
    return "Cancelled";
  }

  return "Scheduled";
}


/* =========================================
   FORMAT DAYS
========================================= */

function formatDays(days){

  if(!days){
    return "Not scheduled";
  }

  if(Array.isArray(days)){
    return days.join(", ");
  }

  return String(days)
    .replace(/[\[\]"]/g, "");
}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(time){

  if(!time){
    return "Not scheduled";
  }

  const parts = String(time).split(":");

  if(parts.length < 2){
    return time;
  }

  let hour = parseInt(parts[0], 10);
  const minute = parts[1];

  if(Number.isNaN(hour)){
    return time;
  }

  const ampm = hour >= 12 ? "PM" : "AM";
  hour = hour % 12 || 12;

  return `${hour}:${minute} ${ampm}`;
}


/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function safeUrl(url){

  const value = String(url || "").trim();

  if(
    value.startsWith("https://") ||
    value.startsWith("http://")
  ){
    return escapeHtml(value);
  }

  return "#";
}

</script>
