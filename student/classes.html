<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7f9;
  font-family:Arial,Helvetica,sans-serif;
  color:#26343d;
}

/* ================================
   SIDEBAR
================================ */

.side-layout{
  min-height:100vh;
  display:flex;
}

.side{
  width:245px;
  background:#454d59;
  color:#fff;
  padding:25px 18px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
}

.side img{
  width:72px;
  height:72px;
  display:block;
  margin:0 auto 12px;
}

.side h3{
  text-align:center;
  margin:5px 0;
  font-size:18px;
}

.side small{
  display:block;
  text-align:center;
  color:#d9e0e4;
}

.side nav{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:16px!important;
}

.side a{
  display:block;
  color:#fff;
  text-decoration:none;
  padding:12px 14px;
  border-radius:8px;
  margin-top:4px;
  font-size:14px;
}

.side nav a:hover,
.side nav a.active{
  background:#2f9fba;
}

.logout{
  margin-top:20px!important;
  background:#f18b82;
  text-align:center;
}

/* ================================
   CONTENT
================================ */

.content{
  margin-left:245px;
  width:calc(100% - 245px);
  padding:30px;
}

/* ================================
   HEADER
================================ */

.page-header{
  background:linear-gradient(135deg,#2f9fba,#287f96);
  color:#fff;
  padding:28px;
  border-radius:18px;
  margin-bottom:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.page-header h1{
  margin:0 0 8px;
  font-size:28px;
}

.page-header p{
  margin:0;
  opacity:.92;
  font-size:14px;
}

/* ================================
   CARD
================================ */

.card{
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.section-title{
  margin:0;
  font-size:20px;
  color:#34434d;
}

/* ================================
   CLASS LIST
================================ */

.classes-list{
  display:grid;
  gap:15px;
  margin-top:20px;
}

.class-card{
  border:1px solid #e2eaed;
  border-radius:14px;
  padding:18px;
  background:#fff;
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.class-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.07);
}

.class-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:14px;
}

.course-name{
  color:#2f9fba;
  font-size:18px;
  font-weight:bold;
}

.class-date{
  color:#6d7b83;
  font-size:13px;
  margin-top:5px;
}

.status{
  padding:6px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

.status-scheduled{
  background:#fff4d6;
  color:#8a6410;
}

.status-active{
  background:#e5f6ea;
  color:#268044;
}

.status-completed{
  background:#e9eef1;
  color:#60707a;
}

.status-cancelled{
  background:#fff0ef;
  color:#a34b43;
}

.class-details{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:15px;
}

.detail{
  background:#f7fafb;
  border:1px solid #e7eef0;
  border-radius:9px;
  padding:11px;
}

.detail span{
  display:block;
  color:#7a8991;
  font-size:10px;
  margin-bottom:5px;
}

.detail strong{
  display:block;
  color:#34434d;
  font-size:13px;
  word-break:break-word;
}

.join-button{
  display:inline-block;
  background:#2f9fba;
  color:#fff;
  text-decoration:none;
  padding:10px 17px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}

.join-button:hover{
  background:#287f96;
}

.classroom-button{
  background:#3a8f62;
}

.classroom-button:hover{
  background:#2f7650;
}


.no-meet{
  display:inline-block;
  background:#aab5bb;
  color:#fff;
  padding:10px 17px;
  border-radius:8px;
  font-size:13px;
}

/* ================================
   EMPTY / LOADING
================================ */

.loading,
.empty-box{
  text-align:center;
  padding:45px 20px;
  color:#718089;
}

.empty-box{
  background:#f7fafb;
  border:1px dashed #d6e2e5;
  border-radius:14px;
}

.empty-box h3{
  margin:0 0 8px;
  color:#34434d;
}

.error-box{
  padding:20px;
  background:#fff3f2;
  border:1px solid #f4c5c1;
  border-radius:12px;
  color:#9a4740;
}

/* ================================
   MOBILE
================================ */

@media(max-width:950px){

  .class-details{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

}

@media(max-width:800px){

  .side{
    width:210px;

  .content{
    margin-left:210px;
    width:calc(100% - 210px);
    padding:20px;

@media(max-width:600px){

  .side{
    position:relative;
    width:100%;

  .side-layout{

  .content{
    margin-left:0;
    width:100%;
    padding:15px;
  }

  .page-header h1{
    font-size:23px;
  }

  .card{
    padding:18px;
  }

  .class-top{
    flex-direction:column;
  }

  .class-details{
    grid-template-columns:1fr;
  }

}

<script>

/* =========================================================
   STUDENT MY CLASSES
   Original academy design preserved.
   This page reads Admin schedules and Teacher sessions.
========================================================= */

/* portal.js exposes the Supabase client as academyDB.
   Never rely on an undeclared global named `db` here. */
const db = window.academyDB;

document.addEventListener("DOMContentLoaded", loadStudentClasses);

const CLASSROOM_BASE =
  "https://haroonibnrasheedonlinequranacadmey.github.io/haroon-quran-classroom/?code=";

async function loadStudentClasses(){

  const container = document.getElementById("classesList");

  container.innerHTML = `<div class="loading">Loading your classes...</div>`;

  try{
    const auth = await db.auth.getSession();
    const uid = auth?.data?.session?.user?.id;

    if(!uid){
      container.innerHTML = `<div class="error-box">Please login again to view your classes.</div>`;
      return;
    }

    /* -------------------------------------------------------
       Find the student's own record.
       Different versions of the academy used different
       account-link columns, so we support all existing forms.
    ------------------------------------------------------- */
    let student = null;

    const byAccount = await db
      .from("students")
      .select("*")
      .eq("account_id", uid)
      .maybeSingle();

    if(!byAccount.error && byAccount.data)
      student = byAccount.data;

    if(!student){
      const byUser = await db
        .from("students")
        .select("*")
        .eq("user_id", uid)
        .maybeSingle();

      if(!byUser.error && byUser.data)
        student = byUser.data;
    }

    if(!student){
      const prof = await db
        .from("profiles")
        .select("id,full_name")
        .eq("id", uid)
        .maybeSingle();

      if(prof.data?.full_name){
        const byName = await db
          .from("students")
          .select("*")
          .eq("full_name", prof.data.full_name)
          .maybeSingle();

        if(!byName.error && byName.data)
          student = byName.data;
      }
    }

    if(!student){
      container.innerHTML = `
        <div class="empty-box">
          <h3>Student account is not linked yet</h3>
          <p>Your student profile has not been linked to this portal account.</p>
        </div>`;
      return;
    }

    const studentTimezone =
      student.timezone ||
      localStorage.getItem("student_timezone") ||
      "Asia/Karachi";

    window.currentStudentTimezone = studentTimezone;
    window.studentTimezone = studentTimezone;

    localStorage.setItem("student_timezone", studentTimezone);

    /* -------------------------------------------------------
       Load the schedules assigned to this student.
    ------------------------------------------------------- */
    const scheduleResult = await db
      .from("class_schedules")
      .select(`
        *,
        teacher:profiles!class_schedules_teacher_id_fkey(
          id,
          full_name
        )
      `)
      .eq("student_id", student.id)
      .eq("active", true)
      .order("class_time", {ascending:true});

    if(scheduleResult.error){
      console.error("Student classes error:", scheduleResult.error);
      container.innerHTML = `
        <div class="error-box">
          Could not load your classes.<br><br>
          ${escapeHtml(scheduleResult.error.message || "Unknown error")}
        </div>`;
      return;
    }

    const schedules = scheduleResult.data || [];

    if(!schedules.length){
      container.innerHTML = `
        <div class="empty-box">
          <h3>No Classes Scheduled</h3>
          <p>Your scheduled classes will appear here automatically after the academy assigns them.</p>
        </div>`;
      return;
    }

    /* -------------------------------------------------------
       Read teacher sessions for these schedules.
       If the table/policy is not available, the class remains
       Scheduled instead of breaking the whole Student Portal.
    ------------------------------------------------------- */
    const ids = schedules.map(s => s.id).filter(Boolean);
    let sessions = [];

    if(ids.length){
      const sr = await db
        .from("teacher_class_sessions")
        .select("id,schedule_id,student_id,class_date,status,started_at,completed_at")
        .in("schedule_id", ids)
        .eq("student_id", student.id);

      if(!sr.error)
        sessions = sr.data || [];
      else
        console.warn("Teacher sessions could not be read:", sr.error.message);
    }

    const sessionMap = {};
    sessions.forEach(s => {
      const old = sessionMap[s.schedule_id];
      if(!old || String(s.class_date || "") >= String(old.class_date || ""))
        sessionMap[s.schedule_id] = s;
    });

    container.innerHTML = schedules
      .map(schedule => createClassCard(schedule, sessionMap[schedule.id], studentTimezone))
      .join("");

  }catch(error){
    console.error("Student classes error:", error);
    container.innerHTML = `
      <div class="error-box">
        Something went wrong while loading your classes.
        <br><br>${escapeHtml(error?.message || "Unknown error")}
      </div>`;
  }
}

function createClassCard(schedule, session, studentTimezone){

  const course = escapeHtml(schedule.course || "Quran Class");
  const teacher = escapeHtml(schedule.teacher?.full_name || schedule.teacher_name || "Teacher");
  const days = escapeHtml(formatDays(schedule.class_days));
  const time = escapeHtml(formatStudentTime(schedule.class_time, schedule.schedule_timezone, studentTimezone));
  const duration = schedule.duration_minutes || schedule.duration || schedule.minutes || "-";

  const status = getClassStatus(schedule, session);
  const statusClass = "status-" + status.toLowerCase().replace(/\s+/g,"-");

  let actions = "";

  if(schedule.google_meet_url){
    const url = safeUrl(schedule.google_meet_url);
    actions += url !== "#"
      ? `<a class="join-button" href="${url}" target="_blank" rel="noopener noreferrer">Join Google Meet</a>`
      : `<span class="no-meet">Meeting Link Unavailable</span>`;
  }else{
    actions += `<span class="no-meet">Meeting Link Not Added</span>`;
  }

  if(schedule.classroom_code){
    const classroomUrl = CLASSROOM_BASE + encodeURIComponent(String(schedule.classroom_code));
    actions += `
      <a class="join-button classroom-button" href="${escapeHtml(classroomUrl)}" target="_blank" rel="noopener noreferrer">
        Open Classroom
      </a>`;
  }

  let sessionMessage = "";

  if(status === "Active"){
    sessionMessage = `
      <div style="margin:0 0 14px;padding:11px 13px;border-radius:9px;background:#e5f6ea;color:#268044;font-size:13px;font-weight:bold;">
        🟢 Class is Active Now — Your teacher has started the class.
      </div>`;
  }else if(status === "Completed"){
    sessionMessage = `
      <div style="margin:0 0 14px;padding:11px 13px;border-radius:9px;background:#e9eef1;color:#60707a;font-size:13px;">
        ✓ This class session has been completed.
      </div>`;
  }

  return `
    <article class="class-card">
      <div class="class-top">
        <div>
          <div class="course-name">${course}</div>
          <div class="class-date">📅 ${days}</div>
        </div>
        <span class="status ${statusClass}">${escapeHtml(status)}</span>
      </div>

      ${sessionMessage}

      <div class="class-details">
        <div class="detail">
          <span>Teacher</span>
          <strong>👨‍🏫 ${teacher}</strong>
        </div>
        <div class="detail">
          <span>Class Time</span>
          <strong>🕐 ${time}</strong>
        </div>
        <div class="detail">
          <span>Duration</span>
          <strong>⏱ ${escapeHtml(String(duration))}${String(duration).match(/minute/i) ? "" : " Minutes"}</strong>
        </div>
        <div class="detail">
          <span>Days</span>
          <strong>${days}</strong>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        ${actions}
      </div>
    </article>
  `;
}

function getClassStatus(schedule, session){
  if(schedule.active === false)
    return "Cancelled";

  const s = String(session?.status || "").toLowerCase();

  if(["active","started","in_progress"].includes(s))
    return "Active";

  if(["completed","complete","ended"].includes(s))
    return "Completed";

  if(["cancelled","canceled"].includes(s))
    return "Cancelled";

  return "Scheduled";
}

function formatDays(days){
  if(!days) return "Not scheduled";
  if(Array.isArray(days)) return days.join(", ");
  return String(days).replace(/[\[\]"]/g,"");
}

function formatStudentTime(time, sourceTimezone, targetTimezone){
  if(!time) return "Not scheduled";

  const raw = String(time);
  const parts = raw.split(":");
  if(parts.length < 2) return raw;

  let h = parseInt(parts[0],10);
  const m = String(parts[1]).padStart(2,"0");

  if(!Number.isFinite(h)) return raw;

  /* If no source timezone is configured, preserve the academy's stored time. */
  if(!sourceTimezone || sourceTimezone === targetTimezone)
    return to12Hour(h,m);

  try{
    /* Build a neutral date and calculate the timezone offset difference. */
    const now = new Date();
    const src = getPartsInZone(now, sourceTimezone);
    const tgt = getPartsInZone(now, targetTimezone);

    const sourceMinutes = src.hour*60 + src.minute;
    const targetMinutes = tgt.hour*60 + tgt.minute;
    const diff = targetMinutes - sourceMinutes;

    let total = h*60 + parseInt(m,10) + diff;
    total = ((total % 1440) + 1440) % 1440;

    return to12Hour(Math.floor(total/60), total%60);
  }catch(e){
    return to12Hour(h,m);
  }
}

function getPartsInZone(date, timezone){
  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone: timezone,
    hour12:false,
    hour:"2-digit",
    minute:"2-digit"
  }).formatToParts(date);

  const out = {};
  parts.forEach(p => out[p.type] = p.value);

  return {
    hour: Number(out.hour) === 24 ? 0 : Number(out.hour),
    minute: Number(out.minute)
  };
}

function to12Hour(hour, minute){
  const h = Number(hour);
  const m = String(minute).padStart(2,"0");
  const ampm = h >= 12 ? "PM" : "AM";
  const display = h % 12 || 12;
  return `${display}:${m} ${ampm}`;
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeUrl(url){
  const value = String(url || "").trim();
  if(value.startsWith("https://") || value.startsWith("http://"))
    return escapeHtml(value);
  return "#";
}

</script>
