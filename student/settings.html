<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | Haroon Ibn Rasheed Online Quran Academy"><link rel="stylesheet" href="../css/portal.css"><link rel="stylesheet" href="../css/student-theme.css"><script src="../js/student-portal-ui.js" defer></script><style>.settings-wrap{max-width:980px;margin:0 auto}.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.settings-card{background:var(--student-surface);border:1px solid var(--student-border);border-radius:16px;padding:22px;box-shadow:0 8px 24px #0928490a}.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.swatch{width:35px;height:35px;border-radius:50%;border:3px solid #fff;outline:1px solid #cbd5e1;cursor:pointer}.settings-card label{display:block;font-weight:700;margin:12px 0 6px}.settings-card select,.settings-card input{width:100%;padding:11px;border:1px solid var(--student-border);border-radius:9px}.settings-note{color:var(--student-muted);font-size:13px;line-height:1.6}.save-btn{background:var(--student-accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}</style></head>
<body class="dashboard" data-page="student-settings"><main class="settings-wrap" style="padding:clamp(14px,3vw,32px)"><section class="settings-card" style="margin-bottom:18px"><h1>Portal Settings</h1><p class="settings-note">Personal appearance preferences for this browser. Your academy logo is managed by the Admin for consistency across all portal pages.</p></section><div class="settings-grid"><section class="settings-card"><h2>Appearance</h2><label for="themeChoice">Theme</label><select id="themeChoice"><option value="light">Light</option><option value="dark">Dark</option></select><label>Accent colour</label><div class="swatches"><button class="swatch" data-color="#1769e0" style="background:#1769e0" aria-label="Blue"></button><button class="swatch" data-color="#087f5b" style="background:#087f5b" aria-label="Green"></button><button class="swatch" data-color="#7048e8" style="background:#7048e8" aria-label="Purple"></button><button class="swatch" data-color="#0f9d9a" style="background:#0f9d9a" aria-label="Teal"></button><button class="swatch" data-color="#d97706" style="background:#d97706" aria-label="Orange"></button><button class="swatch" data-color="#c92a2a" style="background:#c92a2a" aria-label="Red"></button></div><label for="customColor">Custom colour</label><input id="customColor" type="color" value="#1769e0"><p class="settings-note">Changes update buttons, highlights and navigation accents.</p><button class="save-btn" id="saveAppearance">Save preferences</button><p id="saveStatus" role="status" class="settings-note"></p></section><section class="settings-card"><h2>Academy branding</h2><p> <img src="../assets/hr-logo.svg" alt="Haroon Ibn Rasheed Academy logo" style="width:92px;height:92px;object-fit:contain;background:#fff;border-radius:50%;padding:7px;border:1px solid var(--student-border)"></p><p class="settings-note">This is the shared academy SVG logo. To keep branding consistent, only the Admin may replace it; the same asset is used throughout the portal.</p><h3>Helpful preferences</h3><ul><li>Use Dark mode in low light.</li><li>Choose an accent colour that is easy to read.</li><li>On phones, use the Menu button in the top bar.</li></ul></section></div></main><script>
(function(){const theme=document.getElementById('themeChoice'),color=document.getElementById('customColor'),status=document.getElementById('saveStatus');function get(){try{return JSON.parse(localStorage.getItem('hir_student_portal_preferences_v1')||'{}')}catch(e){return {}}}const p=get();theme.value=p.theme||'light';color.value=p.accent||'#1769e0';document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{color.value=b.dataset.color}));document.getElementById('saveAppearance').addEventListener('click',()=>{const next={...get(),theme:theme.value,accent:color.value};try{localStorage.setItem('hir_student_portal_preferences_v1',JSON.stringify(next));if(window.StudentPortalPreferences)window.StudentPortalPreferences.set(next);status.textContent='Preferences saved in this browser.';document.documentElement.dataset.studentTheme=next.theme;document.documentElement.style.setProperty('--student-accent',next.accent)}catch(e){status.textContent='Could not save preferences in this browser.'}});})();
</script></body></html>
