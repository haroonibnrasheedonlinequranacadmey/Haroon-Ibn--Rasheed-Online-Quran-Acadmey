<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal — Haroon Ibn Rasheed Online Quran Academy</title><link rel="stylesheet" href="../css/portal.css"></head><body>
<header class="top"><div class="brand"><div class="logo">HR</div><div>Haroon Ibn Rasheed<br><small>Online Quran Academy</small></div></div><nav class="nav"><a href="index.html#dashboard">Dashboard</a><a href="index.html#profile">Profile</a><a href="index.html#teacher">My Teacher</a><a href="index.html#course">My Course</a><a href="index.html#schedule">Schedule</a><a href="index.html#classes">Classes</a><a href="index.html#attendance">Attendance</a><a href="index.html#fees">Fees</a><a href="index.html#leaves">Leaves</a><button onclick="logout()">Logout</button></nav></header>
<main class="wrap"><div id="msg" class="msg" hidden></div><div id="app"><div class="card">Loading…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/core.js"></script><script>
let S={};
async function boot(){let x=await requireRole('student');if(!x)return;S=x;let q=await db.from('students').select('*,teachers(name,bio,image_url),courses(title,description)').eq('user_id',x.user.id).single();if(q.error||!q.data){document.querySelector('#app').innerHTML='<div class="card notice"><b>Student profile not linked.</b><p>Please ask the admin to ensure your account has the Student role.</p></div>';return}S.student=q.data;route();onhashchange=route}
function nav(t,b){document.querySelector('#app').innerHTML=`<h1>${t}</h1>${b}`}
async function route(){let s=location.hash.slice(1)||'dashboard';if(s==='dashboard')return dash();if(s==='profile')return profile();if(s==='teacher')return teacher();if(s==='course')return course();if(s==='schedule')return schedule();if(s==='classes')return classes();if(s==='attendance')return attendance();if(s==='fees')return fees();if(s==='leaves')return leaves()}
async function dash(){let id=S.student.id;let [a,b,c,d]=await Promise.all([db.from('schedules').select('*',{count:'exact',head:true}).eq('student_id',id),db.from('classes').select('*',{count:'exact',head:true}).eq('student_id',id),db.from('attendance').select('*',{count:'exact',head:true}).eq('student_id',id).eq('status','present'),db.from('student_payments').select('*',{count:'exact',head:true}).eq('student_id',id).eq('status','paid')]);nav('Student Dashboard',`<p>Welcome, <b>${esc(S.profile.full_name||S.user.email)}</b>.</p><div class="grid"><div class="card"><div class="stat">${a.count||0}</div>Schedules</div><div class="card"><div class="stat">${b.count||0}</div>Classes</div><div class="card"><div class="stat">${c.count||0}</div>Present</div><div class="card"><div class="stat">${d.count||0}</div>Payments</div></div>`)}
async function profile(){nav('My Profile',`<div class="card"><form id="pf"><div class="field"><label>Full name</label><input class="input" id="pn" value="${esc(S.profile.full_name)}" required></div><div class="field"><label>Email</label><input class="input" value="${esc(S.user.email)}" disabled></div><button class="btn">Save</button></form></div>`);document.querySelector('#pf').onsubmit=async e=>{e.preventDefault();let q=await db.from('profiles').update({full_name:pn.value,updated_at:new Date().toISOString()}).eq('id',S.user.id);if(q.error)msg(q.error.message,'error');else msg('Profile updated.')}}
function teacher(){let t=S.student.teachers;nav('My Teacher',t?`<div class="card"><h2>${esc(t.name)}</h2><p>${esc(t.bio||'')}</p>${t.image_url?`<img src="${esc(t.image_url)}" style="max-width:250px;border-radius:12px">`:''}</div>`:'<div class="card">Teacher not assigned yet.</div>')}
function course(){let c=S.student.courses;nav('My Course',c?`<div class="card"><h2>${esc(c.title)}</h2><p>${esc(c.description||'')}</p></div>`:'<div class="card">Course not assigned yet.</div>')}
async function schedule(){let q=await db.from('schedules').select('*,teachers(name),courses(title)').eq('student_id',S.student.id).order('class_date',{ascending:false});nav('My Schedule',`<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Time</th><th>Teacher</th><th>Course</th><th>Status</th><th>Meeting</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.class_date}</td><td>${x.start_time}–${x.end_time}</td><td>${esc(x.teachers?.name)}</td><td>${esc(x.courses?.title)}</td><td>${x.status}</td><td>${x.meeting_url?`<a class="btn" target="_blank" href="${esc(x.meeting_url)}">Join</a>`:'—'}</td></tr>`).join('')}</table></div>`)}
async function classes(){let q=await db.from('classes').select('*,teachers(name),courses(title)').eq('student_id',S.student.id).order('class_date',{ascending:false});nav('My Classes',`<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Teacher</th><th>Course</th><th>Status</th><th>Meeting</th><th>Notes</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.class_date}</td><td>${esc(x.teachers?.name)}</td><td>${esc(x.courses?.title)}</td><td>${x.status}</td><td>${x.meeting_url?`<a class="btn" target="_blank" href="${esc(x.meeting_url)}">Join</a>`:'—'}</td><td>${esc(x.lesson_notes)}</td></tr>`).join('')}</table></div>`)}
async function attendance(){let q=await db.from('attendance').select('*,classes(class_date)').eq('student_id',S.student.id).order('attendance_date',{ascending:false});nav('My Attendance',`<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Status</th><th>Notes</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.attendance_date}</td><td>${x.status}</td><td>${esc(x.notes)}</td></tr>`).join('')}</table></div>`)}
async function fees(){let q=await db.from('student_payments').select('*').eq('student_id',S.student.id).order('payment_month',{ascending:false});nav('My Fees / Payments',`<div class="card tablewrap"><table class="table"><tr><th>Month</th><th>Amount</th><th>Currency</th><th>Method</th><th>Status</th><th>Reference</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.payment_month}</td><td>${x.amount}</td><td>${x.currency}</td><td>${esc(x.method)}</td><td>${x.status}</td><td>${esc(x.reference)}</td></tr>`).join('')}</table></div>`)}
async function leaves(){let q=await db.from('leaves').select('*').eq('student_id',S.student.id).order('created_at',{ascending:false});nav('My Leaves',`<div class="card"><form id="leave"><div class="formgrid"><div class="field"><label>Start</label><input class="input" id="ls" type="date" required></div><div class="field"><label>End</label><input class="input" id="le" type="date" required></div><div class="field"><label>Reason</label><textarea class="input" id="lr" required></textarea></div></div><button class="btn">Apply Leave</button></form></div><br><div class="card tablewrap"><table class="table"><tr><th>Start</th><th>End</th><th>Reason</th><th>Status</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.start_date}</td><td>${x.end_date}</td><td>${esc(x.reason)}</td><td>${x.status}</td></tr>`).join('')}</table></div>`);document.querySelector('#leave').onsubmit=async e=>{e.preventDefault();let r=await db.from('leaves').insert({requester_profile_id:S.user.id,student_id:S.student.id,start_date:ls.value,end_date:le.value,reason:lr.value});if(r.error)msg(r.error.message,'error');else route()}}
boot();
</script></body></html>
