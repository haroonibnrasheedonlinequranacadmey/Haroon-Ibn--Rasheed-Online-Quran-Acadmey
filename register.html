<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration | Haroon Ibn Rasheed</title><link rel="stylesheet" href="css/portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script></head><body><main class="auth-page"><section class="auth-card"><img src="assets/hr-logo.svg" class="auth-logo"><h1>Create Student Account</h1><p>Your new account will start with the Student role.</p><div id="msg" class="msg"></div><form id="register"><label>Full Name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button>Create Account</button></form><div class="links"><a href="portal-login.html">Already have an account?</a><a href="index.html">Back to Website</a></div></section></main><script>
const cfg=window.SUPABASE_CONFIG||{};const db=window.supabase.createClient(cfg.url,cfg.anonKey);
register.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Creating account...';const r=await db.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value}}});if(r.error){msg.textContent=r.error.message;return}msg.textContent=r.data.session?'Account created. Opening dashboard...':'Account created. Check your email if email confirmation is enabled.';if(r.data.session)setTimeout(()=>location.href='student/dashboard.html',700);});
</script></body></html>
