<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | Teacher</title><link rel="stylesheet" href="../css/portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/portal.js"></script><style>
body{background:#f5fafb}.messages-wrap{max-width:1100px;margin:30px auto;padding:0 18px}.hero{background:linear-gradient(135deg,#087f9a,#0b9fbb);color:#fff;border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(8,127,154,.18)}.hero h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid #e4eef1;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(20,55,70,.06)}.list{max-height:620px;overflow:auto}.thread{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf2f4;background:#fff;padding:15px;cursor:pointer}.thread.active,.thread:hover{background:#eef9fb}.thread b{display:block;color:#183842}.thread small{display:block;color:#7b929a;margin-top:5px}.chat{min-height:620px;display:flex;flex-direction:column}.chat-head{padding:18px;border-bottom:1px solid #edf2f4}.body{padding:18px;flex:1;overflow:auto;background:#f8fbfc}.bubble{max-width:78%;padding:11px 14px;border-radius:14px;margin-bottom:12px;line-height:1.5}.bubble.in{background:#fff;border:1px solid #e4edf0}.bubble.out{background:#0b9fbb;color:#fff;margin-left:auto}.bubble small{display:block;margin-top:6px;opacity:.7;font-size:10px}.composer{padding:15px;border-top:1px solid #edf2f4}.input{width:100%;box-sizing:border-box;border:1px solid #d7e4e9;border-radius:10px;padding:11px;font:inherit;resize:vertical}.btn{border:0;border-radius:10px;background:#0b9fbb;color:#fff;padding:11px 17px;font-weight:800;cursor:pointer;margin-top:8px}.empty{padding:45px 18px;text-align:center;color:#789099}.back{display:inline-block;margin-top:12px;color:#fff;text-decoration:none;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr}.list{max-height:330px}.chat{min-height:520px}.bubble{max-width:90%}}
</style></head><body><div class="messages-wrap"><div class="hero"><h1>💬 Admin Messages</h1><div>Private messages from Academy Admin are shown here. Your replies go only to Admin.</div><a class="back" href="dashboard.html">← Back to Teacher Dashboard</a></div><div id="msgNotice"></div><div class="grid"><section class="panel"><div style="padding:16px 18px;border-bottom:1px solid #edf2f4"><b>My Conversations</b></div><div id="threads" class="list"><div class="empty">Loading...</div></div></section><section class="panel chat"><div class="chat-head" id="head"><b>Select a message</b><div style="color:#7b929a">When Admin sends a new message, you will receive a notification sound.</div></div><div id="body" class="body"><div class="empty">No conversation selected.</div></div><form id="reply" class="composer" style="display:none"><textarea id="replyText" class="input" rows="3" placeholder="Write your reply to Admin..." required></textarea><button class="btn">Send Reply</button></form></section></div></div><script>
let me=null,threads=[],current=null,lastSeen=localStorage.getItem('teacherMsgLastSeen')||'';function e(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function notice(t){const n=document.getElementById('msgNotice');n.innerHTML=`<div style="margin-top:14px;padding:10px 14px;border-radius:10px;background:#eef9ed;color:#2f7d32">${e(t)}</div>`;setTimeout(()=>n.innerHTML='',3000)}
async function init(){const g=await guard('teacher');if(!g)return;me=g;await load();setInterval(load,5000)}
async function load(){if(!me)return;const r=await academyDB.from('conversations').select('*').eq('conversation_type','teacher').eq('teacher_id',me.s.user.id).order('updated_at',{ascending:false});if(r.error){document.getElementById('threads').innerHTML=`<div class="empty">${e(r.error.message)}</div>`;return}threads=r.data||[];render();let latest='';for(const t of threads){const x=await academyDB.from('messages').select('id,created_at,sender_type').eq('conversation_id',t.id).order('created_at',{ascending:false}).limit(1);if(x.data?.[0]&&x.data[0].sender_type==='admin'&&(!latest||x.data[0].created_at>latest))latest=x.data[0].created_at}if(latest&&latest!==lastSeen){if(lastSeen)window.teacherMessageBeep?.();lastSeen=latest;localStorage.setItem('teacherMsgLastSeen',lastSeen);notice('New message from Admin.');}if(current)open(current.id,true)}
function render(){document.getElementById('threads').innerHTML=threads.length?threads.map(t=>`<button class="thread ${current?.id===t.id?'active':''}" onclick="open('${t.id}')"><b>${e(t.subject||'Admin Message')}</b><small>${e(t.status)} · ${new Date(t.updated_at).toLocaleString()}</small></button>`).join(''):'<div class="empty">No Admin messages yet.</div>'}
async function open(id,silent=false){current=threads.find(t=>t.id===id);if(!current)return;render();document.getElementById('head').innerHTML=`<b>${e(current.subject||'Admin Message')}</b><div style="color:#7b929a">Private conversation with Academy Admin</div>`;document.getElementById('reply').style.display='block';const r=await academyDB.from('messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true});if(r.error){notice(r.error.message);return}document.getElementById('body').innerHTML=(r.data||[]).map(m=>`<div class="bubble ${m.sender_type==='teacher'?'out':'in'}"><div>${e(m.body)}</div><small>${e(m.sender_type==='admin'?'Admin':'You')} · ${new Date(m.created_at).toLocaleString()}</small></div>`).join('')||'<div class="empty">No messages yet.</div>';document.getElementById('body').scrollTop=document.getElementById('body').scrollHeight;await academyDB.from('conversations').update({teacher_read_at:new Date().toISOString()}).eq('id',id).eq('teacher_id',me.s.user.id)}
document.getElementById('reply').addEventListener('submit',async ev=>{ev.preventDefault();if(!current)return;const body=document.getElementById('replyText').value.trim();if(!body)return;const r=await academyDB.from('messages').insert({conversation_id:current.id,sender_type:'teacher',sender_id:me.s.user.id,body});if(r.error){notice(r.error.message);return}await academyDB.from('conversations').update({status:'replied',updated_at:new Date().toISOString()}).eq('id',current.id).eq('teacher_id',me.s.user.id);document.getElementById('replyText').value='';await open(current.id,true);notice('Reply sent to Admin.')});init();
</script></body></html>
