<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages | Teacher</title>
<link rel="stylesheet" href="../css/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script><script src="../js/portal.js"></script>
<style>
/* Existing academy turquoise palette and page styling are intentionally preserved. */
body{background:#f5fafb}.messages-wrap{max-width:1100px;margin:30px auto;padding:0 18px}
.hero{background:linear-gradient(135deg,#087f9a,#0b9fbb);color:#fff;border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(8,127,154,.18)}
.hero h1{margin:0 0 6px}.back{display:inline-block;margin-top:12px;color:#fff;text-decoration:none;font-weight:700}
.grid{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:18px}
.panel{background:#fff;border:1px solid #e4eef1;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(20,55,70,.06)}
.list{max-height:620px;overflow:auto}.thread{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf2f4;background:#fff;padding:15px;cursor:pointer}
.thread.active,.thread:hover{background:#eef9fb}.thread b{display:block;color:#183842}.thread small{display:block;color:#7b929a;margin-top:5px}
.chat{min-height:620px;display:flex;flex-direction:column}.chat-head{padding:15px 18px;border-bottom:1px solid #edf2f4;display:flex;align-items:center;justify-content:space-between;gap:10px}
.chat-title{color:#183842}.chat-sub{color:#7b929a;font-size:12px;margin-top:4px}
.body{padding:18px;flex:1;overflow:auto;background:#f8fbfc;min-height:350px}
.bubble{position:relative;max-width:78%;padding:11px 14px;border-radius:14px;margin-bottom:12px;line-height:1.5;cursor:pointer;overflow-wrap:anywhere}
.bubble.in{background:#fff;border:1px solid #e4edf0}.bubble.out{background:#0b9fbb;color:#fff;margin-left:auto}
.bubble.selected{outline:3px solid #087f9a;outline-offset:1px}
.bubble small{display:block;margin-top:6px;opacity:.7;font-size:10px}.deleted{font-style:italic;opacity:.75}
.selectbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#eef9fb;border-bottom:1px solid #dcebef}
.selectbar.show{display:flex}.selectbar button{border:0;border-radius:8px;padding:8px 11px;font-weight:700;cursor:pointer}
.delete-me{background:#dceef2;color:#174b59}.delete-everyone{background:#0b9fbb;color:white}.cancel-select{background:#e9eef0;color:#42565d}
.composer{padding:12px 15px;border-top:1px solid #edf2f4;display:flex;gap:9px;align-items:flex-end;background:#fff}
.input{width:100%;box-sizing:border-box;border:1px solid #d7e4e9;border-radius:18px;padding:12px 14px;font:inherit;resize:none;max-height:130px;outline-color:#0b9fbb}
.btn{flex:0 0 auto;border:0;border-radius:18px;background:#0b9fbb;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{padding:45px 18px;text-align:center;color:#789099}.notice{margin-top:12px;padding:10px 14px;border-radius:10px;background:#eef9ed;color:#2f7d32;display:none}.notice.show{display:block}.notice.error{background:#fff0f0;color:#a12626}
@media(max-width:850px){.messages-wrap{margin:14px auto;padding:0 10px}.grid{grid-template-columns:1fr;gap:12px}.list{max-height:220px}.chat{min-height:520px}.bubble{max-width:90%}.hero{padding:18px}.composer{padding:10px}.btn{padding:11px 14px}}
</style></head>
<body>
<div class="messages-wrap">
 <div class="hero"><h1>💬 Admin Messages</h1><div>Private messages from Academy Admin are shown here. Your replies go only to Admin.</div><a class="back" href="dashboard.html">← Back to Teacher Dashboard</a></div>
 <div id="msgNotice" class="notice" role="status"></div>
 <div class="grid">
  <section class="panel"><div style="padding:16px 18px;border-bottom:1px solid #edf2f4"><b>My Conversations</b></div><div id="threads" class="list"><div class="empty">Loading...</div></div></section>
  <section class="panel chat">
   <div class="chat-head" id="head"><div><b class="chat-title">Select a conversation</b><div class="chat-sub">New messages from Admin will appear here.</div></div></div>
   <div id="selectBar" class="selectbar"><strong id="selectedCount">1 selected</strong><button type="button" class="delete-me" id="deleteMe">Delete for me</button><button type="button" class="delete-everyone" id="deleteEveryone">Delete for everyone</button><button type="button" class="cancel-select" id="cancelSelect">Cancel</button></div>
   <div id="body" class="body"><div class="empty">No conversation selected.</div></div>
   <form id="reply" class="composer" style="display:none"><textarea id="replyText" class="input" rows="1" placeholder="Message Admin..." required></textarea><button class="btn" id="sendBtn">Send</button></form>
  </section>
 </div>
</div>
<script>
let me=null,threads=[],current=null,lastSeen=localStorage.getItem('teacherMsgLastSeen')||'',selected=new Set(),loading=false;
const $=id=>document.getElementById(id);
function e(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function notice(t,isError=false){const n=$('msgNotice');n.textContent=t;n.className='notice show'+(isError?' error':'');setTimeout(()=>n.className='notice',3500)}
async function init(){const g=await guard('teacher');if(!g)return;me=g;await load();setInterval(load,5000)}
async function load(){
 if(!me||loading)return;loading=true;
 const r=await academyDB.from('conversations').select('*').eq('conversation_type','teacher').eq('teacher_id',me.s.user.id).order('updated_at',{ascending:false});
 if(r.error){$('threads').innerHTML=`<div class="empty">${e(r.error.message)}</div>`;loading=false;return}
 threads=r.data||[];renderThreads();
 let latest='';
 for(const t of threads){const x=await academyDB.from('messages').select('id,created_at,sender_type').eq('conversation_id',t.id).eq('deleted_for_everyone',false).order('created_at',{ascending:false}).limit(1);
  if(x.data?.[0]&&x.data[0].sender_type==='admin'&&(!latest||x.data[0].created_at>latest))latest=x.data[0].created_at;
 }
 if(latest&&latest!==lastSeen){if(lastSeen)beep();lastSeen=latest;localStorage.setItem('teacherMsgLastSeen',lastSeen);notice('New message from Admin.');}
 if(current)await open(current.id,true);loading=false;
}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();[880,660].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime+i*.22);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+i*.22+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.22+.24);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.22);o.stop(c.currentTime+i*.22+.25)});}catch(_){}}
function renderThreads(){$('threads').innerHTML=threads.length?threads.map(t=>`<button class="thread ${current?.id===t.id?'active':''}" onclick="open('${e(t.id)}')"><b>${e(t.subject||'Admin Message')}</b><small>${e(t.status||'open')} · ${new Date(t.updated_at).toLocaleString()}</small></button>`).join(''):'<div class="empty">No Admin messages yet.</div>'}
async function open(id,silent=false){
 current=threads.find(t=>t.id===id);if(!current)return;selected.clear();selectionBar();renderThreads();
 $('head').innerHTML=`<div><b class="chat-title">${e(current.subject||'Admin Message')}</b><div class="chat-sub">Private conversation with Academy Admin</div></div>`;
 $('reply').style.display='flex';
 const r=await academyDB.from('messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true});
 if(r.error){notice(r.error.message,true);return}
 const visible=(r.data||[]).filter(m=>!m.deleted_for_teacher);
 $('body').innerHTML=visible.map(m=>{const gone=!!m.deleted_for_everyone;return `<div class="bubble ${m.sender_type==='teacher'?'out':'in'} ${gone?'deleted':''}" data-id="${e(m.id)}" onclick="toggleMessage('${e(m.id)}')"><div>${gone?'This message was deleted':e(m.body)}</div><small>${e(m.sender_type==='admin'?'Admin':'You')} · ${new Date(m.created_at).toLocaleString()}</small></div>`}).join('')||'<div class="empty">No messages yet.</div>';
 $('body').scrollTop=$('body').scrollHeight;
 await academyDB.from('conversations').update({teacher_read_at:new Date().toISOString()}).eq('id',id).eq('teacher_id',me.s.user.id);
}
function toggleMessage(id){if(selected.has(id))selected.delete(id);else selected.add(id);document.querySelectorAll('.bubble[data-id]').forEach(b=>b.classList.toggle('selected',selected.has(b.dataset.id)));selectionBar()}
function selectionBar(){$('selectBar').classList.toggle('show',selected.size>0);$('selectedCount').textContent=selected.size+' selected'}
$('cancelSelect').onclick=()=>{selected.clear();document.querySelectorAll('.bubble.selected').forEach(b=>b.classList.remove('selected'));selectionBar()};
async function deleteSelected(mode){
 if(!selected.size||!current)return;
 const ids=[...selected];const label=mode==='everyone'?'Delete selected message(s) for everyone?':'Delete selected message(s) only for you?';
 if(!confirm(label))return;
 $('deleteMe').disabled=$('deleteEveryone').disabled=true;
 for(const id of ids){const r=await academyDB.rpc('delete_teacher_message',{p_message_id:id,p_mode:mode});if(r.error||r.data!==true){notice(r.error?.message||'Could not delete message. Run the updated SQL file first.',true);$('deleteMe').disabled=$('deleteEveryone').disabled=false;return}}
 selected.clear();$('deleteMe').disabled=$('deleteEveryone').disabled=false;selectionBar();await open(current.id,true);notice(mode==='everyone'?'Message deleted for everyone.':'Message deleted for you.');
}
$('deleteMe').onclick=()=>deleteSelected('me');$('deleteEveryone').onclick=()=>deleteSelected('everyone');
$('reply').addEventListener('submit',async ev=>{ev.preventDefault();if(!current)return;const body=$('replyText').value.trim();if(!body)return;$('sendBtn').disabled=true;const r=await academyDB.from('messages').insert({conversation_id:current.id,sender_type:'teacher',sender_id:me.s.user.id,body});if(r.error){notice(r.error.message,true);$('sendBtn').disabled=false;return}await academyDB.from('conversations').update({status:'replied',updated_at:new Date().toISOString()}).eq('id',current.id).eq('teacher_id',me.s.user.id);$('replyText').value='';$('sendBtn').disabled=false;await open(current.id,true);notice('Message sent to Admin.')});
init();
</script></body></html>
