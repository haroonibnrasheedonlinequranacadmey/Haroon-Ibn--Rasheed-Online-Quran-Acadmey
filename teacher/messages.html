<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | Teacher</title><link rel="stylesheet" href="../css/portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><style>
body{background:#f5fafb}.messages-wrap{max-width:1100px;margin:30px auto;padding:0 18px}.hero{background:linear-gradient(135deg,#087f9a,#0b9fbb);color:#fff;border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(8,127,154,.18)}.hero h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid #e4eef1;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(20,55,70,.06)}.list{max-height:620px;overflow:auto}.thread{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf2f4;background:#fff;padding:15px;cursor:pointer}.thread.active,.thread:hover{background:#eef9fb}.thread b{display:block;color:#183842}.thread small{display:block;color:#7b929a;margin-top:5px}.chat{min-height:620px;display:flex;flex-direction:column}.chat-head{padding:18px;border-bottom:1px solid #edf2f4}.body{padding:18px;flex:1;overflow:auto;background:#f8fbfc}.bubble{max-width:78%;padding:11px 14px;border-radius:14px;margin-bottom:12px;line-height:1.5}.bubble.in{background:#fff;border:1px solid #e4edf0}.bubble.out{background:#0b9fbb;color:#fff;margin-left:auto}.bubble small{display:block;margin-top:6px;opacity:.7;font-size:10px}.composer{padding:15px;border-top:1px solid #edf2f4}.input{width:100%;box-sizing:border-box;border:1px solid #d7e4e9;border-radius:10px;padding:11px;font:inherit;resize:vertical}.btn{border:0;border-radius:10px;background:#0b9fbb;color:#fff;padding:11px 17px;font-weight:800;cursor:pointer;margin-top:8px}.empty{padding:45px 18px;text-align:center;color:#789099}.back{display:inline-block;margin-top:12px;color:#fff;text-decoration:none;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr}.list{max-height:330px}.chat{min-height:520px}.bubble{max-width:90%}}

.selectbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#eef9fb;border-bottom:1px solid #dcebef}
.selectbar.show{display:flex}.selectbar button{border:0;border-radius:8px;padding:8px 11px;font-weight:700;cursor:pointer}
.delete-me{background:#eef4f6;color:#31515c}.delete-everyone{background:#0b9fbb;color:#fff}.cancel-select{background:#e9eef0;color:#42565d}
.bubble{cursor:pointer;overflow-wrap:anywhere}.bubble.selected{outline:3px solid #087f9a;outline-offset:1px}.bubble.deleted{font-style:italic;opacity:.75}
</style><script src="../js/academy-settings.js"></script></head><body><div class="messages-wrap"><div class="hero"><h1>💬 Admin Messages</h1><div>Private messages from Academy Admin are shown here. Your replies go only to Admin.</div><a class="back" href="dashboard.html">← Back to Teacher Dashboard</a></div><div id="msgNotice"></div><div class="grid"><section class="panel"><div style="padding:16px 18px;border-bottom:1px solid #edf2f4"><b>My Conversations</b></div><div id="threads" class="list"><div class="empty">Loading...</div></div></section><section class="panel chat"><div class="chat-head" id="head"><b>Select a message</b><div style="color:#7b929a">When Admin sends a new message, you will receive a notification sound.</div></div><div id="selectBar" class="selectbar"><strong id="selectedCount">1 selected</strong><button type="button" class="delete-me" id="deleteMe">Delete for me</button><button type="button" class="delete-everyone" id="deleteEveryone">Delete for everyone</button><button type="button" class="cancel-select" id="cancelSelect">Cancel</button></div><div id="body" class="body"><div class="empty">No conversation selected.</div></div><form id="reply" class="composer" style="display:none"><textarea id="replyText" class="input" rows="3" placeholder="Write your reply to Admin..." required></textarea><button class="btn">Send Reply</button></form></section></div></div><script>
let me=null,threads=[],current=null,lastSeen=localStorage.getItem('teacherMsgLastSeen')||'',selected=new Set();
const chatDB=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.anonKey);
function e(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function notice(t,isError=false){const n=document.getElementById('msgNotice');n.innerHTML=`<div style="margin-top:14px;padding:10px 14px;border-radius:10px;background:${isError?'#fff0f0':'#eef9ed'};color:${isError?'#a12626':'#2f7d32'}">${e(t)}</div>`;setTimeout(()=>n.innerHTML='',3500)}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();[880,660].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime+i*.22);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+i*.22+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.22+.24);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.22);o.stop(c.currentTime+i*.22+.25)});}catch(_){}}
function selectionBar(){document.getElementById('selectBar').classList.toggle('show',selected.size>0);document.getElementById('selectedCount').textContent=selected.size+' selected'}
function toggleMessage(id){if(selected.has(id))selected.delete(id);else selected.add(id);document.querySelectorAll('.bubble[data-id]').forEach(b=>b.classList.toggle('selected',selected.has(b.dataset.id)));selectionBar()}
async function init(){
 try{
  const sessionResult=await chatDB.auth.getSession();
  const user=sessionResult.data?.session?.user;
  if(!user){location.href='../portal-login.html';return;}
  const profileResult=await chatDB.from('profiles').select('id,role,full_name').eq('id',user.id).maybeSingle();
  if(profileResult.error){document.getElementById('threads').innerHTML=`<div class="empty">Could not verify teacher account: ${e(profileResult.error.message)}</div>`;return;}
  if(String(profileResult.data?.role||'').toLowerCase()!=='teacher'){location.href='../portal-login.html';return;}
  me={user,profile:profileResult.data};
  await load();
  setInterval(load,5000);
 }catch(err){document.getElementById('threads').innerHTML=`<div class="empty">Unable to start chat: ${e(err.message||err)}</div>`;}
}
async function load(){if(!me)return;const r=await chatDB.from('conversations').select('*').eq('conversation_type','teacher').eq('teacher_id',me.user.id).order('updated_at',{ascending:false});if(r.error){document.getElementById('threads').innerHTML=`<div class="empty">${e(r.error.message)}</div>`;return}threads=r.data||[];render();let latest='';for(const t of threads){const x=await chatDB.from('messages').select('id,created_at,sender_type').eq('conversation_id',t.id).order('created_at',{ascending:false}).limit(1);if(x.data?.[0]&&!x.data[0].deleted_for_everyone&&x.data[0].sender_type==='admin'&&(!latest||x.data[0].created_at>latest))latest=x.data[0].created_at}if(latest&&latest!==lastSeen){if(lastSeen)beep();lastSeen=latest;localStorage.setItem('teacherMsgLastSeen',lastSeen);notice('New message from Admin.')}if(current)await open(current.id,true)}
function render(){document.getElementById('threads').innerHTML=threads.length?threads.map(t=>`<button class="thread ${current?.id===t.id?'active':''}" onclick="open('${e(t.id)}')"><b>${e(t.subject||'Admin Message')}</b><small>${e(t.status)} · ${new Date(t.updated_at).toLocaleString()}</small></button>`).join(''):'<div class="empty">No Admin messages yet.</div>'}
async function open(id,silent=false){current=threads.find(t=>t.id===id);if(!current)return;selected.clear();selectionBar();render();document.getElementById('head').innerHTML=`<b>${e(current.subject||'Admin Message')}</b><div style="color:#7b929a">Private conversation with Academy Admin</div>`;document.getElementById('reply').style.display='block';const r=await chatDB.from('messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true});if(r.error){notice(r.error.message,true);return}const visible=(r.data||[]).filter(m=>!m.deleted_for_teacher);document.getElementById('body').innerHTML=visible.map(m=>{const gone=!!m.deleted_for_everyone;return `<div class="bubble ${m.sender_type==='teacher'?'out':'in'} ${gone?'deleted':''}" data-id="${e(m.id)}" onclick="toggleMessage('${e(m.id)}')"><div>${gone?'This message was deleted':e(m.body)}</div><small>${e(m.sender_type==='admin'?'Admin':'You')} · ${new Date(m.created_at).toLocaleString()}</small></div>`}).join('')||'<div class="empty">No messages yet.</div>';document.getElementById('body').scrollTop=document.getElementById('body').scrollHeight;await chatDB.from('conversations').update({teacher_read_at:new Date().toISOString()}).eq('id',id).eq('teacher_id',me.user.id)}
document.getElementById('cancelSelect').onclick=()=>{selected.clear();document.querySelectorAll('.bubble.selected').forEach(b=>b.classList.remove('selected'));selectionBar()};
async function deleteSelected(mode){if(!selected.size||!current)return;if(!confirm(mode==='everyone'?'Delete selected message(s) for everyone?':'Delete selected message(s) only for you?'))return;const ids=[...selected];document.getElementById('deleteMe').disabled=document.getElementById('deleteEveryone').disabled=true;for(const id of ids){const r=await chatDB.rpc('delete_teacher_message',{p_message_id:id,p_mode:mode});if(r.error||r.data!==true){notice(r.error?.message||'Delete failed. Check that the SQL update was run.',true);document.getElementById('deleteMe').disabled=document.getElementById('deleteEveryone').disabled=false;return}}selected.clear();document.getElementById('deleteMe').disabled=document.getElementById('deleteEveryone').disabled=false;selectionBar();await open(current.id,true);notice(mode==='everyone'?'Message deleted for everyone.':'Message deleted for you.')}
document.getElementById('deleteMe').onclick=()=>deleteSelected('me');document.getElementById('deleteEveryone').onclick=()=>deleteSelected('everyone');
document.getElementById('reply').addEventListener('submit',async ev=>{ev.preventDefault();if(!current)return;const body=document.getElementById('replyText').value.trim();if(!body)return;const r=await chatDB.from('messages').insert({conversation_id:current.id,sender_type:'teacher',sender_id:me.user.id,body});if(r.error){notice(r.error.message,true);return}await chatDB.from('conversations').update({status:'replied',updated_at:new Date().toISOString()}).eq('id',current.id).eq('teacher_id',me.user.id);document.getElementById('replyText').value='';await open(current.id,true);notice('Reply sent to Admin.')});init();
</script></body></html>
