<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Portal — Haroon Ibn Rasheed Online Quran Academy</title><link rel="stylesheet" href="../css/portal.css"></head><body>
<header class="top"><div class="brand"><div class="logo">HR</div><div>Haroon Ibn Rasheed<br><small>Online Quran Academy</small></div></div><nav class="nav"><a href="index.html#dashboard">Dashboard</a><a href="index.html#students">My Students</a><a href="index.html#classes">My Classes</a><a href="index.html#schedule">Schedule</a><a href="index.html#attendance">Attendance</a><a href="index.html#courses">Courses</a><a href="index.html#leaves">Leaves</a><a href="index.html#salary">Salary</a><a href="index.html#profile">Profile</a><button onclick="logout()">Logout</button></nav></header>
<main class="wrap"><div id="msg" class="msg" hidden></div><div id="app"><div class="card">Loading…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/core.js"></script><script>
let T={};
async function boot(){let x=await requireRole('teacher');if(!x)return;T=x;let q=await db.from('teachers').select('*').eq('user_id',x.user.id).single();if(q.error||!q.data){document.querySelector('#app').innerHTML='<div class="card notice"><b>Teacher profile not linked.</b><p>Ask the admin to set this account as Teacher in User Roles. The database will create/link the teacher record.</p></div>';return}T.teacher=q.data;route();onhashchange=route}
function nav(t,b){document.querySelector('#app').innerHTML=`<h1>${t}</h1>${b}`}
async function route(){let s=location.hash.slice(1)||'dashboard';if(s==='dashboard')return dash();if(s==='students')return students();if(s==='classes')return classes();if(s==='schedule')return schedule();if(s==='attendance')return attendance();if(s==='courses')return courses();if(s==='leaves')return leaves();if(s==='salary')return salary();if(s==='profile')return profile()}
async function dash(){let id=T.teacher.id,date=new Date().toISOString().slice(0,10);let [a,b,c,d]=await Promise.all([db.from('students').select('*',{count:'exact',head:true}).eq('teacher_id',id),db.from('schedules').select('*',{count:'exact',head:true}).eq('teacher_id',id).eq('class_date',date),db.from('attendance').select('*',{count:'exact',head:true}).eq('teacher_id',id).eq('status','present'),db.from('leaves').select('*',{count:'exact',head:true}).eq('teacher_id',id).eq('status','pending')]);nav('Teacher Dashboard',`<p>Welcome, <b>${esc(T.profile.full_name||T.user.email)}</b>.</p><div class="grid"><div class="card"><div class="stat">${a.count||0}</div>My Students</div><div class="card"><div class="stat">${b.count||0}</div>Today's Classes</div><div class="card"><div class="stat">${c.count||0}</div>Present Records</div><div class="card"><div class="stat">${d.count||0}</div>Pending Leaves</div></div>`)}
async function students(){let q=await db.from('students').select('*,courses(title)').eq('teacher_id',T.teacher.id).order('full_name');nav('My Students',`<div class="card tablewrap"><table class="table"><tr><th>Name</th><th>Phone</th><th>Email</th><th>Course</th><th>Status</th></tr>${(q.data||[]).map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(x.courses?.title||x.course)}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No assigned students.</td></tr>'}</table></div>`)}
async function schedule(){let q=await db.from('schedules').select('*,students(full_name),courses(title)').eq('teacher_id',T.teacher.id).order('class_date',{ascending:false});nav('My Schedule',`<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Time</th><th>Student</th><th>Course</th><th>Status</th><th>Meeting</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.class_date}</td><td>${x.start_time}–${x.end_time}</td><td>${esc(x.students?.full_name)}</td><td>${esc(x.courses?.title)}</td><td>${esc(x.status)}</td><td>${x.meeting_url?`<a class="btn" target="_blank" href="${esc(x.meeting_url)}">Join</a>`:'—'}</td></tr>`).join('')}</table></div>`)}
async function classes(){let q=await db.from('classes').select('*,students(full_name),courses(title)').eq('teacher_id',T.teacher.id).order('class_date',{ascending:false});nav('My Classes',`<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Student</th><th>Course</th><th>Status</th><th>Action</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.class_date}</td><td>${esc(x.students?.full_name)}</td><td>${esc(x.courses?.title)}</td><td>${esc(x.status)}</td><td>${x.status!=='completed'&&x.status!=='cancelled'?`<button class="btn" onclick="setClass('${x.id}','${x.status==='scheduled'?'active':'completed'}')">${x.status==='scheduled'?'Start':'Complete'}</button>`:''}</td></tr>`).join('')}</table></div>`)}
async function setClass(id,status){let q=await db.from('classes').update({status,started_at:status==='active'?new Date().toISOString():undefined,ended_at:status==='completed'?new Date().toISOString():undefined}).eq('id',id);if(q.error)msg(q.error.message,'error');else route()}
async function attendance(){let q=await db.from('classes').select('id,class_date,student_id,students(full_name)').eq('teacher_id',T.teacher.id).order('class_date',{ascending:false});nav('Attendance',`<div class="card tablewrap"><table class="table"><tr><th>Date</th><th>Student</th><th>Status</th><th>Save</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.class_date}</td><td>${esc(x.students?.full_name)}</td><td><select class="input" id="a_${x.id}"><option>present</option><option>absent</option><option>late</option></select></td><td><button class="btn" onclick="saveAtt('${x.id}','${x.student_id}')">Save</button></td></tr>`).join('')}</table></div>`)}
async function saveAtt(cid,sid){let status=document.querySelector('#a_'+cid).value;let q=await db.from('attendance').upsert({class_id:cid,student_id:sid,teacher_id:T.teacher.id,attendance_date:new Date().toISOString().slice(0,10),status},{onConflict:'class_id,student_id'});if(q.error)msg(q.error.message,'error');else msg('Attendance saved.')}
async function courses(){let q=await db.from('courses').select('*').eq('active',true).order('title');nav('Courses',`<div class="grid">${(q.data||[]).map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div>`).join('')}</div>`)}
async function leaves(){let q=await db.from('leaves').select('*').eq('teacher_id',T.teacher.id).order('created_at',{ascending:false});nav('My Leaves',`<div class="card"><form id="leave"><div class="formgrid"><div class="field"><label>Start</label><input class="input" id="ls" type="date" required></div><div class="field"><label>End</label><input class="input" id="le" type="date" required></div><div class="field"><label>Reason</label><textarea class="input" id="lr" required></textarea></div></div><button class="btn">Apply Leave</button></form></div><br><div class="card tablewrap"><table class="table"><tr><th>Start</th><th>End</th><th>Reason</th><th>Status</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.start_date}</td><td>${x.end_date}</td><td>${esc(x.reason)}</td><td>${x.status}</td></tr>`).join('')}</table></div>`);document.querySelector('#leave').onsubmit=async e=>{e.preventDefault();let r=await db.from('leaves').insert({requester_profile_id:T.user.id,teacher_id:T.teacher.id,start_date:ls.value,end_date:le.value,reason:lr.value});if(r.error)msg(r.error.message,'error');else route()}}
async function salary(){let q=await db.from('teacher_salaries').select('*').eq('teacher_id',T.teacher.id).order('salary_month',{ascending:false});nav('My Salary',`<div class="card tablewrap"><table class="table"><tr><th>Month</th><th>Amount</th><th>Currency</th><th>Status</th><th>Paid</th></tr>${(q.data||[]).map(x=>`<tr><td>${x.salary_month}</td><td>${x.amount}</td><td>${x.currency}</td><td>${x.status}</td><td>${x.paid_at||'—'}</td></tr>`).join('')}</table></div>`)}
async function profile(){nav('My Profile',`<div class="card"><form id="pf"><div class="field"><label>Full name</label><input class="input" id="pn" value="${esc(T.profile.full_name)}" required></div><div class="field"><label>Email</label><input class="input" value="${esc(T.user.email)}" disabled></div><button class="btn">Save</button></form></div>`);document.querySelector('#pf').onsubmit=async e=>{e.preventDefault();let q=await db.from('profiles').update({full_name:pn.value,updated_at:new Date().toISOString()}).eq('id',T.user.id);if(q.error)msg(q.error.message,'error');else msg('Profile updated.')}
}
boot();
</script></body></html>
