<style id="teacher-top-header-style">
/* PROFESSIONAL TEACHER HEADER ONLY — page content and existing functionality remain unchanged */
.teacher-top-header{width:100%;background:#fff;border-bottom:1px solid #d8e4eb;box-shadow:0 3px 14px rgba(8,43,66,.10);position:relative;z-index:50;font-family:inherit;}
.teacher-brand-row{min-height:82px;display:flex;align-items:center;justify-content:space-between;padding:10px 28px;box-sizing:border-box;gap:24px;background:linear-gradient(90deg,#082f4b 0%,#0a4666 52%,#0b5b73 100%);}
.teacher-brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none!important;}
.teacher-brand img{width:58px;height:58px;object-fit:contain;display:block;flex:0 0 58px;}
.teacher-brand-text{display:flex;flex-direction:column;line-height:1.08;}
.teacher-brand-name{font-size:20px;font-weight:850;color:#fff;letter-spacing:.1px;white-space:nowrap;}
.teacher-brand-sub{font-size:11px;font-weight:800;color:#9fe8f2;margin-top:5px;letter-spacing:.35px;white-space:nowrap;text-transform:uppercase;}
.teacher-header-actions{display:flex;align-items:center;gap:9px;}
.teacher-header-icon{width:38px;height:38px;border:1px solid #d7e5ec;background:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#075d7d;font-size:17px;box-sizing:border-box;transition:.18s ease;}
.teacher-header-icon:hover{background:#eef8fb;transform:translateY(-1px);}
.teacher-profile-btn{height:40px;padding:0 13px;border:1px solid #d7e5ec;background:#fff;border-radius:22px;display:inline-flex;align-items:center;gap:8px;text-decoration:none!important;color:#173f56!important;font-size:13px;font-weight:750;box-sizing:border-box;transition:.18s ease;}
.teacher-profile-btn:hover{background:#eef8fb;transform:translateY(-1px);}
.teacher-nav-row{background:linear-gradient(90deg,#063f5c 0%,#075d7c 55%,#087e9b 100%);display:flex;align-items:stretch;gap:2px;overflow-x:auto;padding:0 20px;scrollbar-width:thin;}
.teacher-nav-row a{color:#fff!important;text-decoration:none!important;font-size:11.5px;font-weight:750;letter-spacing:.15px;white-space:nowrap;padding:13px 14px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid transparent;opacity:.92;transition:.18s ease;}
.teacher-nav-row a:hover{background:rgba(255,255,255,.09);opacity:1;}
.teacher-nav-row a.active{background:rgba(255,255,255,.13);border-bottom-color:#66d5e8;opacity:1;}
@media(max-width:850px){
 .teacher-brand-row{padding:9px 14px;min-height:70px;gap:10px;}
 .teacher-brand img{width:48px;height:48px;flex-basis:48px;}
 .teacher-brand-name{font-size:16px;}
 .teacher-brand-sub{font-size:9px;}
 .teacher-header-icon{width:33px;height:33px;font-size:15px;}
 .teacher-profile-btn{height:34px;padding:0 9px;font-size:11px;}
 .teacher-nav-row{padding:0 7px;}
 .teacher-nav-row a{font-size:10px;padding:11px 9px;}
}
</style>
