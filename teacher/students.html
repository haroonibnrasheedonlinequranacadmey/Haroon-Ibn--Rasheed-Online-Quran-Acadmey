<script>

/* =====================================================
   SAFE HTML FUNCTION
===================================================== */

function safeStudentHtml(value){

if(
value === null ||
value === undefined
){

return "";

}

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   TEACHER STUDENTS
===================================================== */

async function loadMyStudents(){


const rows =
document.getElementById(
"studentRows"
);


const message =
document.getElementById(
"studentMessage"
);


try{


/* -----------------------------------------
   GET CURRENT LOGGED-IN USER
----------------------------------------- */

const {
data: {
user
},
error: userError
} = await db.auth.getUser();


if(userError){

throw userError;

}


if(!user){

window.location.href =
"login.html";

return;

}


/* -----------------------------------------
   TEACHER ID
-----------------------------------------

   In our system:

   Auth User UUID
        ↓
   teachers.id
        ↓
   students.teacher_id

----------------------------------------- */

const teacherId =
user.id;


/* -----------------------------------------
   LOAD ONLY THIS TEACHER'S STUDENTS
----------------------------------------- */

const {
data: students,
error
} = await db

.from("students")

.select(`
id,
full_name,
father_name,
email,
phone,
course,
status,
teacher_id
`)

.eq(
"teacher_id",
teacherId
)

.order(
"full_name",
{
ascending:true
}
);


if(error){

throw error;

}


/* -----------------------------------------
   NO STUDENTS
----------------------------------------- */

if(
!students ||
students.length === 0
){

rows.innerHTML = `

<tr>

<td
colspan="7"
style="
text-align:center;
padding:25px;
">

No students are currently assigned to you.

</td>

</tr>

`;

return;

}


/* -----------------------------------------
   SHOW STUDENTS
----------------------------------------- */

rows.innerHTML =

students.map(
function(student){

return `

<tr>


<td>

${safeStudentHtml(
student.full_name || ""
)}

</td>


<td>

${safeStudentHtml(
student.father_name || "-"
)}

</td>


<td>

${safeStudentHtml(
student.email || "-"
)}

</td>


<td>

${safeStudentHtml(
student.phone || "-"
)}

</td>


<td>

${safeStudentHtml(
student.course || "-"
)}

</td>


<td>

<strong>

${safeStudentHtml(
student.status || "-"
)}

</strong>

</td>


<td>

<small
style="
font-size:11px;
word-break:break-all;
">

${safeStudentHtml(
student.id || ""
)}

</small>

</td>


</tr>

`;

}).join("");


}


/* =====================================================
   ERROR
===================================================== */

catch(error){


console.error(
"Teacher students error:",
error
);


rows.innerHTML = `

<tr>

<td
colspan="7"
style="
text-align:center;
padding:25px;
">

Unable to load students.

<br>

<small>

${safeStudentHtml(
error.message ||
"Unknown error"
)}

</small>

</td>

</tr>

`;


message.style.display =
"block";


message.style.background =
"#fee2e2";


message.style.color =
"#991b1b";


message.textContent =
error.message ||
"Unable to load students.";

}

}


/* =====================================================
   START
===================================================== */

async function initTeacherStudents(){

try{

/*
   portal.js remains responsible
   for the normal portal session.
*/

await loadMyStudents();

}

catch(error){

console.error(
"Teacher students initialization error:",
error
);

}

}


initTeacherStudents();

</script>
