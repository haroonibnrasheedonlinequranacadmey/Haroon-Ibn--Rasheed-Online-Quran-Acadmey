<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><link rel="stylesheet" href="../css/portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head><body class="dashboard"><header class="topbar"><div class="brand-mini"><img src="../assets/hr-logo.svg"><div><b>Haroon Ibn Rasheed</b><small>Online Quran Academy · Teacher Portal</small></div></div><button class="btn-small logout" onclick="logout()">Logout</button></header><main class="wrap"><div class="card"><h1>Welcome, <span id="name">Teacher</span></h1><p class="empty">Manage today's classes, students and attendance for your assigned classes.</p></div><section class="cards"><div class="card stat"><small>Today's Classes</small><b id="today">0</b></div><div class="card stat"><small>Scheduled</small><b id="scheduled">0</b></div><div class="card stat"><small>Completed</small><b id="completed">0</b></div><div class="card stat"><small>Students Today</small><b id="students">0</b></div></section><div class="card"><h2>My Classes</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Time</th><th>Student</th><th>Course</th><th>Status</th><th>Meeting</th><th>Attendance</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
const cfg=window.SUPABASE_CONFIG||{};const db=window.supabase.createClient(cfg.url,cfg.anonKey);let uid;
async function init(){const s=await db.auth.getSession();if(!s.data.session){location.href='../portal-login.html';return}uid=s.data.session.user.id;const p=await db.from('profiles').select('*').eq('id',uid).single();if(p.error||p.data.role!=='teacher'){location.href='../portal-login.html';return}name.textContent=p.data.full_name||s.data.session.user.email;const {data,error}=await db.from('class_schedule').select('*,courses(title),profiles!class_schedule_student_id_fkey(full_name)').eq('teacher_id',uid).order('class_date',{ascending:true});if(error){rows.innerHTML='<tr><td colspan="7">'+esc(error.message)+'</td></tr>';return}const all=data||[],todayStr=new Date().toISOString().slice(0,10),todayRows=all.filter(x=>x.class_date===todayStr);today.textContent=todayRows.length;scheduled.textContent=all.filter(x=>x.status==='scheduled').length;completed.textContent=all.filter(x=>x.status==='completed').length;students.textContent=new Set(todayRows.map(x=>x.student_id)).size;rows.innerHTML=all.map(x=>`<tr><td>${esc(x.class_date)}</td><td>${esc(x.start_time||'')} ${x.end_time?'– '+esc(x.end_time):''}</td><td>${esc(x.profiles?.full_name||x.student_id||'')}</td><td>${esc(x.courses?.title||'')}</td><td><span class="pill">${esc(x.status)}</span></td><td>${x.meeting_link?`<a class="btn-small" href="${esc(x.meeting_link)}" target="_blank">Join</a>`:'—'}</td><td><select id="att_${x.id}" onchange="saveAttendance('${x.id}','${x.student_id}')"><option value="">Mark</option><option>present</option><option>absent</option><option>late</option></select></td></tr>`).join('')||'<tr><td colspan="7">No assigned classes.</td></tr>'}
async function saveAttendance(scheduleId,studentId){const v=document.getElementById('att_'+scheduleId).value;if(!v)return;const r=await db.from('attendance').upsert({schedule_id:scheduleId,student_id:studentId,teacher_id:uid,status:v},{onConflict:'schedule_id,student_id'});if(r.error)alert(r.error.message)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function logout(){await db.auth.signOut();location.href='../portal-login.html'}init();
</script></body></html>
