<style>
.schedule-page{

}

.schedule-header{

}

  font-weight:700;

.class-actions a:hover{

}

.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

.error-box{
  background:#fff1f1;
  border:1px solid #e3aaaa;
  color:#a33;
  padding:15px;
  border-radius:9px;
  margin-bottom:15px;
}

  color:#fff;

  border-radius:7px;

  font-weight:700;

.refresh-btn:hover{
  opacity:.9;
}

.timezone-info{
  margin-top:5px;
  font-size:13px;
  color:#2f9fba;
  font-weight:600;
}

@media(max-width:700px){
  .schedule-page{
    padding:10px;
  }

  .schedule-header h1{
    font-size:24px;
  }

<script>

/* =========================================================
   DATABASE
========================================================= */

const db = supabase.createClient(
  window.SUPABASE_CONFIG.url,
  window.SUPABASE_CONFIG.anonKey
);


/* =========================================================
   DAYS
========================================================= */

const DAYS = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday",
  "Sunday"
];


const DAY_SHORT = {
  Monday:"Mon",
  Tuesday:"Tue",
  Wednesday:"Wed",
  Thursday:"Thu",
  Friday:"Fri",
  Saturday:"Sat",
  Sunday:"Sun"
};


/* =========================================================
   VARIABLES
========================================================= */

let teacherId = null;
let teacherTimezone = "Asia/Karachi";
let schedules = [];


/*
  Admin Schedule page stores the original
  schedule time in Pakistan timezone.
*/
const ADMIN_TIMEZONE = "Asia/Karachi";


/* =========================================================
   HTML SAFETY
========================================================= */

function safeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   TIME HELPERS
========================================================= */

function timeToMinutes(time){

  if(!time){
    return null;
  }

  const parts =
    String(time).split(":");

  const hour =
    parseInt(parts[0],10);

  const minute =
    parseInt(parts[1] || "0",10);

  if(
    isNaN(hour) ||
    isNaN(minute)
  ){

    return null;

  }

  return (
    hour * 60 +
    minute
  );

}


function formatTime(time){

  const total =
    timeToMinutes(time);

  if(total === null){
    return "";
  }

  let hour =
    Math.floor(total / 60);

  const minute =
    total % 60;

  const ampm =
    hour >= 12
      ? "PM"
      : "AM";

  hour =
    hour % 12;

  if(hour === 0){
    hour = 12;
  }

  return (
    hour +
    ":" +
    String(minute).padStart(2,"0") +
    " " +
    ampm
  );

}


function formatDuration(minutes){

  const m =
    parseInt(minutes,10);

  if(
    !m ||
    m <= 0
  ){

    return "";

  }

  if(m < 60){

    return m + " min";

  }

  const h =
    Math.floor(m / 60);

  const r =
    m % 60;

  if(r === 0){

    return (
      h +
      (
        h === 1
          ? " hour"
          : " hours"
      )
    );

  }

  return (
    h +
    "h " +
    r +
    "m"
  );

}


/* =========================================================
   DAY NORMALIZATION
========================================================= */

function normalizeDay(day){

  if(!day){
    return "";
  }

  const value =
    String(day)
      .trim()
      .toLowerCase();

  const map = {

    mon:"Monday",
    monday:"Monday",

    tue:"Tuesday",
    tues:"Tuesday",
    tuesday:"Tuesday",

    wed:"Wednesday",
    wednesday:"Wednesday",

    thu:"Thursday",
    thur:"Thursday",
    thurs:"Thursday",
    thursday:"Thursday",

    fri:"Friday",
    friday:"Friday",

    sat:"Saturday",
    saturday:"Saturday",

    sun:"Sunday",
    sunday:"Sunday"

  };

  return map[value] || day;

}


/* =========================================================
   DAY INDEX
========================================================= */

function dayIndex(day){

  return DAYS.indexOf(
    normalizeDay(day)
  );

}


/* =========================================================
   GET REFERENCE MONDAY
========================================================= */

function getReferenceMonday(){

  /*
    Use the current date in the ADMIN timezone.
    Then find that week's Monday.
  */

  const now =
    luxon.DateTime.now()
      .setZone(ADMIN_TIMEZONE);

  const isoWeekday =
    now.weekday;

  return now
    .startOf("day")
    .minus({
      days: isoWeekday - 1
    });

}


/* =========================================================
   CONVERT ONE WEEKLY OCCURRENCE
========================================================= */

function convertOccurrence(
  scheduleDay,
  scheduleTime
){

  if(
    !scheduleDay ||
    !scheduleTime
  ){

    return null;

  }


  const normalizedDay =
    normalizeDay(scheduleDay);

  const index =
    dayIndex(normalizedDay);

  if(index < 0){

    return null;

  }


  const monday =
    getReferenceMonday();


  /*
    Build the occurrence in the ADMIN
    timezone first.
  */

  const adminDate =
    monday.plus({
      days:index
    });


  const parts =
    String(scheduleTime)
      .split(":");


  const hour =
    parseInt(parts[0],10) || 0;

  const minute =
    parseInt(parts[1],10) || 0;


  const adminDateTime =
    adminDate
      .set({
        hour:hour,
        minute:minute,
        second:0,
        millisecond:0
      })
      .setZone(
        ADMIN_TIMEZONE
      );


  /*
    Convert to the teacher's saved timezone.
  */

  const teacherDateTime =
    adminDateTime
      .setZone(
        teacherTimezone
      );


  return {
    day:
      teacherDateTime
        .toFormat("cccc"),

    time:
      teacherDateTime
        .toFormat("HH:mm"),

    displayTime:
      teacherDateTime
        .toFormat("h:mm a"),

    date:
      teacherDateTime
        .toISODate(),

    dateTime:
      teacherDateTime

  };

}


/* =========================================================
   CREATE GRID
========================================================= */

function createGrid(
  gridId,
  startHour,
  endHour
){

  const grid =
    document.getElementById(
      gridId
    );

  grid.innerHTML = "";


  let html = "";


  html += `
    <div class="grid-head time-head">
      Time
    </div>
  `;


  DAYS.forEach(day => {

    html += `
      <div class="grid-head">
        ${safeHtml(day)}
      </div>
    `;

  });


  /*
    30 minute slots
  */

  for(
    let minutes =
      startHour * 60;

    minutes <=
      endHour * 60 + 30;

    minutes += 30
  ){

    html += `
      <div class="time-cell">
        ${formatMinutes(minutes)}
      </div>
    `;


    DAYS.forEach(day => {

      html += `
        <div
          class="day-cell"
          data-day="${safeHtml(day)}"
          data-time="${minutes}">
        </div>
      `;

    });

  }


  grid.innerHTML =
    html;

}


/* =========================================================
   FORMAT GRID TIME
========================================================= */

function formatMinutes(total){

  let hour =
    Math.floor(
      total / 60
    );

  const minute =
    total % 60;

  const ampm =
    hour >= 12
      ? "PM"
      : "AM";

  hour =
    hour % 12;

  if(hour === 0){
    hour = 12;
  }

  return (
    hour +
    ":" +
    String(minute).padStart(2,"0") +
    " " +
    ampm
  );

}


/* =========================================================
   RENDER SCHEDULE
========================================================= */

function renderSchedules(){

  createGrid(
    "amGrid",
    0,
    11
  );

  createGrid(
    "pmGrid",
    12,
    23
  );


  if(!schedules.length){

    document.getElementById(
      "amGrid"
    ).innerHTML =
      `
      <div
        class="empty"
        style="grid-column:1/-1">

        No classes scheduled.

      </div>
      `;


    document.getElementById(
      "pmGrid"
    ).innerHTML =
      `
      <div
        class="empty"
        style="grid-column:1/-1">

        No classes scheduled.

      </div>
      `;

    return;

  }


  schedules.forEach(
    schedule => {

      let days =
        schedule.class_days;


      if(
        !Array.isArray(days)
      ){

        days = [days];

      }


      days.forEach(
        rawDay => {

          /*
            Convert the original
            Pakistan schedule into
            teacher local time.
          */

          const occurrence =
            convertOccurrence(
              rawDay,
              schedule.class_time
            );


          if(!occurrence){

            return;

          }


          const day =
            occurrence.day;

          const total =
            timeToMinutes(
              occurrence.time
            );


          if(
            !DAYS.includes(day) ||
            total === null
          ){

            return;

          }


          const targetGrid =
            total < 720
              ? document.getElementById(
                  "amGrid"
                )
              : document.getElementById(
                  "pmGrid"
                );


          const cell =
            targetGrid.querySelector(
              `.day-cell[data-day="${day}"][data-time="${total}"]`
            );


          if(!cell){

            return;

          }


          const student =
            schedule.student_name ||
            "Student";


          const course =
            schedule.course ||
            "Quran";


          const duration =
            formatDuration(
              schedule.duration_minutes
            );


          let actions = "";



          cell.innerHTML += `

            <div class="class-box">

              <strong>
                ${safeHtml(student)}
              </strong>

              <div class="course">
                ${safeHtml(course)}
              </div>

              <div>
                ${safeHtml(
                  occurrence.displayTime
                )}
              </div>

              <div class="duration">
                ${safeHtml(duration)}
              </div>

              ${
                actions
                  ?
                  `
                  <div class="class-actions">
                    ${actions}
                  </div>
                  `
                  :
                  ""
              }

            </div>

          `;

        }
      );

    }
  );

}


/* =========================================================
   LOAD TEACHER SCHEDULE
========================================================= */

async function loadTeacherSchedule(){

  const message =
    document.getElementById(
      "messageArea"
    );


  message.innerHTML = `
    <div class="loading">
      Loading your schedule...
    </div>
  `;


  try{

    /* -----------------------------------------
       AUTH
    ----------------------------------------- */

    const {
      data:{
        user
      },
      error:authError
    } =
      await db.auth.getUser();


    if(authError){

      throw authError;

    }


    if(!user){

      throw new Error(
        "Teacher login session not found. Please login again."
      );

    }


    teacherId =
      user.id;


    /* -----------------------------------------
       TEACHER TIMEZONE
    ----------------------------------------- */

    const teacherResult =
      await db
        .from("teachers")
        .select(
          "id,name,timezone"
        )
        .eq(
          "id",
          teacherId
        )
        .maybeSingle();


    if(
      teacherResult.error
    ){

      throw teacherResult.error;

    }


    /*
      Use saved teacher timezone.
      Fallback remains Pakistan.
    */

    teacherTimezone =
      teacherResult.data?.timezone
      ||
      "Asia/Karachi";


    /*
      Show timezone to teacher.
    */

    document.getElementById(
      "timezoneInfo"
    ).textContent =
      "Your Time Zone: " +
      teacherTimezone;


    /* -----------------------------------------
       SCHEDULES
    ----------------------------------------- */

    const {
      data,
      error
    } =
      await db
        .from("class_schedules")
        .select(`
          id,
          teacher_id,
          student_id,
          course,
          class_days,
          class_time,
          duration_minutes,
          google_meet_url,
          classroom_code,
          active,
          schedule_timezone
        `)
        .eq(
          "teacher_id",
          teacherId
        )
        .eq(
          "active",
          true
        )
        .order(
          "class_time",
          {
            ascending:true
          }
        );


    if(error){

      throw error;

    }


    schedules =
      data || [];


    /*
      Get student names separately.
      This keeps the existing RLS
      and relationship safe.
    */

    const studentIds =
      [
        ...new Set(
          schedules
            .map(
              x => x.student_id
            )
            .filter(Boolean)
        )
      ];


    if(
      studentIds.length
    ){

      const {
        data:students,
        error:studentError
      } =
        await db
          .from("students")
          .select(`
            id,
            user_id,
            account_id,
            full_name
          `)
          .in(
            "id",
            studentIds
          );


      if(studentError){

        console.warn(
          "Student lookup error:",
          studentError
        );

      }else{

        const studentMap = {};

        (students || []).forEach(student => {
          const name = String(student.full_name || "").trim();

          studentMap[String(student.id)] = name;

          if(student.user_id){
            studentMap[String(student.user_id)] = name;
          }

          if(student.account_id){
            studentMap[String(student.account_id)] = name;
          }
        });

        /* If students.full_name is empty, use the linked profile name. */
        const missingProfileIds = (students || [])
          .filter(student =>
            !String(student.full_name || "").trim() &&
            student.user_id
          )
          .map(student => String(student.user_id));

        if(missingProfileIds.length){
          const { data:profiles, error:profileError } =
            await db
              .from("profiles")
              .select("id,full_name")
              .in("id", [...new Set(missingProfileIds)]);

          if(!profileError){
            (profiles || []).forEach(profile => {
              const name = String(profile.full_name || "").trim();
              if(name){
                studentMap[String(profile.id)] = name;
              }
            });
          }
        }


        schedules =
          schedules.map(
            schedule => ({

              ...schedule,

              student_name:
                studentMap[
                  schedule.student_id
                ]
                ||
                "Student"

            })
          );

      }

    }


    /* -----------------------------------------
       DONE
    ----------------------------------------- */

    message.innerHTML = "";


    renderSchedules();


    if(
      !schedules.length
    ){

      message.innerHTML = `
        <div class="empty">
          Admin has not assigned any active classes to your schedule yet.
        </div>
      `;

    }


  }catch(error){

    console.error(
      "Teacher schedule error:",
      error
    );


    message.innerHTML = `

      <div class="error-box">

        <strong>
          Could not load your schedule.
        </strong>

        <br><br>

        ${safeHtml(
          error?.message ||
          "Unknown error"
        )}

      </div>

    `;


    document.getElementById(
      "amGrid"
    ).innerHTML = "";


    document.getElementById(
      "pmGrid"
    ).innerHTML = "";

  }

}


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadTeacherSchedule();

  }
);
