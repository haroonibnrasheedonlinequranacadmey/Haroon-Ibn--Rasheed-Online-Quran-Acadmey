<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Haroon Ibn Rasheed</title><link rel="stylesheet" href="../css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/admin.js"></script></head><body><main class="login-page"><section class="login-card"><img class="logo-img" src="../assets/hr-logo.svg" alt="HR Logo"><h1>Admin Login</h1><p class="muted" style="text-align:center">Haroon Ibn Rasheed Online Quran Academy</p><div id="msg" class="msg"></div><form id="loginForm"><p><label>Email</label><input class="input" id="email" type="email" required></p><p><label>Password</label><input class="input" id="password" type="password" required></p><button class="btn" style="width:100%">Login</button></form><p style="text-align:center"><a href="forgot-password.html" style="color:#087a4b;font-weight:bold">Forgot Password?</a></p><p style="text-align:center"><a href="../index.html" class="muted">← Back to Website</a></p></section></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!window.db){showMsg('msg','Open js/config.js and add your Supabase URL + anon key.','error');return;}showMsg('msg','Signing in...','ok');const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error){showMsg('msg',error.message,'error');return;}const {data:p}=await db.from('profiles').select('role').eq('id',(await db.auth.getUser()).data.user.id).single();if(!p||p.role!=='admin'){await db.auth.signOut();showMsg('msg','This account is not an admin account.','error');return;}location.href='dashboard.html';});</script></body></html>
