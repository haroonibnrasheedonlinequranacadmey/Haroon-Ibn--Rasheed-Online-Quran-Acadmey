<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Admin Login | Haroon Ibn Rasheed</title><link href="../css/admin.css" rel="stylesheet"/><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/admin.js"></script><meta content="Admin Login | Haroon Ibn Rasheed for Haroon Ibn Rasheed Online Quran Academy. Access Quran learning services, student support and academy information." name="description"/><link href="https://haroonibnrasheedonlinequranacadmey.github.io/Haroon-Ibn--Rasheed-Online-Quran-Acadmey/admin/login.html" rel="canonical"/><meta content="Admin Login | Haroon Ibn Rasheed" property="og:title"/><meta content="Admin Login | Haroon Ibn Rasheed for Haroon Ibn Rasheed Online Quran Academy. Access Quran learning services, student support and academy information." property="og:description"/><meta content="https://haroonibnrasheedonlinequranacadmey.github.io/Haroon-Ibn--Rasheed-Online-Quran-Acadmey/admin/login.html" property="og:url"/><meta content="website" property="og:type"/><link href="../assets/hr-logo-round.png" rel="icon" type="image/png"/><style>.skip-link{position:absolute;left:-9999px;top:0;background:#fff;color:#102b46;padding:12px;z-index:99999}.skip-link:focus{left:12px;top:12px}</style></head><body><a class="skip-link" href="#main-content">Skip to main content</a><main class="login-page" id="main-content"><section class="login-card"><img alt="HR Logo" class="logo-img" decoding="async" loading="lazy" src="../assets/hr-logo-round.png"/><h1>Admin Login</h1><p class="muted" style="text-align:center">Haroon Ibn Rasheed Online Quran Academy</p><div class="msg" id="msg"></div><form id="loginForm"><p><label>Email</label><input aria-label="Email" class="input" id="email" required="" type="email"/></p><p><label>Password</label><input aria-label="Password" class="input" id="password" required="" type="password"/></p><button class="btn" style="width:100%">Login</button></form><p style="text-align:center"><a href="forgot-password.html" style="color:#087a4b;font-weight:bold">Forgot Password?</a></p><p style="text-align:center"><a class="muted" href="../index.html">← Back to Website</a></p></section></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!window.db){showMsg('msg','Open js/config.js and add your Supabase URL + anon key.','error');return;}showMsg('msg','Signing in...','ok');const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error){showMsg('msg',error.message,'error');return;}const {data:p}=await db.from('profiles').select('role').eq('id',(await db.auth.getUser()).data.user.id).single();if(!p||p.role!=='admin'){await db.auth.signOut();showMsg('msg','This account is not an admin account.','error');return;}location.href='dashboard.html';});</script></body></html>
