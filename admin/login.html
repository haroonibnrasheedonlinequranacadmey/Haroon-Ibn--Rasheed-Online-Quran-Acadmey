<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Haroon Ibn Rasheed Online Quran Academy</title><link rel="stylesheet" href="../css/portal.css"></head><body class="login"><div class="loginbox center"><div class="loginlogo">HR</div><h1>Academy Portal</h1><p class="muted">Sign in to your account</p><div id="msg" class="msg" hidden></div><form id="login"><div class="field" style="text-align:left"><label>Email</label><input id="email" class="input" type="email" required></div><div class="field" style="text-align:left"><label>Password</label><input id="password" class="input" type="password" required></div><button class="btn" style="width:100%;margin-top:10px">Login</button></form><p><a href="forgot-password.html">Forgot password?</a> · <a href="register.html">Create account</a></p><p><a href="../index.html">← Public website</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>const db=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);const M=(t,c='ok')=>{let e=document.querySelector('#msg');e.hidden=false;e.className='msg '+c;e.textContent=t};document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return M(r.error.message,'error');let p=await db.from('profiles').select('role').eq('id',r.data.user.id).single();if(p.error){await db.auth.signOut();return M('Profile not ready. Run the final Supabase SQL first.','error')}location.href=p.data.role==='admin'?'index.html':p.data.role==='teacher'?'../teacher/index.html':'../student/index.html'}</script></body></html>
