<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="../css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/admin.js"></script></head><body><div class="admin-layout"><aside class="sidebar"><div class="brand">HR Admin<span>Haroon Ibn Rasheed Online Quran Academy</span></div><nav class="nav"><a class="active" href="dashboard.html">Dashboard</a><a href="admissions.html">Admissions / Leads</a><a href="students.html">Students</a><a href="teachers.html">Teachers</a><a href="courses.html">Courses</a><a href="fees.html">Fees</a><a href="faqs.html">FAQs</a><a href="content.html">Website Content</a><a href="settings.html">Settings</a><a href="../index.html">View Website</a><a href="#" onclick="logout();return false">Logout</a></nav></aside><main class="main"><div class="top"><div><h1>Dashboard</h1><span class="muted">Welcome, <b data-admin-name>Admin</b></span></div></div><div class="stats"><div class="card stat"><small>Total Leads</small><b id="total">—</b></div><div class="card stat"><small>New Leads</small><b id="new">—</b></div><div class="card stat"><small>Contacted</small><b id="contacted">—</b></div><div class="card stat"><small>Enrolled</small><b id="enrolled">—</b></div></div><div class="card"><h2>Recent Admissions</h2><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Course</th><th>WhatsApp</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script>(async()=>{if(!window.db){location.href='login.html';return}const g=await adminGuard();if(!g)return;const {data,error}=await db.from('admissions').select('*').order('created_at',{ascending:false}).limit(10);if(error){document.getElementById('rows').innerHTML='<tr><td colspan="5">'+escapeHtml(error.message)+'</td></tr>';return;}document.getElementById('total').textContent=data.length;document.getElementById('new').textContent=data.filter(x=>x.status==='new').length;document.getElementById('contacted').textContent=data.filter(x=>x.status==='contacted').length;document.getElementById('enrolled').textContent=data.filter(x=>x.status==='enrolled').length;document.getElementById('rows').innerHTML=data.map(x=>`<tr><td>${escapeHtml(x.student_name)}</td><td>${escapeHtml(x.course)}</td><td>${escapeHtml(x.phone)}</td><td>${escapeHtml(x.status)}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="5">No admissions yet.</td></tr>';})();</script></body></html>
