<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admissions / Leads</title><link rel="stylesheet" href="../css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/admin.js"></script></head><body><div class="admin-layout"><aside class="sidebar"><div class="brand">HR Admin<span>Admissions Management</span></div><nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="admissions.html">Admissions / Leads</a><a href="students.html">Students</a><a href="teachers.html">Teachers</a><a href="courses.html">Courses</a><a href="fees.html">Fees</a><a href="faqs.html">FAQs</a><a href="content.html">Website Content</a><a href="settings.html">Settings</a><a href="../index.html">View Website</a><a href="#" onclick="logout();return false">Logout</a></nav></aside><main class="main"><div class="top"><h1>Admissions / Leads</h1><button class="btn" onclick="load()">Refresh</button></div><div id="msg" class="msg"></div><div class="card"><input id="search" class="input" placeholder="Search student, phone, email or course..." oninput="render()"></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Father</th><th>Phone</th><th>Email</th><th>Course</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script>let data=[];async function load(){const g=await adminGuard();if(!g)return;const r=await db.from('admissions').select('*').order('created_at',{ascending:false});if(r.error){showMsg('msg',r.error.message,'error');return}data=r.data||[];render()}function render(){const q=(document.getElementById('search').value||'').toLowerCase();const list=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('rows').innerHTML=list.map(x=>`<tr><td>${escapeHtml(x.student_name)}</td><td>${escapeHtml(x.father_name)}</td><td>${escapeHtml(x.phone)}</td><td>${escapeHtml(x.email||'')}</td><td>${escapeHtml(x.course)}</td><td><select onchange="status('${x.id}',this.value)"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='contacted'?'selected':''}>contacted</option><option ${x.status==='trial'?'selected':''}>trial</option><option ${x.status==='enrolled'?'selected':''}>enrolled</option><option ${x.status==='rejected'?'selected':''}>rejected</option></select></td><td>${new Date(x.created_at).toLocaleString()}</td><td><button class="btn danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="8">No admissions found.</td></tr>'}async function status(id,value){const {error}=await db.from('admissions').update({status:value}).eq('id',id);if(error)showMsg('msg',error.message,'error')}async function del(id){if(!confirm('Delete this admission?'))return;const {error}=await db.from('admissions').delete().eq('id',id);if(error)showMsg('msg',error.message,'error');else load()}load();</script></body></html>
