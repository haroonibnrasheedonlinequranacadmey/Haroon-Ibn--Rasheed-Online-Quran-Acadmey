<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password</title><link rel="stylesheet" href="../css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head><body><main class="login-page"><section class="login-card"><div class="logo">HR</div><h1>Set New Password</h1><div id="msg" class="msg"></div><form id="f"><p><label>New Password</label><input class="input" id="password" type="password" minlength="6" required></p><p><label>Confirm Password</label><input class="input" id="confirm" type="password" minlength="6" required></p><button class="btn" style="width:100%">Update Password</button></form></section></main><script>const cfg=window.SUPABASE_CONFIG||{};const db=window.supabase.createClient(cfg.url,cfg.anonKey);f.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirm.value){showMsg('msg','Passwords do not match.','error');return;}const {error}=await db.auth.updateUser({password:password.value});if(error)showMsg('msg',error.message,'error');else{showMsg('msg','Password updated. Redirecting to login...','ok');setTimeout(()=>location.href='login.html',1200)}});function showMsg(id,text,type){const e=document.getElementById(id);e.textContent=text;e.className='msg show '+type;}</script></body></html>
