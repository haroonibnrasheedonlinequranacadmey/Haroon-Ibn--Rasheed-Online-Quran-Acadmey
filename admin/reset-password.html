<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password</title><link rel="stylesheet" href="../css/portal.css"></head><body class="login"><div class="loginbox"><div class="loginlogo">HR</div><h1>Set New Password</h1><div id="msg" class="msg" hidden></div><form id="f"><div class="field"><label>New password</label><input id="password" class="input" type="password" minlength="6" required></div><button class="btn">Update Password</button></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>const db=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);async function init(){let q=new URLSearchParams(location.hash.slice(1));if(q.get('access_token'))await db.auth.setSession({access_token:q.get('access_token'),refresh_token:q.get('refresh_token')||''});let s=await db.auth.getSession();if(!s.data.session){show('Auth session missing. Open the reset link from your email again.','error')}}function show(t,c='ok'){let e=document.querySelector('#msg');e.hidden=false;e.className='msg '+c;e.textContent=t}f.onsubmit=async e=>{e.preventDefault();let r=await db.auth.updateUser({password:password.value});if(r.error)return show(r.error.message,'error');show('Password updated. You can now login.');setTimeout(()=>location.href='login.html',1000)};init()</script></body></html>
