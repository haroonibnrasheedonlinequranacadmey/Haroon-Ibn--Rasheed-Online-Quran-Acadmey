<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Set New Password</title><link href="../css/admin.css" rel="stylesheet"/><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><meta content="Set New Password for Haroon Ibn Rasheed Online Quran Academy. Access Quran learning services, student support and academy information." name="description"/><link href="https://haroonibnrasheedonlinequranacadmey.github.io/Haroon-Ibn--Rasheed-Online-Quran-Acadmey/admin/reset-password.html" rel="canonical"/><meta content="Set New Password" property="og:title"/><meta content="Set New Password for Haroon Ibn Rasheed Online Quran Academy. Access Quran learning services, student support and academy information." property="og:description"/><meta content="https://haroonibnrasheedonlinequranacadmey.github.io/Haroon-Ibn--Rasheed-Online-Quran-Acadmey/admin/reset-password.html" property="og:url"/><meta content="website" property="og:type"/><link href="../assets/hr-logo-round.png" rel="icon" type="image/png"/><style>.skip-link{position:absolute;left:-9999px;top:0;background:#fff;color:#102b46;padding:12px;z-index:99999}.skip-link:focus{left:12px;top:12px}</style></head><body><a class="skip-link" href="#main-content">Skip to main content</a><main class="login-page" id="main-content"><section class="login-card"><img alt="HR Logo" class="logo-img" decoding="async" loading="lazy" src="../assets/hr-logo-round.png"/><h1>Set New Password</h1><div class="msg" id="msg"></div><form id="f"><p><label>New Password</label><input aria-label="Password" class="input" id="password" minlength="6" required="" type="password"/></p><p><label>Confirm Password</label><input aria-label="Confirm" class="input" id="confirm" minlength="6" required="" type="password"/></p><button class="btn" style="width:100%">Update Password</button></form></section></main><script>const cfg=window.SUPABASE_CONFIG||{};const db=window.supabase.createClient(cfg.url,cfg.anonKey);f.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirm.value){showMsg('msg','Passwords do not match.','error');return;}const {error}=await db.auth.updateUser({password:password.value});if(error)showMsg('msg',error.message,'error');else{showMsg('msg','Password updated. Redirecting to login...','ok');setTimeout(()=>location.href='login.html',1200)}});function showMsg(id,text,type){const e=document.getElementById(id);e.textContent=text;e.className='msg show '+type;}</script></body></html>
