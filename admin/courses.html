<script>

/* =====================================================
   SAFE HTML FUNCTION
===================================================== */

function safeStudentHtml(value){

if(
value === null ||
value === undefined
){

return "";

}

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   COURSE IMAGE FUNCTION
===================================================== */

function getCourseImage(course){

const name =
String(course || "")
.toLowerCase()
.trim();


if(
name.includes("noorani") ||
name.includes("qaida")
){

return "../course_materials/noorani_qaida.jpg";

}


if(
name.includes("memorization") ||
name.includes("hifz") ||
name.includes("memorisation")
){

return "../course_materials/quran_memorization.jpg";

}


if(
name.includes("islamic") ||
name.includes("kids")
){

return "../course_materials/islamic_studies_kids.jpg";

}


if(
name.includes("tajweed") ||
name.includes("tajwid")
){

return "../course_materials/tajweed.jpg";

}


if(
name.includes("translation") ||
name.includes("tarjuma")
){

return "../course_materials/quran_translation.jpg";

}


if(
name.includes("qiraat") ||
name.includes("qira'at") ||
name.includes("reading") ||
name.includes("nazra")
){

return "../course_materials/qiraat.jpg";

}


/* Default course image */

return "../course_materials/qiraat.jpg";

}


/* =====================================================
   COURSE NAME
===================================================== */

function getCourseName(course){

const name =
String(course || "")
.toLowerCase()
.trim();


if(
name.includes("noorani") ||
name.includes("qaida")
){

return "Noorani Qaida";

}


if(
name.includes("memorization") ||
name.includes("hifz") ||
name.includes("memorisation")
){

return "Quran Memorization";

}


if(
name.includes("islamic") ||
name.includes("kids")
){

return "Islamic Studies for Kids";

}


if(
name.includes("tajweed") ||
name.includes("tajwid")
){

return "Rules of Tajweed";

}


if(
name.includes("translation") ||
name.includes("tarjuma")
){

return "Quran Translation";

}


if(
name.includes("qiraat") ||
name.includes("qira'at")
){

return "Qira'at";

}


if(
name.includes("reading") ||
name.includes("nazra")
){

return "Quran Reading";

}


return course || "-";

}


/* =====================================================
   TEACHER STUDENTS
===================================================== */

async function loadMyStudents(){


const rows =
document.getElementById(
"studentRows"
);


const message =
document.getElementById(
"studentMessage"
);


try{


/* -----------------------------------------
   GET CURRENT LOGGED-IN USER
----------------------------------------- */

const {
data: {
user
},
error: userError
} = await db.auth.getUser();


if(userError){

throw userError;

}


if(!user){

window.location.href =
"login.html";

return;

}


/* -----------------------------------------
   TEACHER ID
----------------------------------------- */

const teacherId =
user.id;


/* -----------------------------------------
   LOAD ONLY THIS TEACHER'S STUDENTS
----------------------------------------- */

const {
data: students,
error
} = await db

.from("students")

.select(`
id,
full_name,
father_name,
email,
phone,
course,
status,
teacher_id
`)

.eq(
"teacher_id",
teacherId
)

.order(
"full_name",
{
ascending:true
}
);


if(error){

throw error;

}


/* -----------------------------------------
   NO STUDENTS
----------------------------------------- */

if(
!students ||
students.length === 0
){

rows.innerHTML = `

<tr>

<td
colspan="7"
style="
text-align:center;
padding:25px;
">

No students are currently assigned to you.

</td>

</tr>

`;

return;

}


/* -----------------------------------------
   SHOW STUDENTS
----------------------------------------- */

rows.innerHTML =

students.map(
function(student){

const course =
student.course || "";


const courseImage =
getCourseImage(course);


const courseName =
getCourseName(course);


return `

<tr>


<td>

${safeStudentHtml(
student.full_name || ""
)}

</td>


<td>

${safeStudentHtml(
student.father_name || "-"
)}

</td>


<td>

${safeStudentHtml(
student.email || "-"
)}

</td>


<td>

${safeStudentHtml(
student.phone || "-"
)}

</td>


<td>

<div class="course-box">

<img
src="${courseImage}"
alt="${safeStudentHtml(courseName)}"
onerror="this.style.display='none'"
>

<span class="course-name">

${safeStudentHtml(courseName)}

</span>

</div>

</td>


<td>

<strong>

${safeStudentHtml(
student.status || "-"
)}

</strong>

</td>


<td>

<small
style="
font-size:11px;
word-break:break-all;
">

${safeStudentHtml(
student.id || ""
)}

</small>

</td>


</tr>

`;

}).join("");


}


/* =====================================================
   ERROR
===================================================== */

catch(error){


console.error(
"Teacher students error:",
error
);


rows.innerHTML = `

<tr>

<td
colspan="7"
style="
text-align:center;
padding:25px;
">

Unable to load students.

<br>

<small>

${safeStudentHtml(
error.message ||
"Unknown error"
)}

</small>

</td>

</tr>

`;


message.style.display =
"block";


message.style.background =
"#fee2e2";


message.style.color =
"#991b1b";


message.textContent =
error.message ||
"Unable to load students.";

}

}


/* =====================================================
   START
===================================================== */

async function initTeacherStudents(){

try{

await loadMyStudents();

}

catch(error){

console.error(
"Teacher students initialization error:",
error
);

}

}


initTeacherStudents();

</script>
