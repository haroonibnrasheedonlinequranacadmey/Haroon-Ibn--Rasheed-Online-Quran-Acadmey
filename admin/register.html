<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Student Account</title><link rel="stylesheet" href="../css/portal.css"></head><body class="login"><div class="loginbox"><div class="loginlogo">HR</div><h1>Create Student Account</h1><p class="muted">New accounts are created as Student. Admin can promote a user to Teacher when needed.</p><div id="msg" class="msg" hidden></div><form id="reg"><div class="field"><label>Full name</label><input id="name" class="input" required></div><div class="field"><label>Email</label><input id="email" class="input" type="email" required></div><div class="field"><label>Password (min 6 characters)</label><input id="password" class="input" type="password" minlength="6" required></div><button class="btn">Create Account</button></form><p><a href="login.html">Back to login</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>const db=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);const M=(t,c='ok')=>{let e=document.querySelector('#msg');e.hidden=false;e.className='msg '+c;e.textContent=t};document.querySelector('#reg').onsubmit=async e=>{e.preventDefault();let r=await db.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:name.value.trim()}}});if(r.error)return M(r.error.message,'error');M('Account created. Check your email if confirmation is enabled, then login.');}</script></body></html>
