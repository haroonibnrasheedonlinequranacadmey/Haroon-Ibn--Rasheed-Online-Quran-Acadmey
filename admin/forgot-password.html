<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><link rel="stylesheet" href="../css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/admin.js"></script></head><body><main class="login-page"><section class="login-card"><img class="logo-img" src="../assets/hr-logo.svg" alt="HR Logo"><h1>Reset Password</h1><p class="muted">Enter your admin email and we will send a password reset link.</p><div id="msg" class="msg"></div><form id="f"><p><label>Email</label><input class="input" id="email" type="email" required></p><button class="btn" style="width:100%">Send Reset Link</button></form><p style="text-align:center"><a href="login.html">← Back to Login</a></p></section></main><script>f.addEventListener('submit',async e=>{e.preventDefault();if(!window.db){showMsg('msg','Configure Supabase first.','error');return;}const {error}=await db.auth.resetPasswordForEmail(email.value,{redirectTo:location.origin+location.pathname.replace('forgot-password.html','reset-password.html')});if(error)showMsg('msg',error.message,'error');else showMsg('msg','Reset link sent. Check your email.','ok');});</script></body></html>
