<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><link rel="stylesheet" href="../css/portal.css"></head><body class="login"><div class="loginbox"><div class="loginlogo">HR</div><h1>Reset Password</h1><div id="msg" class="msg" hidden></div><form id="f"><div class="field"><label>Email</label><input id="email" class="input" type="email" required></div><button class="btn">Send Reset Link</button></form><p><a href="login.html">Back to login</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>const db=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);f.onsubmit=async e=>{e.preventDefault();let r=await db.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+location.pathname.replace('forgot-password.html','reset-password.html')});let m=document.querySelector('#msg');m.hidden=false;m.className='msg '+(r.error?'error':'');m.textContent=r.error?r.error.message:'Reset link sent. Check your email.'}</script></body></html>
