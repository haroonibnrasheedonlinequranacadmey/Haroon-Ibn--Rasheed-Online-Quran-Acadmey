<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — Haroon Ibn Rasheed Online Quran Academy</title><link rel="stylesheet" href="../css/portal.css"></head><body>
<header class="top"><div class="brand"><div class="logo">HR</div><div>Haroon Ibn Rasheed<br><small>Online Quran Academy</small></div></div><nav class="nav"><a href="index.html#dashboard">Dashboard</a><a href="index.html#students">Students</a><a href="index.html#teachers">Teachers</a><a href="index.html#courses">Courses</a><a href="index.html#admissions">Admissions</a><a href="index.html#fees">Fees</a><a href="index.html#payments">Payments</a><a href="index.html#schedules">Schedule</a><a href="index.html#classes">Classes</a><a href="index.html#attendance">Attendance</a><a href="index.html#leaves">Leaves</a><a href="index.html#salaries">Salaries</a><a href="index.html#faqs">FAQs</a><a href="index.html#content">Content</a><a href="index.html#settings">Settings</a><a href="../index.html">Website</a><button onclick="logout()">Logout</button></nav></header>
<main class="wrap"><div id="msg" class="msg" hidden></div><div id="app"><div class="card">Loading…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/core.js"></script><script>
const defs={
students:{title:'Students',table:'students',fields:[['full_name','Full name','text'],['father_name','Father','text'],['phone','Phone','text'],['email','Email','email'],['user_id','Auth User ID','text'],['teacher_id','Teacher','teacher'],['course_id','Course','course'],['status','Status','text']]},
teachers:{title:'Teachers',table:'teachers',fields:[['name','Name','text'],['gender','Gender','text'],['bio','Bio','textarea'],['image_url','Image URL','url'],['user_id','Auth User ID','text'],['active','Active','boolean']]},
courses:{title:'Courses',table:'courses',fields:[['title','Title','text'],['description','Description','textarea'],['image_url','Image URL','url'],['link_url','Course Link','url'],['active','Active','boolean']]},
fees:{title:'Fees',table:'fees',fields:[['country','Country','text'],['course','Course','text'],['amount','Amount','text'],['currency','Currency','text'],['period','Period','text'],['active','Active','boolean']]},
faqs:{title:'FAQs',table:'faqs',fields:[['question','Question','text'],['answer','Answer','textarea'],['active','Active','boolean']]},
content:{title:'Website Content',table:'site_content',fields:[['content_key','Key','text'],['content_value','Value','textarea']]},
settings:{title:'Settings',table:'site_settings',fields:[['setting_key','Key','text'],['setting_value','Value','textarea']]},
admissions:{title:'Admissions',table:'admissions',fields:[['student_name','Student','text'],['father_name','Father','text'],['age','Age','number'],['phone','Phone','text'],['email','Email','email'],['course','Course','text'],['message','Message','textarea'],['status','Status','text'],['admin_notes','Admin notes','textarea']]},
schedules:{title:'Schedules',table:'schedules',fields:[['teacher_id','Teacher','teacher'],['student_id','Student','student'],['course_id','Course','course'],['class_date','Date','date'],['start_time','Start','time'],['end_time','End','time'],['meeting_url','Meeting URL','url'],['status','Status','text'],['notes','Notes','textarea']]},
classes:{title:'Classes',table:'classes',fields:[['schedule_id','Schedule ID','text'],['teacher_id','Teacher','teacher'],['student_id','Student','student'],['course_id','Course','course'],['class_date','Date','date'],['status','Status','text'],['meeting_url','Meeting URL','url'],['lesson_notes','Lesson notes','textarea']]},
attendance:{title:'Attendance',table:'attendance',fields:[['class_id','Class ID','text'],['student_id','Student','student'],['teacher_id','Teacher','teacher'],['attendance_date','Date','date'],['status','Status','text'],['notes','Notes','textarea']]},
leaves:{title:'Leaves',table:'leaves',fields:[['requester_profile_id','Requester profile ID','text'],['teacher_id','Teacher','teacher'],['student_id','Student','student'],['start_date','Start','date'],['end_date','End','date'],['reason','Reason','textarea'],['status','Status','text'],['admin_notes','Admin notes','textarea']]},
salaries:{title:'Teacher Salaries',table:'teacher_salaries',fields:[['teacher_id','Teacher','teacher'],['salary_month','Month','date'],['amount','Amount','number'],['currency','Currency','text'],['status','Status','text'],['paid_at','Paid at','datetime'],['notes','Notes','textarea']]},
payments:{title:'Student Payments',table:'student_payments',fields:[['student_id','Student','student'],['payment_month','Month','date'],['amount','Amount','number'],['currency','Currency','text'],['method','Method','text'],['reference','Reference','text'],['status','Status','text'],['paid_at','Paid at','datetime'],['notes','Notes','textarea']]},
profiles:{title:'User Roles',table:'profiles',fields:[['full_name','Full name','text'],['role','Role (admin/teacher/student)','text']]}
};
let A={def:null,rows:[],edit:null};
async function opts(type){let table=type==='teacher'?'teachers':type==='student'?'students':'courses',col=type==='course'?'title':'name';let q=await db.from(table).select('id,'+col).order(col);return {data:q.data||[],col}}
async function field(f,v=''){let[k,l,t]=f;if(t==='boolean')return `<div class="field"><label>${l}</label><select class="input" id="f_${k}"><option value="true" ${v?'selected':''}>Yes</option><option value="false" ${!v?'selected':''}>No</option></select></div>`;if(['teacher','student','course'].includes(t)){let o=await opts(t);return `<div class="field"><label>${l}</label><select class="input" id="f_${k}"><option value="">Select...</option>${o.data.map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${esc(x[o.col])}</option>`).join('')}</select></div>`}let inp=t==='textarea'?`<textarea id="f_${k}" class="input" rows="3">${esc(v)}</textarea>`:`<input id="f_${k}" class="input" type="${t}" value="${esc(v)}">`;return `<div class="field"><label>${l}</label>${inp}</div>`}
async function show(section){A.def=defs[section];A.edit=null;if(!A.def)return dashboard();let d=A.def;document.querySelector('#app').innerHTML=`<h1>${d.title}</h1><div class="card"><form id="form" class="formgrid"></form><div class="actions"><button class="btn">Save</button><button type="button" class="btn secondary" onclick="show('${section}')">Clear</button></div></div><br><div class="card tablewrap"><table class="table"><thead id="th"></thead><tbody id="tb"></tbody></table></div>`;document.querySelector('#form').innerHTML=(await Promise.all(d.fields.map(f=>field(f)))).join('');document.querySelector('#form').onsubmit=save;await load()}
async function load(){let q=await db.from(A.def.table).select('*').order('created_at',{ascending:false});if(q.error)return msg(q.error.message,'error');A.rows=q.data||[];document.querySelector('#th').innerHTML='<tr>'+A.def.fields.map(f=>`<th>${f[1]}</th>`).join('')+'<th>Actions</th></tr>';document.querySelector('#tb').innerHTML=A.rows.map(x=>`<tr>${A.def.fields.map(f=>`<td>${esc(x[f[0]])}</td>`).join('')}<td class="row-actions"><button class="btn secondary" onclick="edit('${x.id}')">Edit</button><button class="btn danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||`<tr><td colspan="${A.def.fields.length+1}" class="empty">No records yet.</td></tr>`}
async function edit(id){let x=A.rows.find(r=>r.id===id);A.edit=id;document.querySelector('#form').innerHTML=(await Promise.all(A.def.fields.map(f=>field(f,x[f[0]])))).join('');window.scrollTo({top:0,behavior:'smooth'})}
async function save(e){e.preventDefault();let p={};for(let[k,l,t] of A.def.fields){let v=document.querySelector('#f_'+k).value;if(t==='number')v=v===''?null:Number(v);if(t==='boolean')v=v==='true';if(t==='datetime')v=v?new Date(v).toISOString():null;p[k]=v===''?null:v}let q=A.edit?await db.from(A.def.table).update(p).eq('id',A.edit):await db.from(A.def.table).insert(p);if(q.error)return msg(q.error.message,'error');msg(A.edit?'Updated successfully.':'Added successfully.');await show(A.def.table==='student_payments'?'payments':Object.keys(defs).find(k=>defs[k].table===A.def.table))}
async function del(id){if(!confirm('Delete this record?'))return;let q=await db.from(A.def.table).delete().eq('id',id);if(q.error)msg(q.error.message,'error');else load()}
async function dashboard(){let ts=['students','teachers','courses','admissions','schedules','classes','attendance','leaves','teacher_salaries','student_payments'];let c={};await Promise.all(ts.map(async t=>{let q=await db.from(t).select('*',{count:'exact',head:true});c[t]=q.count||0}));document.querySelector('#app').innerHTML=`<h1>Admin Dashboard</h1><p class="muted">Complete academy administration.</p><div class="grid">${ts.map(t=>`<a class="card" href="#${t==='student_payments'?'payments':t}"><div class="stat">${c[t]}</div><b>${defs[t==='student_payments'?'payments':t]?.title||t}</b></a>`).join('')}</div><br><div class="card notice"><b>User account workflow:</b> New users register through Supabase Auth. Admin can change their profile role in User Roles; the database trigger creates the Teacher/Student record automatically. Use the resulting Auth User ID when linking records.</div>`}
async function boot(){let x=await requireRole('admin');if(!x)return;route();onhashchange=route}
function route(){let s=location.hash.slice(1)||'dashboard';if(s==='dashboard')dashboard();else show(s)}
boot();
</script></body></html>
