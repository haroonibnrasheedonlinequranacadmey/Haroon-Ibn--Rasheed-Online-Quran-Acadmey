<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Account Credentials | Haroon Ibn Rasheed Online Quran Academy</title>

  <link rel="stylesheet" href="../css/portal.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/portal.js"></script>
</head>

<body class="dashboard" data-page="admin-accounts">

  <header class="topbar">
    <div class="brand">
      <img src="../assets/hr-logo.svg" alt="HR Logo">
      <div>
        <h1>Haroon Ibn Rasheed</h1>
        <span>Online Quran Academy</span>
      </div>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <main class="portal-container">

    <div class="page-header">
      <div>
        <h2>Account Credentials</h2>
        <p>Teacher & Student account information</p>
      </div>
    </div>

    <!-- Add Account -->
    <section class="portal-card">

      <h3>Add Account</h3>

      <form id="accountForm">

        <div class="form-grid">

          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              id="accountName"
              placeholder="Enter full name"
              required
            >
          </div>

          <div class="form-group">
            <label>Role</label>
            <select id="accountRole" required>
              <option value="">Select Role</option>
              <option value="teacher">Teacher</option>
              <option value="student">Student</option>
            </select>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="accountEmail"
              placeholder="example@email.com"
              required
            >
          </div>

          <div class="form-group">
            <label>Password</label>
            <input
              type="text"
              id="accountPassword"
              placeholder="Enter password"
              required
            >
          </div>

          <div class="form-group">
            <label>Account UUID</label>
            <input
              type="text"
              id="accountUUID"
              placeholder="Paste Supabase User UUID"
            >
          </div>

        </div>

        <button type="submit" class="btn-primary">
          Save Account
        </button>

      </form>

    </section>


    <!-- Saved Accounts -->
    <section class="portal-card">

      <div class="section-heading">
        <div>
          <h3>Saved Accounts</h3>
          <p>Only Admin should have access to these credentials.</p>
        </div>
      </div>

      <div class="table-wrapper">

        <table class="portal-table">

          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Email</th>
              <th>Password</th>
              <th>UUID</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="accountsRows">

            <tr>
              <td colspan="6" style="text-align:center;">
                No accounts saved yet.
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>


  <script>

    /*
      Account page logic will be connected
      to Supabase database in the next step.
    */

    document
      .getElementById("accountForm")
      .addEventListener("submit", function(e){

        e.preventDefault();

        alert(
          "Account form ready. Database connection will be added next."
        );

      });

  </script>

</body>
</html>
