<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student / Teacher Login | Haroon Ibn Rasheed</title><link rel="stylesheet" href="css/portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script></head><body><main class="auth-page"><section class="auth-card"><img src="assets/hr-logo.svg" class="auth-logo"><h1>Student / Teacher Portal</h1><p>Sign in to your academy account.</p><div id="msg" class="msg"></div><form id="login"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Login</button></form><div class="links"><a href="register.html">Create Student Account</a><a href="index.html">Back to Website</a></div></section></main><script>
const cfg=window.SUPABASE_CONFIG||{};const db=window.supabase.createClient(cfg.url,cfg.anonKey);
login.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in...';const r=await db.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){msg.textContent=r.error.message;return}const u=await db.auth.getUser();const p=await db.from('profiles').select('role').eq('id',u.data.user.id).single();if(p.error||!p.data){msg.textContent='Profile not found. Run the latest Supabase schema.';return}if(p.data.role==='student')location.href='student/dashboard.html';else if(p.data.role==='teacher')location.href='teacher/dashboard.html';else location.href='admin/dashboard.html';});
</script></body></html>
