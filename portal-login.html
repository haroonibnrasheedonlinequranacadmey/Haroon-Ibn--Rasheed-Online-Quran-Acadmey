<p>Sign in to your academy account.</p>
<div class="msg" id="msg"></div>
<form id="login">
<label>
Email
<input aria-label="Email" id="email" required="" type="email"/>

<script>

"use strict";


/* =========================
   SUPABASE
========================= */

const cfg = window.SUPABASE_CONFIG || {};

const db = window.supabase.createClient(
    cfg.url,
    cfg.anonKey
);


/* =========================
   ELEMENTS
========================= */

const loginForm =
    document.getElementById("login");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const message =
    document.getElementById("msg");


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        message.textContent =
            "Signing in...";


        try {

            /* LOGIN */

            const loginResult =
                await db.auth.signInWithPassword({

                    email:
                        emailInput.value.trim(),

                    password:
                        passwordInput.value

                });


            if(loginResult.error){

                message.textContent =
                    loginResult.error.message;

                return;
            }


            const user =
                loginResult.data.user;


            if(!user){

                message.textContent =
                    "User account not found.";

                return;
            }


            /* =========================
               GET PROFILE ROLE
            ========================= */

            const profileResult =
                await db
                    .from("profiles")
                    .select(
                        "id,full_name,role"
                    )
                    .eq("id", user.id)
                    .maybeSingle();


            if(profileResult.error){

                message.textContent =
                    "Profile error: " +
                    profileResult.error.message;

                return;
            }


            if(!profileResult.data){

                message.textContent =
                    "Profile not found for this account.";

                return;
            }


            /* =========================
               NORMALIZE ROLE
            ========================= */

            const role =
                String(
                    profileResult.data.role || ""
                )
                .trim()
                .toLowerCase();


            /*
             * Debug information.
             * This helps us confirm exactly
             * which account and role logged in.
             */

            console.log(
                "Logged in User ID:",
                user.id
            );

            console.log(
                "Profile:",
                profileResult.data
            );

            console.log(
                "Detected Role:",
                role
            );


            /* =========================
               TEACHER
            ========================= */

            if(role === "teacher"){

                message.textContent =
                    "Opening Teacher Portal...";

                window.location.href =
                    "teacher/dashboard.html";

                return;
            }


            /* =========================
               STUDENT
            ========================= */

            if(role === "student"){

                message.textContent =
                    "Opening Student Portal...";

                window.location.href =
                    "student/dashboard.html";

                return;
            }


            /* =========================
               ADMIN
            ========================= */

            if(role === "admin"){

                message.textContent =
                    "Opening Admin Portal...";

                window.location.href =
                    "admin/dashboard.html";

                return;
            }


            /* =========================
               UNKNOWN ROLE
            ========================= */

            message.textContent =
                "Unknown account role: " + role;


        } catch(error){

            console.error(
                "Login error:",
                error
            );

            message.textContent =
                "Login error: " +
                (error.message || error);
        }

    }
);

</script>
