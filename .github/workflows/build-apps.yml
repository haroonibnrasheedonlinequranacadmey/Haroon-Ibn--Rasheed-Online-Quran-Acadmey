name: Build Android, Windows and Mac Apps

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "android-app/**"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # v4 no longer requests Google's removed "tools" SDK package.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor
        working-directory: android-app
        run: npm install

      - name: Create Android project
        working-directory: android-app
        run: npx cap add android

      - name: Sync Android project
        working-directory: android-app
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release-files
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk release-files/Haroon-Academy-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-files/Haroon-Academy-Android.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
            file: "desktop/dist/Haroon-Academy-Windows-Setup.exe"
            artifact: windows-installer
          - os: macos-latest
            command: dist:mac
            file: "desktop/dist/Haroon-Academy-macOS.dmg"
            artifact: mac-installer

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build installer
        working-directory: desktop
        run: npm run ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Haroon Academy Apps v1.0.${{ github.run_number }}
          files: |
            release-files/Haroon-Academy-Android.apk
            release-files/Haroon-Academy-Windows-Setup.exe
            release-files/Haroon-Academy-macOS.dmg
          generate_release_notes: true
